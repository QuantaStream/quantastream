name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  refactor-unit-tests:
    name: core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Test all packages
        run: go test ./... -count=1
