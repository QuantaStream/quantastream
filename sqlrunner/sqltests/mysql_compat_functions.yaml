version: 1
name: mysql_compat_functions

tests:
  - id: mysql_compat_functions.001.string_case
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, lower, upper]
    sql: |
      select lower('SEATTLE') as city_lower, upper('tacoma') as city_upper
    expect:
      columns: [city_lower, city_upper]
      rows:
        - [seattle, TACOMA]

  - id: mysql_compat_functions.002.string_case_aliases
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, lcase, ucase]
    sql: |
      select lcase('SEATTLE') as city_lower, ucase('tacoma') as city_upper
    expect:
      columns: [city_lower, city_upper]
      rows:
        - [seattle, TACOMA]

  - id: mysql_compat_functions.003.substring_aliases
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, substring, substr, mid]
    sql: |
      select substring('alphabet', 1, 3) as a, substr('alphabet', 4, 2) as b, mid('alphabet', 6, 3) as c
    expect:
      columns: [a, b, c]
      rows:
        - [alp, ha, bet]

  - id: mysql_compat_functions.004.substring_without_length
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, substring]
    sql: |
      select substring('alphabet', 4) as value
    expect:
      columns: [value]
      rows:
        - [habet]

  - id: mysql_compat_functions.005.length
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, length, char_length]
    sql: |
      select length('Abe') as byte_len, char_length('Annie') as char_len
    expect:
      columns: [byte_len, char_len]
      rows:
        - [3, 5]

  - id: mysql_compat_functions.006.coalesce
    status: supported
    kind: query
    feature: scalar_functions_null
    compatibility: mysql
    requires: [select, coalesce, null]
    sql: |
      select coalesce(null, 'fallback') as value
    expect:
      columns: [value]
      rows:
        - [fallback]

  - id: mysql_compat_functions.007.coalesce_multiple_args
    status: supported
    kind: query
    feature: scalar_functions_null
    compatibility: mysql
    requires: [select, coalesce, null]
    sql: |
      select coalesce(null, null, 'third') as value
    expect:
      columns: [value]
      rows:
        - [third]

  - id: mysql_compat_functions.008.coalesce_all_null
    status: supported
    kind: query
    feature: scalar_functions_null
    compatibility: mysql
    requires: [select, coalesce, null]
    sql: |
      select coalesce(null, null) as value
    expect:
      columns: [value]
      rows:
        - [null]

  - id: mysql_compat_functions.009.null_argument_propagation
    status: supported
    kind: query
    feature: scalar_functions_null
    compatibility: mysql
    requires: [select, lower, upper, length, substring, null]
    sql: |
      select lower(null) as lower_value, upper(null) as upper_value, length(null) as len_value, substring(null, 1, 2) as sub_value
    expect:
      columns: [lower_value, upper_value, len_value, sub_value]
      rows:
        - [null, null, null, null]

  - id: mysql_compat_functions.010.year_literal
    status: supported
    kind: query
    feature: scalar_functions_datetime
    compatibility: mysql
    requires: [select, year]
    sql: |
      select year('1995-03-15') as ship_year
    expect:
      columns: [ship_year]
      rows:
        - [1995]

  - id: mysql_compat_functions.011.session_metadata_functions
    status: supported
    kind: query
    feature: scalar_functions_session
    compatibility: mysql
    requires: [select, database, schema, version, user, current_user, connection_id]
    sql: |
      select database() as db_name,
             schema() as schema_name,
             version() as version_value,
             user() as user_value,
             current_user() as current_user_value,
             connection_id() as connection_id_value
    expect:
      columns: [db_name, schema_name, version_value, user_value, current_user_value, connection_id_value]

  - id: mysql_compat_functions.020.concat
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, concat]
    sql: |
      select concat('quanta', 'stream') as value
    expect:
      columns: [value]
      rows:
        - [quantastream]

  - id: mysql_compat_functions.021.trim
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, trim]
    sql: |
      select trim('  quanta  ') as value
    expect:
      columns: [value]
      rows:
        - [quanta]

  - id: mysql_compat_functions.022.replace
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, replace]
    sql: |
      select replace('stream', 's', 'S') as value
    expect:
      columns: [value]
      rows:
        - [Stream]

  - id: mysql_compat_functions.023.left_right
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, left, right]
    sql: |
      select left('stream', 3) as left_value, right('stream', 3) as right_value
    expect:
      columns: [left_value, right_value]
      rows:
        - [str, eam]

  - id: mysql_compat_functions.024.substring_negative_start
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, substring]
    sql: |
      select substring('alphabet', -3) as value
    expect:
      columns: [value]
      rows:
        - [bet]

  - id: mysql_compat_functions.025.trim_sides
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, ltrim, rtrim]
    sql: |
      select ltrim('  left') as left_trimmed, rtrim('right  ') as right_trimmed
    expect:
      columns: [left_trimmed, right_trimmed]
      rows:
        - [left, right]

  - id: mysql_compat_functions.026.concat_null
    status: supported
    kind: query
    feature: scalar_functions_string
    compatibility: mysql
    requires: [select, concat, null]
    sql: |
      select concat('quanta', null) as value
    expect:
      columns: [value]
      rows:
        - [null]

  - id: mysql_compat_functions.030.ifnull
    status: supported
    kind: query
    feature: scalar_functions_null
    compatibility: mysql
    requires: [select, ifnull, null]
    sql: |
      select ifnull(null, 'fallback') as value
    expect:
      columns: [value]
      rows:
        - [fallback]

  - id: mysql_compat_functions.031.nullif
    status: supported
    kind: query
    feature: scalar_functions_null
    compatibility: mysql
    requires: [select, nullif]
    sql: |
      select nullif('same', 'same') as value
    expect:
      columns: [value]
      rows:
        - [null]

  - id: mysql_compat_functions.040.numeric_math
    status: supported
    kind: query
    feature: scalar_functions_numeric
    compatibility: mysql
    requires: [select, abs, round]
    sql: |
      select abs(-42) as magnitude, round(12345, -2) as rounded
    expect:
      columns: [magnitude, rounded]
      rows:
        - [42, 12300]

  - id: mysql_compat_functions.050.month_day
    status: supported
    kind: query
    feature: scalar_functions_datetime
    compatibility: mysql
    requires: [select, month, day]
    sql: |
      select month('1995-03-15') as ship_month, day('1995-03-15') as ship_day
    expect:
      columns: [ship_month, ship_day]
      rows:
        - [3, 15]

  - id: mysql_compat_functions.051.date_part_aliases
    status: supported
    kind: query
    feature: scalar_functions_datetime
    compatibility: mysql
    requires: [select, dayofmonth, dayofweek]
    sql: |
      select dayofmonth('1995-03-15') as ship_day, dayofweek('1995-03-19') as ship_dow
    expect:
      columns: [ship_day, ship_dow]
      rows:
        - [15, 1]

  - id: mysql_compat_functions.100.row_string_select_list
    status: supported
    kind: query
    feature: scalar_functions_string_rows
    compatibility: mysql
    requires: [select, lower, upper, char_length, substring]
    sql: |
      select c_custkey,
             lower(c_mktsegment) as seg_lower,
             upper(c_mktsegment) as seg_upper,
             char_length(c_name) as name_len,
             substring(c_name, 1, 8) as name_prefix
      from customer
      where c_custkey in (1, 2, 3)
      order by c_custkey
    expect:
      columns: [c_custkey, seg_lower, seg_upper, name_len, name_prefix]
      rows:
        - [1, building, BUILDING, 18, Customer]
        - [2, automobile, AUTOMOBILE, 18, Customer]
        - [3, automobile, AUTOMOBILE, 18, Customer]

  - id: mysql_compat_functions.101.row_nested_string_select_list
    status: supported
    kind: query
    feature: scalar_functions_string_rows
    compatibility: mysql
    requires: [select, concat, left, right, replace]
    sql: |
      select c_custkey,
             concat(left(c_name, 8), ':', right(c_phone, 4)) as label,
             replace(c_mktsegment, 'BUILDING', 'BUILD') as segment_label
      from customer
      where c_custkey in (1, 2, 3)
      order by c_custkey
    expect:
      columns: [c_custkey, label, segment_label]
      rows:
        - [1, Customer:2988, BUILD]
        - [2, Customer:3665, AUTOMOBILE]
        - [3, Customer:3364, AUTOMOBILE]

  - id: mysql_compat_functions.102.row_string_predicate
    status: supported
    kind: query
    feature: scalar_functions_string_predicates
    compatibility: mysql
    requires: [select, lower, where]
    sql: |
      select c_custkey, c_mktsegment
      from customer
      where lower(c_mktsegment) = 'building'
      order by c_custkey
      limit 5
    expect:
      columns: [c_custkey, c_mktsegment]
      rows:
        - [1, BUILDING]
        - [8, BUILDING]
        - [11, BUILDING]
        - [13, BUILDING]
        - [18, BUILDING]

  - id: mysql_compat_functions.103.row_datetime_predicate
    status: supported
    kind: query
    feature: scalar_functions_datetime_predicates
    compatibility: mysql
    requires: [select, year, month, day, where]
    sql: |
      select o_orderkey,
             year(o_orderdate) as order_year,
             month(o_orderdate) as order_month,
             day(o_orderdate) as order_day
      from orders
      where year(o_orderdate) = 1995
        and month(o_orderdate) = 3
        and day(o_orderdate) = 15
      order by o_orderkey
      limit 5
    expect:
      columns: [o_orderkey, order_year, order_month, order_day]
      rows:
        - [12166, 1995, 3, 15]
        - [16484, 1995, 3, 15]
        - [24548, 1995, 3, 15]
        - [53539, 1995, 3, 15]
        - [54179, 1995, 3, 15]

  - id: mysql_compat_functions.104.row_null_helpers_select_list
    status: supported
    kind: query
    feature: scalar_functions_null_rows
    compatibility: mysql
    requires: [select, nullif, ifnull]
    sql: |
      select c_custkey,
             nullif(c_mktsegment, 'BUILDING') as non_building,
             ifnull(nullif(c_mktsegment, 'BUILDING'), 'was_building') as segment_fallback
      from customer
      where c_custkey in (1, 2, 3)
      order by c_custkey
    expect:
      columns: [c_custkey, non_building, segment_fallback]
      rows:
        - [1, null, was_building]
        - [2, AUTOMOBILE, AUTOMOBILE]
        - [3, AUTOMOBILE, AUTOMOBILE]

  - id: mysql_compat_functions.105.row_numeric_select_list
    status: supported
    kind: query
    feature: scalar_functions_numeric_rows
    compatibility: mysql
    requires: [select, abs, round]
    sql: |
      select c_custkey, round(abs(c_acctbal), 1) as abs_bal
      from customer
      where c_custkey in (1, 2, 3)
      order by c_custkey
    expect:
      columns: [c_custkey, abs_bal]
      rows:
        - [1, 711.6]
        - [2, 121.7]
        - [3, 7498.1]

  - id: mysql_compat_functions.106.row_numeric_predicate_order
    status: supported
    kind: query
    feature: scalar_functions_numeric_predicates
    compatibility: mysql
    requires: [select, abs, round, where, order_by, limit, signed_float_scale_bsi]
    sql: |
      select c_custkey, round(abs(c_acctbal), 0) as abs_bal
      from customer
      where round(abs(c_acctbal), 0) >= 7000
      order by abs_bal desc, c_custkey
      limit 5
    expect:
      columns: [c_custkey, abs_bal]
      rows:
        - [213, 9988]
        - [45, 9983]
        - [1106, 9978]
        - [200, 9968]
        - [140, 9963]
