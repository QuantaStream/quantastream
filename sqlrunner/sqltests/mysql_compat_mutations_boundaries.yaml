version: 1
name: mysql_compat_mutations_boundaries

tests:
  # Supported no-op DDL forms. These are useful cleanup guards in both MySQL and
  # QuantaStream even though real table creation remains catalog-backed.
  - id: mysql_compat_mutations_boundaries.001.drop_table_if_exists
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations

  - id: mysql_compat_mutations_boundaries.002.drop_ctas_table_if_exists
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations_ctas

  # True MySQL DDL boundaries. QS table creation remains catalog/YAML-backed for
  # inline schemas, while CTAS now generates a conservative catalog descriptor.
  - id: mysql_compat_mutations_boundaries.003.create_inline_table
    status: xfail
    kind: statement
    feature: mutations_mysql_ddl_boundary
    compatibility: mysql
    requires: [create_table, inline_schema, primary_key, int, varchar]
    issue: "Inline CREATE TABLE definitions are not supported yet; QS table creation is catalog/YAML-backed."
    sql: |
      create table qs_mysql_compat_mutations (
        id int primary key,
        name varchar(40),
        amount int
      )

  - id: mysql_compat_mutations_boundaries.009.create_table_as_select
    status: supported
    kind: statement
    feature: mutations_ctas
    compatibility: mysql
    requires: [create_table_as, select]
    sql: |
      create table qs_mysql_compat_mutations_ctas as
      select c_custkey as id, c_name as name, c_nationkey as amount
      from customer
      where c_custkey <= 3

  # DML compatibility uses the CTAS scratch table because QuantaStream table
  # creation is catalog-backed rather than inline CREATE TABLE-backed.
  - id: mysql_compat_mutations_boundaries.004.multi_row_insert
    status: supported
    kind: statement
    feature: mutations_scratch_table_dml
    compatibility: mysql
    requires: [insert, values]
    sql: |
      insert into qs_mysql_compat_mutations_ctas (id, name, amount)
      values (4, 'Abe', 10), (5, 'Abby', 20)
    expect:
      affected_rows: 2

  - id: mysql_compat_mutations_boundaries.005.update_arithmetic_assignment
    status: supported
    kind: statement
    feature: mutations_scratch_table_dml
    compatibility: mysql
    requires: [update, arithmetic, where, comparison]
    sql: |
      update qs_mysql_compat_mutations_ctas
      set amount = amount + 5
      where id = 5
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.006.delete_rows
    status: supported
    kind: statement
    feature: mutations_scratch_table_dml
    compatibility: mysql
    requires: [delete, where, comparison]
    sql: |
      delete from qs_mysql_compat_mutations_ctas
      where id = 4
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.007.select_after_write
    status: supported
    kind: query
    order: exact
    feature: mutations_scratch_table_dml
    compatibility: mysql
    requires: [select, order_by]
    sql: |
      select id, name, amount
      from qs_mysql_compat_mutations_ctas
      where id = 5
      order by id
    expect:
      columns: [id, name, amount]
      rows:
        - [5, Abby, 25]

  - id: mysql_compat_mutations_boundaries.025.begin_formatted_catalog_insert
    status: supported
    kind: statement
    feature: mutations_insert_formatting
    compatibility: mysql
    requires: [begin]
    sql: |
      begin

  - id: mysql_compat_mutations_boundaries.026.formatted_catalog_insert
    status: supported
    kind: statement
    feature: mutations_insert_formatting
    compatibility: mysql
    requires: [insert, values, multiline]
    sql: |
      insert into customer (
        c_custkey,
        c_name,
        c_address,
        c_nationkey,
        c_phone,
        c_acctbal,
        c_mktsegment,
        c_comment
      ) values (
        900000002,
        'Formatted Customer',
        'Formatted Address',
        1,
        '11-222-333-4444',
        42.50,
        'BUILDING',
        'formatted catalog insert boundary'
      )
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.027.rollback_formatted_catalog_insert
    status: supported
    kind: statement
    feature: mutations_insert_formatting
    compatibility: mysql
    requires: [rollback]
    sql: |
      rollback

  # Transaction statements are accepted for client compatibility, but QS writes
  # currently apply immediately. Keep the semantic rollback boundary explicit
  # until the 1.0 transaction policy is settled.
  - id: mysql_compat_mutations_boundaries.028.rollback_write_preclean
    status: supported
    kind: statement
    feature: mutations_transaction_write_boundary
    compatibility: mysql
    requires: [delete, where, comparison]
    sql: |
      delete from customer
      where c_custkey = 900000094

  - id: mysql_compat_mutations_boundaries.029.rollback_write_autocommit_off
    status: supported
    kind: statement
    feature: mutations_transaction_write_boundary
    compatibility: mysql
    requires: [set, autocommit]
    sql: |
      set autocommit = 0

  - id: mysql_compat_mutations_boundaries.030.rollback_write_insert
    status: supported
    kind: statement
    feature: mutations_transaction_write_boundary
    compatibility: mysql
    requires: [insert, values]
    sql: |
      insert into customer (
        c_custkey,
        c_name,
        c_address,
        c_nationkey,
        c_phone,
        c_acctbal,
        c_mktsegment,
        c_comment
      ) values (
        900000094,
        'Rollback Customer',
        'Rollback Address',
        1,
        '11-222-333-4444',
        42.50,
        'BUILDING',
        'rollback transaction boundary'
      )
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.031.rollback_write_rollback
    status: supported
    kind: statement
    feature: mutations_transaction_write_boundary
    compatibility: mysql
    requires: [rollback]
    sql: |
      rollback

  - id: mysql_compat_mutations_boundaries.032.rollback_write_readback
    status: xfail
    kind: query
    feature: mutations_transaction_write_boundary
    compatibility: mysql
    requires: [rollback, select, count]
    issue: "QS currently treats transaction statements as session compatibility metadata; rollback does not undo catalog-backed writes."
    sql: |
      select count(*) as rollback_row_count
      from customer
      where c_custkey = 900000094
    expect:
      columns: [rollback_row_count]
      rows:
        - [0]

  - id: mysql_compat_mutations_boundaries.033.rollback_write_autocommit_on
    status: supported
    kind: statement
    feature: mutations_transaction_write_boundary
    compatibility: mysql
    requires: [set, autocommit]
    sql: |
      set autocommit = 1

  - id: mysql_compat_mutations_boundaries.034.rollback_write_cleanup
    status: supported
    kind: statement
    feature: mutations_transaction_write_boundary
    compatibility: mysql
    requires: [delete, where, comparison]
    sql: |
      delete from customer
      where c_custkey = 900000094
    expect:
      ignore_affected_rows: true

  - id: mysql_compat_mutations_boundaries.039.drop_table_if_exists_cascade
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists, cascade]
    sql: |
      drop table if exists qs_mysql_compat_mutations cascade

  - id: mysql_compat_mutations_boundaries.035.drop_ctas_keys_table_if_exists
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations_keys

  - id: mysql_compat_mutations_boundaries.040.drop_empty_ctas_keys_table_if_exists
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations_empty_keys

  - id: mysql_compat_mutations_boundaries.041.create_empty_ctas_table_for_alter_primary_key
    status: supported
    kind: statement
    feature: mutations_ctas
    compatibility: mysql
    requires: [create_table_as, select]
    sql: |
      create table qs_mysql_compat_mutations_empty_keys as
      select c_name as id, c_mktsegment as name
      from customer
      where c_custkey < 0

  - id: mysql_compat_mutations_boundaries.042.alter_table_add_primary_key_empty_table
    status: supported
    kind: statement
    feature: mutations_alter_table_primary_key_empty_table
    compatibility: mysql
    requires: [alter_table, add_primary_key, empty_table, catalog_activation]
    sql: |
      alter table qs_mysql_compat_mutations_empty_keys
      add primary key (id)

  - id: mysql_compat_mutations_boundaries.036.create_ctas_table_for_alter_keys
    status: supported
    kind: statement
    feature: mutations_ctas
    compatibility: mysql
    requires: [create_table_as, select]
    sql: |
      create table qs_mysql_compat_mutations_keys as
      select c_custkey as id, c_name as name
      from customer
      where c_custkey <= 3

  - id: mysql_compat_mutations_boundaries.037.alter_table_add_primary_key
    status: xfail
    kind: statement
    feature: mutations_alter_table_primary_key_execution_boundary
    compatibility: mysql
    requires: [alter_table, add_primary_key, primary_key_null_validation, primary_key_duplicate_validation, catalog_activation, primary_key_authority_artifacts]
    issue: "ALTER TABLE ... ADD PRIMARY KEY now activates catalog metadata for proven-empty tables. This non-empty-table path remains XFAIL until QS rebuilds/probes primary-key authority artifacts before durable catalog activation."
    sql: |
      alter table qs_mysql_compat_mutations_keys
      add primary key (id)

  - id: mysql_compat_mutations_boundaries.038.alter_table_add_foreign_key
    status: xfail
    kind: statement
    feature: mutations_alter_table_foreign_key_execution_boundary
    compatibility: mysql
    requires: [alter_table, add_foreign_key, foreign_key_validation, relationship_catalog_activation, metadata_only_artifact_policy]
    issue: "Parser/binder support now models plain MySQL ALTER TABLE ... ADD FOREIGN KEY, metadata-only artifact policy, and the required parent-key/type/orphan validation steps. Execution still needs to run those checks and activate relationship catalog metadata."
    sql: |
      alter table qs_mysql_compat_mutations_keys
      add constraint fk_qs_mysql_compat_mutations_keys_customer
      foreign key (id)
      references customer(c_custkey)

  - id: mysql_compat_mutations_boundaries.010.update_assignment_arithmetic
    status: supported
    kind: statement
    feature: mutations_update_assignment_arithmetic
    compatibility: mysql
    requires: [update, arithmetic, where, comparison]
    sql: |
      update qs_mysql_compat_mutations_ctas
      set amount = amount + 10
      where id = 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.011.update_assignment_function
    status: supported
    kind: statement
    feature: mutations_update_assignment_function
    compatibility: mysql
    requires: [update, scalar_function, where, comparison]
    sql: |
      update qs_mysql_compat_mutations_ctas
      set name = lower(name)
      where id = 2
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.012.update_join
    status: supported
    kind: statement
    feature: mutations_multi_table_boundary
    compatibility: mysql
    requires: [update, join, aliases, where, comparison]
    sql: |
      update qs_mysql_compat_mutations_ctas as t
      inner join customer as c on t.id = c.c_custkey
      set t.name = c.c_name
      where t.id = 2
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.013.delete_join
    status: supported
    kind: statement
    feature: mutations_multi_table_boundary
    compatibility: mysql
    requires: [delete, join, aliases, where, comparison]
    sql: |
      delete t
      from qs_mysql_compat_mutations_ctas as t
      inner join customer as c on t.id = c.c_custkey
      where t.id = 3
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.014.update_where_subquery
    status: supported
    kind: statement
    feature: mutations_subquery_boundary
    compatibility: mysql
    requires: [update, where, subquery, in]
    sql: |
      update qs_mysql_compat_mutations_ctas
      set name = 'subquery'
      where id in (
        select c_custkey
        from customer
        where c_custkey <= 2
      )
    expect:
      affected_rows: 2

  - id: mysql_compat_mutations_boundaries.024.update_assignment_scalar_subquery
    status: supported
    kind: statement
    feature: mutations_assignment_scalar_subquery_boundary
    compatibility: mysql
    requires: [update, scalar_subquery, aggregate, where, comparison]
    sql: |
      update qs_mysql_compat_mutations_ctas
      set amount = (
        select max(c_custkey)
        from customer
        where c_custkey <= 4
      )
      where id = 2
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.015.delete_where_subquery
    status: supported
    kind: statement
    feature: mutations_subquery_boundary
    compatibility: mysql
    requires: [delete, where, subquery, in]
    sql: |
      delete from qs_mysql_compat_mutations_ctas
      where id in (
        select c_custkey
        from customer
        where c_custkey = 1
      )
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.018.insert_select
    status: supported
    kind: statement
    feature: mutations_insert_select
    compatibility: mysql
    requires: [insert, select]
    sql: |
      insert into qs_mysql_compat_mutations_ctas (id, name, amount)
      select c_custkey, c_name, c_nationkey
      from customer
      where c_custkey <= 3
    expect:
      affected_rows: 3

  - id: mysql_compat_mutations_boundaries.019.replace_into
    status: supported
    kind: statement
    feature: mutations_unkeyed_upsert_insert_equivalent
    compatibility: mysql
    requires: [replace, insert, unkeyed_table]
    sql: |
      replace into qs_mysql_compat_mutations_ctas (id, name, amount)
      values (1, 'replacement', 0)
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.020.insert_on_duplicate_key_update
    status: supported
    kind: statement
    feature: mutations_unkeyed_upsert_insert_equivalent
    compatibility: mysql
    requires: [insert, on_duplicate_key_update, unkeyed_table]
    sql: |
      insert into qs_mysql_compat_mutations_ctas (id, name, amount)
      values (1, 'duplicate', 0)
      on duplicate key update name = values(name)
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.021.update_order_by_limit
    status: supported
    kind: statement
    feature: mutations_order_limit_boundary
    compatibility: mysql
    requires: [update, where, order_by, limit]
    sql: |
      update qs_mysql_compat_mutations_ctas
      set name = 'limited'
      where id >= 0
      order by id
      limit 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.022.delete_order_by_limit
    status: supported
    kind: statement
    feature: mutations_order_limit_boundary
    compatibility: mysql
    requires: [delete, where, order_by, limit]
    sql: |
      delete from qs_mysql_compat_mutations_ctas
      where id > 1
      order by id
      limit 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.023.delete_limit_without_where
    status: supported
    kind: statement
    feature: mutations_order_limit_boundary
    compatibility: mysql
    requires: [delete, limit]
    sql: |
      delete from qs_mysql_compat_mutations_ctas
      limit 1
    expect:
      affected_rows: 1

  # Keep ALTER boundaries after the DML cases. The MySQL reference run executes
  # this suite in order, so dropping a column too early can invalidate later
  # reference cases before QS is compared.
  - id: mysql_compat_mutations_boundaries.016.alter_table_add_column
    status: supported
    kind: statement
    feature: mutations_alter_table_boundary
    compatibility: mysql
    requires: [alter_table, add_column, varchar]
    sql: |
      alter table qs_mysql_compat_mutations_ctas
      add column note varchar(40)

  - id: mysql_compat_mutations_boundaries.017.alter_table_drop_column
    status: xfail
    kind: statement
    feature: mutations_alter_table_boundary
    compatibility: mysql
    requires: [alter_table, drop_column]
    issue: "ALTER TABLE is post-1.0 compatibility work; QS schema is catalog/YAML-backed."
    sql: |
      alter table qs_mysql_compat_mutations_ctas
      drop column name

  - id: mysql_compat_mutations_boundaries.008.drop_table_cascade
    status: supported
    kind: statement
    feature: mutations_drop_table_cascade
    compatibility: mysql
    requires: [drop_table, cascade]
    sql: |
      drop table qs_mysql_compat_mutations_ctas cascade

  # Cleanup no-ops, safe even when the boundary table creation never happened.
  - id: mysql_compat_mutations_boundaries.900.cleanup
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations

  - id: mysql_compat_mutations_boundaries.901.cleanup_ctas
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations_ctas

  - id: mysql_compat_mutations_boundaries.902.cleanup_ctas_keys
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations_keys

  - id: mysql_compat_mutations_boundaries.903.cleanup_empty_ctas_keys
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations_empty_keys
