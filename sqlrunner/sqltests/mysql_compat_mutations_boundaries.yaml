version: 1
name: mysql_compat_mutations_boundaries

tests:
  # Supported no-op DDL forms. These are useful cleanup guards in both MySQL and
  # QuantaStream even though real table creation remains catalog-backed.
  - id: mysql_compat_mutations_boundaries.001.drop_table_if_exists
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations

  - id: mysql_compat_mutations_boundaries.002.drop_ctas_table_if_exists
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations_ctas

  # True MySQL DDL boundaries. QS table creation is still catalog/YAML-backed,
  # so inline schema creation and CTAS stay as post-1.0 compatibility targets.
  - id: mysql_compat_mutations_boundaries.003.create_inline_table
    status: xfail
    kind: statement
    feature: mutations_mysql_ddl_boundary
    compatibility: mysql
    requires: [create_table, inline_schema, primary_key, int, varchar]
    issue: "Inline CREATE TABLE definitions are not supported yet; QS table creation is catalog/YAML-backed."
    sql: |
      create table qs_mysql_compat_mutations (
        id int primary key,
        name varchar(40),
        amount int
      )

  # These are DML-shaped MySQL cases, but this fixture depends on the inline
  # scratch table above. Catalog-backed DML remains covered by mutate_tests_body.
  - id: mysql_compat_mutations_boundaries.004.multi_row_insert
    status: xfail
    kind: statement
    feature: mutations_scratch_table_dml_boundary
    compatibility: mysql
    requires: [insert, values]
    issue: "This MySQL-compatible insert depends on inline CREATE TABLE support for the scratch table; catalog-backed INSERT coverage lives in mutate_tests_body.yaml."
    sql: |
      insert into qs_mysql_compat_mutations (id, name, amount)
      values (1, 'Abe', 10), (2, 'Abby', 20)
    expect:
      affected_rows: 2

  - id: mysql_compat_mutations_boundaries.005.update_arithmetic_assignment
    status: xfail
    kind: statement
    feature: mutations_scratch_table_dml_boundary
    compatibility: mysql
    requires: [update, arithmetic, where, comparison]
    issue: "This MySQL-compatible update depends on inline CREATE TABLE support for the scratch table; arithmetic assignment is a follow-up DML compatibility target."
    sql: |
      update qs_mysql_compat_mutations
      set amount = amount + 5
      where id = 2
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.006.delete_rows
    status: xfail
    kind: statement
    feature: mutations_scratch_table_dml_boundary
    compatibility: mysql
    requires: [delete, where, comparison]
    issue: "This MySQL-compatible delete depends on inline CREATE TABLE support for the scratch table; catalog-backed DELETE coverage lives in mutate_tests_body.yaml."
    sql: |
      delete from qs_mysql_compat_mutations
      where id = 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.007.select_after_write
    status: xfail
    kind: query
    order: exact
    feature: mutations_scratch_table_dml_boundary
    compatibility: mysql
    requires: [select, order_by]
    issue: "Read-after-write on a MySQL-created scratch table depends on inline CREATE TABLE support; catalog-backed DML readback coverage lives in mutate_tests_body.yaml."
    sql: |
      select id, name, amount
      from qs_mysql_compat_mutations
      order by id
    expect:
      columns: [id, name, amount]
      rows:
        - [2, Abby, 25]

  - id: mysql_compat_mutations_boundaries.008.drop_table_cascade
    status: xfail
    kind: statement
    feature: mutations_mysql_ddl_boundary
    compatibility: mysql
    requires: [drop_table, cascade]
    issue: "DROP TABLE ... CASCADE is a post-1.0 compatibility target; QS currently blocks dependent objects explicitly instead of cascading catalog changes."
    sql: |
      drop table qs_mysql_compat_mutations cascade

  - id: mysql_compat_mutations_boundaries.009.create_table_as_select
    status: xfail
    kind: statement
    feature: mutations_mysql_ddl_boundary
    compatibility: mysql
    requires: [create_table_as, select]
    issue: "CREATE TABLE AS SELECT requires result-schema inference plus materializing a new table from a SELECT result; QS table creation is still catalog/YAML-backed."
    sql: |
      create table qs_mysql_compat_mutations_ctas as
      select c_custkey as id, c_name as name
      from customer
      where c_custkey <= 3

  - id: mysql_compat_mutations_boundaries.010.update_assignment_arithmetic
    status: xfail
    kind: statement
    feature: mutations_scratch_table_dml_boundary
    compatibility: mysql
    requires: [update, arithmetic, where, comparison]
    issue: "Row-local UPDATE assignment expressions are supported on catalog-backed tables; this boundary remains XFAIL because the scratch table depends on unsupported CTAS/inline DDL."
    sql: |
      update qs_mysql_compat_mutations_ctas
      set id = id + 10
      where id = 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.011.update_assignment_function
    status: xfail
    kind: statement
    feature: mutations_scratch_table_dml_boundary
    compatibility: mysql
    requires: [update, scalar_function, where, comparison]
    issue: "Scalar-function UPDATE assignments are supported on catalog-backed tables; this boundary remains XFAIL because the scratch table depends on unsupported CTAS/inline DDL."
    sql: |
      update qs_mysql_compat_mutations_ctas
      set name = lower(name)
      where id = 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.012.update_join
    status: xfail
    kind: statement
    feature: mutations_multi_table_boundary
    compatibility: mysql
    requires: [update, join, aliases, where, comparison]
    issue: "UPDATE ... JOIN is a MySQL multi-table mutation boundary; QS mutation planning currently targets one catalog table."
    sql: |
      update customer as c
      inner join orders as o on c.c_custkey = o.o_custkey
      set c.c_comment = 'joined'
      where o.o_orderkey = 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.013.delete_join
    status: xfail
    kind: statement
    feature: mutations_multi_table_boundary
    compatibility: mysql
    requires: [delete, join, aliases, where, comparison]
    issue: "DELETE ... JOIN is a MySQL multi-table mutation boundary; QS mutation planning currently targets one catalog table."
    sql: |
      delete c
      from customer as c
      inner join orders as o on c.c_custkey = o.o_custkey
      where o.o_orderkey = 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.014.update_where_subquery
    status: xfail
    kind: statement
    feature: mutations_subquery_boundary
    compatibility: mysql
    requires: [update, where, subquery, in]
    issue: "Mutation predicates with subqueries need explicit write-time subquery planning and safety checks."
    sql: |
      update qs_mysql_compat_mutations_ctas
      set name = 'subquery'
      where id in (
        select c_custkey
        from customer
        where c_custkey <= 2
      )
    expect:
      affected_rows: 2

  - id: mysql_compat_mutations_boundaries.024.update_assignment_scalar_subquery
    status: xfail
    kind: statement
    feature: mutations_assignment_scalar_subquery_boundary
    compatibility: mysql
    requires: [update, scalar_subquery, aggregate, where, comparison]
    issue: "UPDATE assignment scalar subqueries need explicit write-time subquery materialization; row-local assignment expressions are supported on catalog-backed tables."
    sql: |
      update qs_mysql_compat_mutations_ctas
      set id = (
        select max(c_custkey)
        from customer
        where c_custkey <= 3
      )
      where id = 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.015.delete_where_subquery
    status: xfail
    kind: statement
    feature: mutations_subquery_boundary
    compatibility: mysql
    requires: [delete, where, subquery, in]
    issue: "Mutation predicates with subqueries need explicit write-time subquery planning and safety checks."
    sql: |
      delete from qs_mysql_compat_mutations_ctas
      where id in (
        select c_custkey
        from customer
        where c_custkey = 3
      )
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.018.insert_select
    status: xfail
    kind: statement
    feature: mutations_insert_select_boundary
    compatibility: mysql
    requires: [insert, select]
    issue: "INSERT ... SELECT requires result-schema validation and materializing SELECT rows into the write path."
    sql: |
      insert into qs_mysql_compat_mutations_ctas (id, name)
      select c_custkey, c_name
      from customer
      where c_custkey <= 3
    expect:
      affected_rows: 3

  - id: mysql_compat_mutations_boundaries.019.replace_into
    status: xfail
    kind: statement
    feature: mutations_upsert_boundary
    compatibility: mysql
    requires: [replace, insert, primary_key]
    issue: "REPLACE needs explicit delete/insert or overwrite semantics over QS primary-key authority."
    sql: |
      replace into qs_mysql_compat_mutations_ctas (id, name)
      values (1, 'replacement')
    expect:
      affected_rows: 2

  - id: mysql_compat_mutations_boundaries.020.insert_on_duplicate_key_update
    status: xfail
    kind: statement
    feature: mutations_upsert_boundary
    compatibility: mysql
    requires: [insert, on_duplicate_key_update, primary_key]
    issue: "INSERT ... ON DUPLICATE KEY UPDATE needs QS upsert semantics plus update-expression support."
    sql: |
      insert into qs_mysql_compat_mutations_ctas (id, name)
      values (1, 'duplicate')
      on duplicate key update name = values(name)
    expect:
      affected_rows: 2

  - id: mysql_compat_mutations_boundaries.021.update_order_by_limit
    status: xfail
    kind: statement
    feature: mutations_order_limit_boundary
    compatibility: mysql
    requires: [update, order_by, limit]
    issue: "UPDATE ... ORDER BY ... LIMIT is a MySQL mutation ordering boundary; QS mutation statements do not carry ordering/limit semantics yet."
    sql: |
      update qs_mysql_compat_mutations_ctas
      set name = 'limited'
      order by id
      limit 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.022.delete_order_by_limit
    status: xfail
    kind: statement
    feature: mutations_order_limit_boundary
    compatibility: mysql
    requires: [delete, where, order_by, limit]
    issue: "DELETE ... ORDER BY ... LIMIT is a MySQL mutation ordering boundary; QS mutation statements do not carry ordering/limit semantics yet."
    sql: |
      delete from qs_mysql_compat_mutations_ctas
      where id > 1
      order by id
      limit 1
    expect:
      affected_rows: 1

  - id: mysql_compat_mutations_boundaries.023.delete_limit_without_where
    status: xfail
    kind: statement
    feature: mutations_order_limit_boundary
    compatibility: mysql
    requires: [delete, limit]
    issue: "DELETE ... LIMIT without WHERE is valid MySQL syntax but unsafe for QS until mutation limit semantics are represented explicitly."
    sql: |
      delete from qs_mysql_compat_mutations_ctas
      limit 1
    expect:
      affected_rows: 1

  # Keep ALTER boundaries after the DML cases. The MySQL reference run executes
  # this suite in order, so dropping a column too early can invalidate later
  # reference cases before QS is compared.
  - id: mysql_compat_mutations_boundaries.016.alter_table_add_column
    status: xfail
    kind: statement
    feature: mutations_alter_table_boundary
    compatibility: mysql
    requires: [alter_table, add_column, varchar]
    issue: "ALTER TABLE is post-1.0 compatibility work; QS schema is catalog/YAML-backed."
    sql: |
      alter table qs_mysql_compat_mutations_ctas
      add column note varchar(40)

  - id: mysql_compat_mutations_boundaries.017.alter_table_drop_column
    status: xfail
    kind: statement
    feature: mutations_alter_table_boundary
    compatibility: mysql
    requires: [alter_table, drop_column]
    issue: "ALTER TABLE is post-1.0 compatibility work; QS schema is catalog/YAML-backed."
    sql: |
      alter table qs_mysql_compat_mutations_ctas
      drop column name

  # Cleanup no-ops, safe even when the boundary table creation never happened.
  - id: mysql_compat_mutations_boundaries.900.cleanup
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations

  - id: mysql_compat_mutations_boundaries.901.cleanup_ctas
    status: supported
    kind: statement
    feature: mutations_ddl_safe_noop
    compatibility: mysql
    requires: [drop_table, if_exists]
    sql: |
      drop table if exists qs_mysql_compat_mutations_ctas
