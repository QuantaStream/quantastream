version: 1
name: mysql_compat_subqueries

tests:
  - id: mysql_compat_subqueries.001.scalar_select_list
    status: supported
    kind: query
    feature: subqueries_scalar
    compatibility: mysql
    requires: [select, scalar_subquery]
    sql: |
      select (select 42) as answer
    expect:
      columns: [answer]
      rows:
        - [42]

  - id: mysql_compat_subqueries.002.in_membership
    status: supported
    kind: query
    order: exact
    feature: subqueries_membership
    compatibility: mysql
    requires: [select, derived_table, in_subquery, order_by]
    sql: |
      select c.name
      from (
        select 1 as cust_id, 'Abe' as name
        union all select 2, 'Abby'
        union all select 3, 'Annie'
      ) as c
      where c.cust_id in (
        select o.cust_id
        from (
          select 1 as cust_id
          union all select 3
        ) as o
      )
      order by c.name
    expect:
      columns: [name]
      rows:
        - [Abe]
        - [Annie]

  - id: mysql_compat_subqueries.003.correlated_exists
    status: supported
    kind: query
    order: exact
    feature: subqueries_exists
    compatibility: mysql
    requires: [select, derived_table, correlated_exists]
    sql: |
      select c.name
      from (
        select 1 as cust_id, 'Abe' as name
        union all select 2, 'Abby'
      ) as c
      where exists (
        select 1
        from (
          select 1 as cust_id
        ) as o
        where o.cust_id = c.cust_id
      )
    expect:
      columns: [name]
      rows:
        - [Abe]

  - id: mysql_compat_subqueries.004.scalar_aggregate_predicate
    status: supported
    kind: query
    feature: subqueries_scalar_aggregate
    compatibility: mysql
    requires: [select, derived_table, scalar_subquery, aggregate, comparison]
    sql: |
      select item
      from (
        select 'small' as item, 5 as amount
        union all select 'large', 20
      ) as sales
      where amount > (select avg(amount) from (select 5 as amount union all select 15) as baseline)
    expect:
      columns: [item]
      rows:
        - [large]
