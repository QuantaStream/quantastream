version: 1
name: mysql_compat_subqueries

tests:
  - id: mysql_compat_subqueries.001.scalar_select_list
    status: supported
    kind: query
    order: exact
    feature: subqueries_scalar
    compatibility: mysql
    requires: [select, scalar_subquery]
    sql: |
      select (select 42) as answer
    expect:
      columns: [answer]
      rows:
        - [42]

  - id: mysql_compat_subqueries.002.scalar_aggregate_select_list
    status: supported
    kind: query
    order: exact
    feature: subqueries_scalar_aggregate
    compatibility: mysql
    requires: [select, scalar_subquery, aggregate]
    sql: |
      select (select count(*) from region) as region_count
    expect:
      columns: [region_count]
      rows:
        - [5]

  - id: mysql_compat_subqueries.003.in_membership
    status: supported
    kind: query
    order: exact
    feature: subqueries_membership
    compatibility: mysql
    requires: [select, table_scan, in_subquery, order_by]
    sql: |
      select n_name as nation_name
      from nation
      where n_regionkey in (
        select r_regionkey
        from region
        where r_name in ('AMERICA', 'EUROPE')
      )
      order by nation_name
    expect:
      columns: [nation_name]
      rows:
        - [ARGENTINA]
        - [BRAZIL]
        - [CANADA]
        - [FRANCE]
        - [GERMANY]
        - [PERU]
        - [ROMANIA]
        - [RUSSIA]
        - [UNITED KINGDOM]
        - [UNITED STATES]

  - id: mysql_compat_subqueries.004.not_in_membership
    status: supported
    kind: query
    order: exact
    feature: subqueries_membership
    compatibility: mysql
    requires: [select, table_scan, not_in_subquery]
    sql: |
      select count(*) as nation_count
      from nation
      where n_regionkey not in (
        select r_regionkey
        from region
        where r_name = 'AMERICA'
      )
    expect:
      columns: [nation_count]
      rows:
        - [20]

  - id: mysql_compat_subqueries.005.correlated_exists
    status: supported
    kind: query
    order: exact
    feature: subqueries_exists
    compatibility: mysql
    requires: [select, table_scan, correlated_exists, order_by]
    sql: |
      select n.n_name as nation_name
      from nation as n
      where exists (
        select 1
        from region as r
        where r.r_regionkey = n.n_regionkey
          and r.r_name = 'AMERICA'
      )
      order by nation_name
    expect:
      columns: [nation_name]
      rows:
        - [ARGENTINA]
        - [BRAZIL]
        - [CANADA]
        - [PERU]
        - [UNITED STATES]

  - id: mysql_compat_subqueries.006.correlated_not_exists
    status: supported
    kind: query
    order: exact
    feature: subqueries_exists
    compatibility: mysql
    requires: [select, table_scan, correlated_not_exists]
    sql: |
      select count(*) as nation_count
      from nation as n
      where not exists (
        select 1
        from region as r
        where r.r_regionkey = n.n_regionkey
          and r.r_name = 'AMERICA'
      )
    expect:
      columns: [nation_count]
      rows:
        - [20]

  - id: mysql_compat_subqueries.007.scalar_aggregate_predicate
    status: supported
    kind: query
    order: exact
    feature: subqueries_scalar_aggregate
    compatibility: mysql
    requires: [select, table_scan, scalar_subquery, aggregate, comparison, order_by]
    sql: |
      select r_name as region_name
      from region
      where r_regionkey > (select avg(n_regionkey) from nation)
      order by region_name
    expect:
      columns: [region_name]
      rows:
        - [EUROPE]
        - [MIDDLE EAST]
