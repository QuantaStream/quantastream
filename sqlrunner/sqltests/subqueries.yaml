    status: supported
    kind: statement
    sql: insert into customers_qa (cust_id, first_name, city, age) values ('4', 'Axel', 'Everett', 60)

  - id: "subqueries.009.insert_customer"
    status: supported
    kind: statement
    sql: insert into customers_qa (cust_id, first_name, city, age) values ('5', 'Bob', 'Bellingham', 70)

  - id: "subqueries.010.insert_customer"
    status: supported
    kind: statement
    sql: insert into customers_qa (cust_id, first_name, city, age) values ('6', 'Bill', 'Leavenworth', 80)

  - id: "subqueries.011.insert_customer"
    status: supported
    kind: statement
    sql: insert into customers_qa (cust_id, first_name, city, age) values ('7', 'Bailey', 'Seattle', 90)

  - id: "subqueries.012.insert_customer"
    status: supported
    kind: statement
    sql: insert into customers_qa (cust_id, first_name, city, age) values ('8', 'Bert', 'Wenatchee', 35)

  - id: "subqueries.013.insert_customer"
    status: supported
    kind: statement
    sql: insert into customers_qa (cust_id, first_name, city, age) values ('9', 'Beth', 'Gig Harbor', 45)

  - id: "subqueries.014.insert_customer"
    status: supported
    kind: statement
    sql: insert into customers_qa (cust_id, first_name, city, age) values ('10', 'Carl', 'Spokane', 55)

  - id: "subqueries.015.commit_customers"
    status: supported
    kind: statement
    sql: commit

  - id: "subqueries.016.insert_order"
    status: supported
    kind: statement
    sql: insert into orders_qa (cust_id, order_id, order_date, ship_via) values ('1', '1001', '2023-06-01T01:00:00', 'UPS')

  - id: "subqueries.017.insert_order"
    status: supported
    kind: statement
    sql: insert into orders_qa (cust_id, order_id, order_date, ship_via) values ('1', '1002', '2023-06-01T02:00:00', 'UPS')

  - id: "subqueries.018.insert_order"
    status: supported
    kind: statement
    sql: insert into orders_qa (cust_id, order_id, order_date, ship_via) values ('10', '1003', '2023-06-01T03:00:00', 'FEDEX')

  - id: "subqueries.019.commit_orders"
    status: supported
    kind: statement
    sql: commit

  - id: "subqueries.020.not_in_projection"
    status: supported
    kind: query
    order: rowsort
    capabilities: [subquery, not-in, anti-join-rewrite, projection]
    sql: |-
      select c.first_name, c.cust_id
      from customers_qa as c
      where c.cust_id not in (select cust_id from orders_qa)
    expect:
      columns: [first_name, cust_id]
      rows:
        - ["Abby", "2"]
        - ["Annie", "3"]
        - ["Axel", "4"]
        - ["Bailey", "7"]
        - ["Beth", "9"]
        - ["Bert", "8"]
        - ["Bill", "6"]
        - ["Bob", "5"]

  - id: "subqueries.021.filtered_not_in"
    status: supported
    kind: query
    capabilities: [subquery, not-in, anti-join-rewrite, subquery-filter]
    sql: |-
      select *
      from customers_qa
      where cust_id not in (select cust_id from orders_qa where cust_id = '10')
    expect:
      row_count: 9

  - id: "subqueries.022.not_in_count"
    status: supported
    kind: query
    capabilities: [subquery, not-in, anti-join-rewrite, count]
    sql: |-
      select count(*)
      from customers_qa as c
      where c.cust_id not in (select cust_id from orders_qa)
    expect:
      rows:
        - [8]

  - id: "subqueries.023.in_projection"
    status: supported
    kind: query
    capabilities: [subquery, in, semi-join-rewrite, projection, sql-membership-semantics]
    sql: |-
      select *
      from customers_qa as c
      where c.cust_id in (select cust_id from orders_qa)
    expect:
      row_count: 2

  - id: "subqueries.024.in_count"
    status: supported
    kind: query
    capabilities: [subquery, in, semi-join-rewrite, count, sql-membership-semantics]
    sql: |-
      select count(*)
      from customers_qa as c
      where c.cust_id in (select cust_id from orders_qa)
    expect:
      rows:
        - [2]

  - id: "subqueries.025.filtered_in_count"
    status: supported
    kind: query
    capabilities: [subquery, in, semi-join-rewrite, subquery-filter, sql-membership-semantics]
    sql: |-
      select count(*)
      from customers_qa as c
      where c.cust_id in (select cust_id from orders_qa where ship_via = 'UPS')
    expect:
      rows:
        - [1]

  - id: "subqueries.026.filtered_in_projection"
    status: supported
    kind: query
    capabilities: [subquery, in, semi-join-rewrite, subquery-filter, projection, sql-membership-semantics]
    sql: |-
      select c.first_name, c.cust_id
      from customers_qa as c
      where c.cust_id in (select cust_id from orders_qa where ship_via = 'UPS')
    expect:
      row_count: 1

  - id: "subqueries.027.in_membership_count_sql_semantics"
    status: supported
    kind: query
    capabilities: [subquery, in, semi-join-rewrite, sql-membership-semantics]
    sql: |-
      select count(*)
      from customers_qa as c
      where c.cust_id in (select cust_id from orders_qa)
    expect:
      rows:
        - [2]

  - id: "subqueries.027a.residual_like_in_count"
    status: supported
    kind: query
    capabilities: [subquery, in, semi-join-rewrite, subquery-filter, like, string-backing-store]
    sql: |-
      select count(*)
      from customers_qa as c
      where c.cust_id in (select cust_id from orders_qa where order_id like '1001%')
    expect:
      rows:
        - [1]

  - id: "subqueries.028.in_membership_projection_sql_semantics"
    status: supported
    kind: query
    order: rowsort
    capabilities: [subquery, in, semi-join-rewrite, projection, sql-membership-semantics]
    sql: |-
      select c.first_name, c.cust_id
      from customers_qa as c
      where c.cust_id in (select cust_id from orders_qa)
    expect:
      columns: [first_name, cust_id]
      rows:
        - ["Abe", "1"]
        - ["Carl", "10"]

  - id: "subqueries.040.correlated_exists"
    status: supported
    kind: query
    order: rowsort
    capabilities: [subquery, correlated-subquery, exists]
    sql: |-
      select c.first_name, c.cust_id
      from customers_qa as c
      where exists (
        select o.cust_id
        from orders_qa as o
        where o.cust_id = c.cust_id
      )
    expect:
      columns: [first_name, cust_id]
      rows:
        - ["Abe", "1"]
        - ["Carl", "10"]

  - id: "subqueries.041.correlated_not_exists"
    status: supported
    kind: query
    capabilities: [subquery, correlated-subquery, not-exists, anti-join-rewrite]
    sql: |-
      select count(*)
      from customers_qa as c
      where not exists (
        select o.cust_id
        from orders_qa as o
        where o.cust_id = c.cust_id
      )
    expect:
      rows:
        - [8]

  - id: "subqueries.042.scalar_subquery"
    status: supported
    kind: query
    capabilities: [subquery, scalar-subquery, aggregate]
    sql: |-
      select count(*)
      from customers_qa
      where age > (select avg(age) from customers_qa)
    expect:
      rows:
        - [4]

  - id: "subqueries.043.non_correlated_exists_true"
    status: xfail
    kind: query
    capabilities: [subquery, exists, non-correlated-subquery]
    issue: "Non-correlated EXISTS requires a subquery-gate execution step that evaluates child row existence once and passes or suppresses the parent result set."
    sql: |-
      select count(*)
      from customers_qa
      where exists (
        select cust_id
        from orders_qa
        where cust_id = '10'
      )
    expect:
      rows:
        - [10]

  - id: "subqueries.044.non_correlated_exists_false"
    status: xfail
    kind: query
    capabilities: [subquery, exists, non-correlated-subquery]
    issue: "Non-correlated EXISTS requires a subquery-gate execution step that evaluates child row existence once and passes or suppresses the parent result set."
    sql: |-
      select count(*)
      from customers_qa
      where exists (
        select cust_id
        from orders_qa
        where cust_id = 'missing'
      )
    expect:
      rows:
        - [0]

  - id: "subqueries.045.scalar_subquery_select_list"
    status: xfail
    kind: query
    capabilities: [subquery, scalar-subquery, select-list, aggregate]
    issue: "Scalar SELECT-list subqueries require parser support plus a scalar-subquery execution step that materializes one value for projection."
    sql: |-
      select (select avg(age) from customers_qa) as average_age
    expect:
      columns: [average_age]
      rows:
        - [55.5]
