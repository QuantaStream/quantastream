version: 1
name: inabox_standard_qa_smoke

tests:
  - id: inabox_standard_qa_smoke.001.create_customers
    status: supported
    kind: admin
    sql: |-
      create customers_qa

  - id: inabox_standard_qa_smoke.002.insert_customer_abe
    status: supported
    kind: statement
    sql: |-
      insert into customers_qa (cust_id, first_name, address, city, state, zip, phone, phoneType) values('1','Abe','123 Main','Seattle','WA','98072','425-232-4323','cell;home')

  - id: inabox_standard_qa_smoke.003.insert_customer_abby
    status: supported
    kind: statement
    sql: |-
      insert into customers_qa (cust_id, first_name, address, city, state, zip, phone, phoneType) values('2','Abby','234 Main','Tacoma','WA','98011','425-333-2222','cell;business')

  - id: inabox_standard_qa_smoke.004.insert_customer_annie
    status: supported
    kind: statement
    sql: |-
      insert into customers_qa (cust_id, first_name, address, city, state, zip, phone, phoneType) values('3','Annie','345 Main','Seattle','WA','98072','425-333-2233','cell;home')

  - id: inabox_standard_qa_smoke.005.commit
    status: supported
    kind: statement
    sql: |-
      commit

  - id: inabox_standard_qa_smoke.006.customer_city_count
    status: supported
    kind: query
    sql: |-
      select count(*) as seattle_count
      from customers_qa
      where city = 'Seattle'
    expect:
      rows:
        - [2]

  - id: inabox_standard_qa_smoke.007.customer_city_projection
    status: supported
    kind: query
    order: rowsort
    sql: |-
      select first_name
      from customers_qa
      where city = 'Seattle'
    expect:
      columns: [first_name]
      rows:
        - ["Abe"]
        - ["Annie"]

  - id: inabox_standard_qa_smoke.008.default_bool_count
    status: supported
    kind: query
    sql: |-
      select count(*) as active_count
      from customers_qa
      where isActive = true
    expect:
      rows:
        - [3]

  - id: inabox_standard_qa_smoke.009.drop_customers
    status: supported
    kind: admin
    sql: |-
      drop customers_qa
