version: 1
name: mysql_compat_case

tests:
  - id: mysql_compat_case.001.searched_case_literal_first_match
    status: supported
    kind: query
    order: exact
    feature: conditional_expressions_case
    compatibility: mysql
    requires: [select, case]
    sql: |
      select case when 1 = 0 then 'miss'
                  when 1 = 1 then 'hit'
                  else 'fallback' end as value
    expect:
      columns: [value]
      rows:
        - [hit]

  - id: mysql_compat_case.002.searched_case_without_else_returns_null
    status: supported
    kind: query
    order: exact
    feature: conditional_expressions_case
    compatibility: mysql
    requires: [select, case, null]
    sql: |
      select case when 1 = 0 then 'miss' end as value
    expect:
      columns: [value]
      rows:
        - [null]

  - id: mysql_compat_case.003.searched_case_null_condition_is_not_true
    status: supported
    kind: query
    order: exact
    feature: conditional_expressions_case
    compatibility: mysql
    requires: [select, case, null]
    sql: |
      select case when null = 1 then 'hit'
                  else 'fallback' end as value
    expect:
      columns: [value]
      rows:
        - [fallback]

  - id: mysql_compat_case.010.rowbacked_searched_case_projection
    status: supported
    kind: query
    order: exact
    feature: conditional_expressions_case_rows
    compatibility: mysql
    requires: [select, case, concat, lower, order_by, limit]
    sql: |
      select c_custkey,
             case when c_mktsegment = 'BUILDING' then 'build'
                  when c_mktsegment = 'AUTOMOBILE' then concat('auto-', c_custkey)
                  else lower(c_mktsegment) end as segment_label
      from customer
      order by c_custkey
      limit 5
    expect:
      columns: [c_custkey, segment_label]
      rows:
        - [1, build]
        - [2, auto-2]
        - [3, auto-3]
        - [4, machinery]
        - [5, household]

  - id: mysql_compat_case.020.searched_case_predicate
    status: supported
    kind: query
    order: exact
    feature: conditional_expressions_case_predicates
    compatibility: mysql
    requires: [select, case, where, order_by, limit]
    sql: |
      select c_custkey, c_mktsegment
      from customer
      where case when c_mktsegment = 'BUILDING' then 1 else 0 end = 1
      order by c_custkey
      limit 5
    expect:
      columns: [c_custkey, c_mktsegment]
      rows:
        - [1, BUILDING]
        - [8, BUILDING]
        - [11, BUILDING]
        - [13, BUILDING]
        - [18, BUILDING]

  - id: mysql_compat_case.030.aggregate_searched_case
    status: supported
    kind: query
    order: exact
    feature: conditional_expressions_case_aggregates
    compatibility: mysql
    requires: [select, case, sum]
    sql: |
      select sum(case when l_quantity > 10 then 1 else 0 end) as quantity_gt_10
      from lineitem
    expect:
      columns: [quantity_gt_10]
      rows:
        - [48177]
