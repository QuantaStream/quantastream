version: 1
name: mysql_compat_tableau_connect

tests:
  - id: mysql_compat_tableau_connect.001.set_names_utf8mb4
    status: supported
    kind: statement
    feature: tableau_connect_session_setup
    compatibility: mysql
    requires: [set_names, session_variables, charset]
    sql: |
      set names utf8mb4

  - id: mysql_compat_tableau_connect.002.set_names_utf8mb4_collation
    status: supported
    kind: statement
    feature: tableau_connect_session_setup
    compatibility: mysql
    requires: [set_names, session_variables, charset, collations]
    sql: |
      set names utf8mb4 collate utf8mb4_0900_ai_ci

  - id: mysql_compat_tableau_connect.003.set_character_set_results_null
    status: supported
    kind: statement
    feature: tableau_connect_session_setup
    compatibility: mysql
    requires: [set, session_variables, charset]
    sql: |
      set character_set_results = NULL

  - id: mysql_compat_tableau_connect.004.set_mixed_session_defaults
    status: supported
    kind: statement
    feature: tableau_connect_session_setup
    compatibility: mysql
    requires: [set, session_variables, session_scope]
    sql: |
      set character_set_results = NULL, session sql_mode = 'ANSI_QUOTES', session sql_select_limit = DEFAULT

  - id: mysql_compat_tableau_connect.005.set_time_zone
    status: supported
    kind: statement
    feature: tableau_connect_session_setup
    compatibility: mysql
    requires: [set, time_zone]
    sql: |
      set time_zone = '+00:00'

  - id: mysql_compat_tableau_connect.006.set_autocommit
    status: supported
    kind: statement
    feature: tableau_connect_session_setup
    compatibility: mysql
    requires: [set, autocommit]
    sql: |
      set autocommit = 1

  - id: mysql_compat_tableau_connect.010.select_version_variables
    status: supported
    kind: query
    feature: tableau_connect_version_probe
    compatibility: mysql
    requires: [select, system_variables, version]
    sql: |
      select @@version as version_value,
             @@version_comment as version_comment,
             @@version_compile_os as version_compile_os,
             @@version_compile_machine as version_compile_machine
    expect:
      columns: [version_value, version_comment, version_compile_os, version_compile_machine]

  - id: mysql_compat_tableau_connect.011.select_connection_metadata_functions
    status: supported
    kind: query
    feature: tableau_connect_metadata_probe
    compatibility: mysql
    requires: [select, database, schema, version, user, current_user, connection_id]
    sql: |
      select database() as db_name,
             schema() as schema_name,
             version() as version_value,
             user() as user_value,
             current_user() as current_user_value,
             connection_id() as connection_id_value
    expect:
      columns: [db_name, schema_name, version_value, user_value, current_user_value, connection_id_value]

  - id: mysql_compat_tableau_connect.012.select_session_variables
    status: supported
    kind: query
    feature: tableau_connect_session_probe
    compatibility: mysql
    requires: [select, system_variables]
    sql: |
      select @@autocommit as autocommit_value,
             @@sql_mode as sql_mode_value,
             @@time_zone as time_zone_value,
             @@character_set_client as character_set_client,
             @@character_set_connection as character_set_connection,
             @@character_set_results as character_set_results,
             @@collation_connection as collation_connection
    expect:
      columns:
        - autocommit_value
        - sql_mode_value
        - time_zone_value
        - character_set_client
        - character_set_connection
        - character_set_results
        - collation_connection


  - id: mysql_compat_tableau_connect.013.connector_j_startup_variables
    status: supported
    kind: query
    feature: tableau_connect_jdbc_startup_probe
    compatibility: mysql
    requires: [select, system_variables, jdbc]
    sql: |
      /* mysql-connector-j-8.4.0 (Revision: test) */SELECT @@session.auto_increment_increment AS auto_increment_increment,
             @@character_set_client AS character_set_client,
             @@character_set_connection AS character_set_connection,
             @@character_set_results AS character_set_results,
             @@character_set_server AS character_set_server,
             @@collation_server AS collation_server,
             @@collation_connection AS collation_connection,
             @@init_connect AS init_connect,
             @@interactive_timeout AS interactive_timeout,
             @@license AS license,
             @@lower_case_table_names AS lower_case_table_names,
             @@max_allowed_packet AS max_allowed_packet,
             @@net_write_timeout AS net_write_timeout,
             @@performance_schema AS performance_schema,
             @@query_cache_size AS query_cache_size,
             @@query_cache_type AS query_cache_type,
             @@sql_mode AS sql_mode,
             @@system_time_zone AS system_time_zone,
             @@time_zone AS time_zone,
             @@tx_isolation AS transaction_isolation,
             @@wait_timeout AS wait_timeout
    expect:
      columns:
        - auto_increment_increment
        - character_set_client
        - character_set_connection
        - character_set_results
        - character_set_server
        - collation_server
        - collation_connection
        - init_connect
        - interactive_timeout
        - license
        - lower_case_table_names
        - max_allowed_packet
        - net_write_timeout
        - performance_schema
        - query_cache_size
        - query_cache_type
        - sql_mode
        - system_time_zone
        - time_zone
        - transaction_isolation
        - wait_timeout

  - id: mysql_compat_tableau_connect.014.select_tx_read_only_variable
    status: supported
    kind: query
    feature: tableau_connect_transaction_probe
    compatibility: mysql
    requires: [select, system_variables, transactions]
    sql: |
      select @@session.tx_read_only as tx_read_only
    expect:
      columns: [tx_read_only]

  - id: mysql_compat_tableau_connect.015.derived_probe_projection
    status: supported
    kind: query
    feature: tableau_connect_capability_probe
    compatibility: mysql
    requires: [select, derived_table, aliases]
    sql: |
      SELECT `COL` FROM (SELECT 1 AS `COL`) AS `SUBQUERY`
    expect:
      columns: [COL]
      rows:
        - [1]

  - id: mysql_compat_tableau_connect.016.derived_probe_limit
    status: supported
    kind: query
    feature: tableau_connect_capability_probe
    compatibility: mysql
    requires: [select, derived_table, aliases, limit]
    sql: |
      SELECT `COL` FROM (SELECT 1 AS `COL`) AS `CHECKTOP` LIMIT 1
    expect:
      columns: [COL]
      rows:
        - [1]

  - id: mysql_compat_tableau_connect.017.derived_probe_group_by_ordinal
    status: supported
    kind: query
    feature: tableau_connect_capability_probe
    compatibility: mysql
    requires: [select, derived_table, aliases, group_by]
    sql: |
      SELECT `SUBCOL` AS `COL` FROM ( SELECT 1 AS `SUBCOL` ) `SUBQUERY` GROUP BY 1
    expect:
      columns: [COL]
      rows:
        - [1]

  - id: mysql_compat_tableau_connect.018.derived_probe_group_by_ordinal_error
    status: supported
    kind: query
    feature: tableau_connect_capability_probe
    compatibility: mysql
    requires: [select, derived_table, aliases, group_by]
    sql: |
      SELECT `SUBCOL` AS `COL` FROM ( SELECT 1 AS `SUBCOL` ) `SUBQUERY` GROUP BY 2
    expect:
      error_contains: GROUP BY ordinal is out of range

  - id: mysql_compat_tableau_connect.020.show_connect_variables
    status: supported
    kind: query
    feature: tableau_connect_session_probe
    compatibility: mysql
    requires: [show_variables, where, in]
    sql: |
      show variables where Variable_name in ('version', 'version_comment', 'sql_mode', 'autocommit', 'time_zone')

  - id: mysql_compat_tableau_connect.021.show_character_set
    status: supported
    kind: query
    feature: tableau_connect_charset_probe
    compatibility: mysql
    requires: [show_character_set]
    sql: |
      show character set like 'utf8mb4'

  - id: mysql_compat_tableau_connect.022.show_collation
    status: supported
    kind: query
    feature: tableau_connect_charset_probe
    compatibility: mysql
    requires: [show_collation]
    sql: |
      show collation like 'utf8mb4%'

  - id: mysql_compat_tableau_connect.030.use_database
    status: supported
    kind: statement
    feature: tableau_connect_database_selection
    compatibility: mysql
    requires: [use]
    sql: |
      use quanta

  - id: mysql_compat_tableau_connect.031.select_database_after_use
    status: supported
    kind: query
    feature: tableau_connect_database_selection
    compatibility: mysql
    requires: [select, database, schema]
    sql: |
      select database() as db_name,
             schema() as schema_name
    expect:
      columns: [db_name, schema_name]

  - id: mysql_compat_tableau_connect.040.show_warnings_empty_ok
    status: supported
    kind: query
    feature: tableau_connect_diagnostics
    compatibility: mysql
    requires: [show_warnings]
    sql: |
      show warnings

  - id: mysql_compat_tableau_connect.041.ping_select_one
    status: supported
    kind: query
    feature: tableau_connect_ping
    compatibility: mysql
    requires: [select, literals]
    sql: |
      select 1 as ping_value
    expect:
      columns: [ping_value]
      rows:
        - [1]
