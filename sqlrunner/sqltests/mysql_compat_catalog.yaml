version: 1
name: mysql_compat_catalog

tests:
  - id: mysql_compat_catalog.001.show_databases
    status: supported
    kind: query
    feature: catalog_schemas
    compatibility: mysql
    requires: [show_databases, metadata_columns]
    sql: |
      show databases
    expect:
      columns: [Database]

  - id: mysql_compat_catalog.002.show_create_database
    status: supported
    kind: query
    feature: catalog_schemas
    compatibility: mysql
    requires: [show_create_database, metadata_columns]
    sql: |
      show create database quanta
    expect:
      columns: [Database, Create Database]
      row_count: 1

  - id: mysql_compat_catalog.003.use_database
    status: supported
    kind: statement
    feature: catalog_schemas
    compatibility: mysql
    requires: [use_database]
    sql: |
      use quanta

  - id: mysql_compat_catalog.010.show_tables
    status: supported
    kind: query
    feature: catalog_tables
    compatibility: mysql
    requires: [show_tables]
    sql: |
      show tables

  - id: mysql_compat_catalog.011.show_full_tables
    status: supported
    kind: query
    feature: catalog_tables
    compatibility: mysql
    requires: [show_full_tables, metadata_columns]
    sql: |
      show full tables
    expect:
      columns: [Tables_in_quanta, Table_type]

  - id: mysql_compat_catalog.0111.show_full_tables_where_view
    status: supported
    kind: query
    feature: catalog_tables
    compatibility: mysql
    requires: [show_full_tables, metadata_columns, where]
    sql: |
      show full tables where Table_type = 'VIEW'
    expect:
      columns: [Tables_in_quanta, Table_type]

  - id: mysql_compat_catalog.015.show_table_status
    status: supported
    kind: query
    feature: catalog_tables
    compatibility: mysql
    requires: [show_table_status, metadata_columns]
    sql: |
      show table status like 'customer'
    expect:
      columns:
        - Name
        - Engine
        - Version
        - Row_format
        - Rows
        - Avg_row_length
        - Data_length
        - Max_data_length
        - Index_length
        - Data_free
        - Auto_increment
        - Create_time
        - Update_time
        - Check_time
        - Collation
        - Checksum
        - Create_options
        - Comment

  - id: mysql_compat_catalog.012.information_schema_tables
    status: supported
    kind: query
    feature: information_schema_tables
    compatibility: mysql
    requires: [information_schema, metadata_columns]
    sql: |
      select table_name, table_type
      from information_schema.tables
      where table_schema = 'quanta'
      limit 5
    expect:
      columns: [TABLE_NAME, TABLE_TYPE]

  - id: mysql_compat_catalog.013.information_schema_columns
    status: supported
    kind: query
    feature: information_schema_columns
    compatibility: mysql
    requires: [information_schema, metadata_columns]
    sql: |
      select column_name, data_type, column_key, extra
      from information_schema.columns
      where table_schema = 'quanta' and table_name = 'customer'
      order by ordinal_position
      limit 5
    expect:
      columns: [COLUMN_NAME, DATA_TYPE, COLUMN_KEY, EXTRA]

  - id: mysql_compat_catalog.0131.information_schema_schemata
    status: supported
    kind: query
    feature: information_schema_schemata
    compatibility: mysql
    requires: [information_schema, metadata_columns]
    sql: |
      select schema_name, default_character_set_name, default_collation_name
      from information_schema.schemata
      where schema_name = 'quanta'
    expect:
      columns: [SCHEMA_NAME, DEFAULT_CHARACTER_SET_NAME, DEFAULT_COLLATION_NAME]

  - id: mysql_compat_catalog.0132.information_schema_character_sets
    status: supported
    kind: query
    feature: information_schema_character_sets
    compatibility: mysql
    requires: [information_schema, metadata_columns]
    sql: |
      select character_set_name, default_collate_name, maxlen
      from information_schema.character_sets
      where character_set_name = 'utf8mb4'
    expect:
      columns: [CHARACTER_SET_NAME, DEFAULT_COLLATE_NAME, MAXLEN]
      row_count: 1

  - id: mysql_compat_catalog.0133.information_schema_collations
    status: supported
    kind: query
    feature: information_schema_collations
    compatibility: mysql
    requires: [information_schema, metadata_columns]
    sql: |
      select collation_name, character_set_name, is_default, pad_attribute
      from information_schema.collations
      where character_set_name in ('utf8mb4')
      order by collation_name
    expect:
      columns: [COLLATION_NAME, CHARACTER_SET_NAME, IS_DEFAULT, PAD_ATTRIBUTE]
      row_count: 2

  - id: mysql_compat_catalog.0134.information_schema_views
    status: supported
    kind: query
    feature: information_schema_views
    compatibility: mysql
    requires: [information_schema, metadata_columns, views]
    sql: |
      select table_name, view_definition, check_option, is_updatable, definer
      from information_schema.views
      where table_schema = 'quanta'
      limit 0
    expect:
      columns: [TABLE_NAME, VIEW_DEFINITION, CHECK_OPTION, IS_UPDATABLE, DEFINER]

  - id: mysql_compat_catalog.0135.information_schema_tables_workbench_shape
    status: supported
    kind: query
    feature: information_schema_tables
    compatibility: mysql
    requires: [information_schema, metadata_columns]
    sql: |
      select table_catalog,
             table_schema,
             table_name,
             table_type,
             engine,
             row_format,
             table_collation,
             table_comment
      from information_schema.tables
      where table_schema = 'quanta' and table_name = 'customer'
    expect:
      columns: [TABLE_CATALOG, TABLE_SCHEMA, TABLE_NAME, TABLE_TYPE, ENGINE, ROW_FORMAT, TABLE_COLLATION, TABLE_COMMENT]

  - id: mysql_compat_catalog.0136.information_schema_columns_workbench_shape
    status: supported
    kind: query
    feature: information_schema_columns
    compatibility: mysql
    requires: [information_schema, metadata_columns]
    sql: |
      select table_catalog,
             table_schema,
             table_name,
             column_name,
             ordinal_position,
             column_default,
             is_nullable,
             data_type,
             character_maximum_length,
             character_octet_length,
             numeric_precision,
             numeric_scale,
             datetime_precision,
             character_set_name,
             collation_name,
             column_type,
             column_key,
             extra,
             privileges,
             column_comment,
             generation_expression,
             srs_id
      from information_schema.columns
      where table_schema = 'quanta' and table_name = 'customer'
      order by ordinal_position
      limit 0
    expect:
      columns:
        - TABLE_CATALOG
        - TABLE_SCHEMA
        - TABLE_NAME
        - COLUMN_NAME
        - ORDINAL_POSITION
        - COLUMN_DEFAULT
        - IS_NULLABLE
        - DATA_TYPE
        - CHARACTER_MAXIMUM_LENGTH
        - CHARACTER_OCTET_LENGTH
        - NUMERIC_PRECISION
        - NUMERIC_SCALE
        - DATETIME_PRECISION
        - CHARACTER_SET_NAME
        - COLLATION_NAME
        - COLUMN_TYPE
        - COLUMN_KEY
        - EXTRA
        - PRIVILEGES
        - COLUMN_COMMENT
        - GENERATION_EXPRESSION
        - SRS_ID

  - id: mysql_compat_catalog.016.information_schema_statistics
    status: supported
    kind: query
    feature: information_schema_statistics
    compatibility: mysql
    requires: [information_schema, metadata_columns, mapper_metadata]
    sql: |
      select index_name, seq_in_index, column_name, index_comment
      from information_schema.statistics
      where table_schema = 'quanta' and table_name = 'customer'
      order by index_name, seq_in_index
      limit 5
    expect:
      columns: [INDEX_NAME, SEQ_IN_INDEX, COLUMN_NAME, INDEX_COMMENT]

