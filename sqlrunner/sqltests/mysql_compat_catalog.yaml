version: 1
name: mysql_compat_catalog

tests:
  - id: mysql_compat_catalog.001.show_databases
    status: supported
    kind: query
    feature: catalog_schemas
    compatibility: mysql
    requires: [show_databases, metadata_columns]
    sql: |
      show databases
    expect:
      columns: [Database]

  - id: mysql_compat_catalog.002.show_create_database
    status: supported
    kind: query
    feature: catalog_schemas
    compatibility: mysql
    requires: [show_create_database, metadata_columns]
    sql: |
      show create database quanta
    expect:
      columns: [Database, Create Database]
      row_count: 1

  - id: mysql_compat_catalog.003.use_database
    status: supported
    kind: statement
    feature: catalog_schemas
    compatibility: mysql
    requires: [use_database]
    sql: |
      use quanta

  - id: mysql_compat_catalog.010.show_tables
    status: supported
    kind: query
    feature: catalog_tables
    compatibility: mysql
    requires: [show_tables]
    sql: |
      show tables

  - id: mysql_compat_catalog.011.show_full_tables
    status: supported
    kind: query
    feature: catalog_tables
    compatibility: mysql
    requires: [show_full_tables, metadata_columns]
    sql: |
      show full tables
    expect:
      columns: [Tables_in_quanta, Table_type]

  - id: mysql_compat_catalog.015.show_table_status
    status: supported
    kind: query
    feature: catalog_tables
    compatibility: mysql
    requires: [show_table_status, metadata_columns]
    sql: |
      show table status like 'customer'
    expect:
      columns:
        - Name
        - Engine
        - Version
        - Row_format
        - Rows
        - Avg_row_length
        - Data_length
        - Max_data_length
        - Index_length
        - Data_free
        - Auto_increment
        - Create_time
        - Update_time
        - Check_time
        - Collation
        - Checksum
        - Create_options
        - Comment

  - id: mysql_compat_catalog.012.information_schema_tables
    status: supported
    kind: query
    feature: information_schema_tables
    compatibility: mysql
    requires: [information_schema, metadata_columns]
    sql: |
      select table_name, table_type
      from information_schema.tables
      where table_schema = 'quanta'
      limit 5
    expect:
      columns: [TABLE_NAME, TABLE_TYPE]

  - id: mysql_compat_catalog.013.information_schema_columns
    status: supported
    kind: query
    feature: information_schema_columns
    compatibility: mysql
    requires: [information_schema, metadata_columns]
    sql: |
      select column_name, data_type, column_key, extra
      from information_schema.columns
      where table_schema = 'quanta' and table_name = 'customer'
      order by ordinal_position
      limit 5
    expect:
      columns: [COLUMN_NAME, DATA_TYPE, COLUMN_KEY, EXTRA]

  - id: mysql_compat_catalog.0131.information_schema_schemata
    status: supported
    kind: query
    feature: information_schema_schemata
    compatibility: mysql
    requires: [information_schema, metadata_columns]
    sql: |
      select schema_name, default_character_set_name, default_collation_name
      from information_schema.schemata
      where schema_name = 'quanta'
    expect:
      columns: [SCHEMA_NAME, DEFAULT_CHARACTER_SET_NAME, DEFAULT_COLLATION_NAME]

  - id: mysql_compat_catalog.016.information_schema_statistics
    status: supported
    kind: query
    feature: information_schema_statistics
    compatibility: mysql
    requires: [information_schema, metadata_columns, mapper_metadata]
    sql: |
      select index_name, seq_in_index, column_name, index_comment
      from information_schema.statistics
      where table_schema = 'quanta' and table_name = 'customer'
      order by index_name, seq_in_index
      limit 5
    expect:
      columns: [INDEX_NAME, SEQ_IN_INDEX, COLUMN_NAME, INDEX_COMMENT]

  - id: mysql_compat_catalog.014.show_variables
    status: supported
    kind: query
    feature: catalog_variables
    compatibility: mysql
    requires: [show_variables]
    sql: |
      show variables like 'character_set_%'
    expect:
      columns: [variable_name, value]

  - id: mysql_compat_catalog.01401.show_session_variables
    status: supported
    kind: query
    feature: catalog_variables
    compatibility: mysql
    requires: [show_variables, session_scope]
    sql: |
      show session variables like 'character_set_%'
    expect:
      columns: [variable_name, value]

  - id: mysql_compat_catalog.0141.show_status
    status: supported
    kind: query
    feature: catalog_status
    compatibility: mysql
    requires: [show_status, metadata_columns]
    sql: |
      show status like 'Threads_connected'
    expect:
      columns: [variable_name, value]

  - id: mysql_compat_catalog.01411.show_global_status
    status: supported
    kind: query
    feature: catalog_status
    compatibility: mysql
    requires: [show_status, session_scope, metadata_columns]
    sql: |
      show global status like 'Threads_connected'
    expect:
      columns: [variable_name, value]

  - id: mysql_compat_catalog.017.show_warnings
    status: supported
    kind: query
    feature: catalog_warnings
    compatibility: mysql
    requires: [show_warnings, metadata_columns]
    sql: |
      show warnings
    expect:
      columns: [Level, Code, Message]

  - id: mysql_compat_catalog.0171.show_warnings_limit
    status: supported
    kind: query
    feature: catalog_warnings
    compatibility: mysql
    requires: [show_warnings, metadata_columns, limit]
    sql: |
      show warnings limit 10
    expect:
      columns: [Level, Code, Message]

  - id: mysql_compat_catalog.018.show_character_set
    status: supported
    kind: query
    feature: catalog_character_sets
    compatibility: mysql
    requires: [show_character_set, metadata_columns]
    sql: |
      show character set like 'utf8mb4'
    expect:
      columns: [Charset, Description, "Default collation", Maxlen]

  - id: mysql_compat_catalog.0181.show_character_set_where_charset
    status: supported
    kind: query
    feature: catalog_character_sets
    compatibility: mysql
    requires: [show_character_set, metadata_columns]
    sql: |
      show character set where Charset = 'utf8mb4'
    expect:
      columns: [Charset, Description, "Default collation", Maxlen]

  - id: mysql_compat_catalog.019.show_collation
    status: supported
    kind: query
    feature: catalog_collations
    compatibility: mysql
    requires: [show_collation, metadata_columns]
    sql: |
      show collation like 'utf8mb4_0900%'
    expect:
      columns: [Collation, Charset, Id, "Default", Compiled, Sortlen]

  - id: mysql_compat_catalog.0191.show_collation_where_charset
    status: supported
    kind: query
    feature: catalog_collations
    compatibility: mysql
    requires: [show_collation, metadata_columns]
    sql: |
      show collation where Charset = 'utf8mb4'
    expect:
      columns: [Collation, Charset, Id, "Default", Compiled, Sortlen]

  - id: mysql_compat_catalog.020.describe_table
    status: supported
    kind: query
    feature: catalog_columns
    compatibility: mysql
    requires: [describe, metadata_columns]
    sql: |
      describe customer
    expect:
      columns: [Field, Type, "Null", Key, Default, Extra]

  - id: mysql_compat_catalog.021.show_columns_from_table
    status: supported
    kind: query
    feature: catalog_columns
    compatibility: mysql
    requires: [show_columns, metadata_columns]
    sql: |
      show columns from customer
    expect:
      columns: [Field, Type, "Null", Key, Default, Extra]

  - id: mysql_compat_catalog.022.show_full_columns_from_table
    status: supported
    kind: query
    feature: catalog_columns
    compatibility: mysql
    requires: [show_full_columns, metadata_columns]
    sql: |
      show full columns from customer
    expect:
      columns: [Field, Type, Collation, "Null", Key, Default, Extra, Privileges, Comment]

  - id: mysql_compat_catalog.030.show_create_table
    status: supported
    kind: query
    feature: catalog_create_table
    compatibility: mysql
    requires: [show_create_table, metadata_columns]
    sql: |
      show create table customer
    expect:
      columns: [Table, Create Table]
      row_count: 1

  - id: mysql_compat_catalog.040.show_index_from_table
    status: supported
    kind: query
    feature: catalog_indexes
    compatibility: mysql
    requires: [show_index, metadata_columns, mapper_metadata]
    sql: |
      show index from customer
    expect:
      columns:
        - Table
        - Non_unique
        - Key_name
        - Seq_in_index
        - Column_name
        - Collation
        - Cardinality
        - Sub_part
        - Packed
        - "Null"
        - Index_type
        - Comment
        - Index_comment
        - Visible
        - Expression

  - id: mysql_compat_catalog.041.show_keys_alias
    status: supported
    kind: query
    feature: catalog_indexes
    compatibility: mysql
    requires: [show_keys, metadata_columns, mapper_metadata]
    sql: |
      show keys from customer
    expect:
      columns:
        - Table
        - Non_unique
        - Key_name
        - Seq_in_index
        - Column_name
        - Collation
        - Cardinality
        - Sub_part
        - Packed
        - "Null"
        - Index_type
        - Comment
        - Index_comment
        - Visible
        - Expression

  - id: mysql_compat_catalog.050.show_engines
    status: supported
    kind: query
    feature: catalog_storage_engine
    compatibility: mysql
    requires: [show_engines, metadata_columns]
    sql: |
      show engines
    expect:
      columns: [Engine, Support, Comment, Transactions, XA, Savepoints]
      row_count: 1

  - id: mysql_compat_catalog.051.show_table_types
    status: supported
    kind: query
    feature: catalog_storage_engine
    compatibility: mysql
    requires: [show_table_types, metadata_columns]
    sql: |
      show table types
    expect:
      columns: [Engine, Support, Comment, Transactions, XA, Savepoints]
      row_count: 1

  - id: mysql_compat_catalog.052.show_plugins
    status: supported
    kind: query
    feature: catalog_plugins
    compatibility: mysql
    requires: [show_plugins, metadata_columns]
    sql: |
      show plugins
    expect:
      columns: [Name, Status, Type, Library, License]
      row_count: 1

  - id: mysql_compat_catalog.053.show_privileges
    status: supported
    kind: query
    feature: catalog_privileges
    compatibility: mysql
    requires: [show_privileges, metadata_columns]
    sql: |
      show privileges
    expect:
      columns: [Privilege, Context, Comment]

  - id: mysql_compat_catalog.054.show_grants
    status: supported
    kind: query
    feature: catalog_privileges
    compatibility: mysql
    requires: [show_grants, metadata_columns]
    sql: |
      show grants
    expect:
      row_count: 2

  - id: mysql_compat_catalog.055.show_processlist
    status: supported
    kind: query
    feature: catalog_processlist
    compatibility: mysql
    requires: [show_processlist, metadata_columns]
    sql: |
      show full processlist
    expect:
      columns: [Id, User, Host, db, Command, Time, State, Info]
      row_count: 1

  - id: mysql_compat_catalog.056.show_open_tables
    status: supported
    kind: query
    feature: catalog_tables
    compatibility: mysql
    requires: [show_open_tables, metadata_columns]
    sql: |
      show open tables from quanta like 'customer'
    expect:
      columns: [Database, Table, In_use, Name_locked]
      row_count: 1

  - id: mysql_compat_catalog.057.show_function_status
    status: supported
    kind: query
    feature: catalog_routines
    compatibility: mysql
    requires: [show_function_status, metadata_columns]
    sql: |
      show function status like 'lower'
    expect:
      columns:
        - Db
        - Name
        - Type
        - Definer
        - Modified
        - Created
        - Security_type
        - Comment
        - character_set_client
        - collation_connection
        - Database Collation
      row_count: 1

  - id: mysql_compat_catalog.058.show_procedure_status
    status: supported
    kind: query
    feature: catalog_routines
    compatibility: mysql
    requires: [show_procedure_status, metadata_columns]
    sql: |
      show procedure status
    expect:
      columns:
        - Db
        - Name
        - Type
        - Definer
        - Modified
        - Created
        - Security_type
        - Comment
        - character_set_client
        - collation_connection
        - Database Collation
      row_count: 0

  - id: mysql_compat_catalog.059.show_triggers
    status: supported
    kind: query
    feature: catalog_triggers
    compatibility: mysql
    requires: [show_triggers, metadata_columns]
    sql: |
      show triggers from quanta
    expect:
      columns:
        - Trigger
        - Event
        - Table
        - Statement
        - Timing
        - Created
        - sql_mode
        - Definer
        - character_set_client
        - collation_connection
        - Database Collation
      row_count: 0

  - id: mysql_compat_catalog.060.show_events
    status: supported
    kind: query
    feature: catalog_events
    compatibility: mysql
    requires: [show_events, metadata_columns]
    sql: |
      show events from quanta
    expect:
      columns:
        - Db
        - Name
        - Definer
        - Time zone
        - Type
        - Execute at
        - Interval value
        - Interval field
        - Starts
        - Ends
        - Status
        - Originator
        - character_set_client
        - collation_connection
        - Database Collation
      row_count: 0
