version: 1
name: legacy_direct_smoke
tests:
  - id: legacy_direct.part_count
    kind: query
    sql: |
      select count(*) as part_count
      from part
      where p_size >= 1;
    expect:
      columns: ["part_count"]
      types: ["BIGINT"]
      rows:
        - [2000]

  - id: legacy_direct.part_size_eq_count
    kind: query
    sql: |
      select count(*) as part_count
      from part
      where p_size = 14;
    expect:
      columns: ["part_count"]
      types: ["BIGINT"]
      rows:
        - [37]

  - id: legacy_direct.part_size_lt_count
    kind: query
    sql: |
      select count(*) as part_count
      from part
      where p_size < 10;
    expect:
      columns: ["part_count"]
      types: ["BIGINT"]
      rows:
        - [370]

  - id: legacy_direct.part_size_gt_count
    kind: query
    sql: |
      select count(*) as part_count
      from part
      where p_size > 40;
    expect:
      columns: ["part_count"]
      types: ["BIGINT"]
      rows:
        - [395]

  - id: legacy_direct.part_size_in_count
    kind: query
    sql: |
      select count(*) as part_count
      from part
      where p_size in (3, 9, 14);
    expect:
      columns: ["part_count"]
      types: ["BIGINT"]
      rows:
        - [112]

  - id: legacy_direct.part_type_eq_count
    kind: query
    sql: |
      select count(*) as part_count
      from part
      where p_type = 'PROMO BURNISHED COPPER';
    expect:
      columns: ["part_count"]
      types: ["BIGINT"]
      rows:
        - [12]

  - id: legacy_direct.part_type_in_count
    kind: query
    sql: |
      select count(*) as part_count
      from part
      where p_type in ('PROMO BURNISHED COPPER', 'SMALL BRUSHED BRASS');
    expect:
      columns: ["part_count"]
      types: ["BIGINT"]
      rows:
        - [24]

  - id: legacy_direct.part_size_projection
    kind: query
    sql: |
      select p_size
      from part
      where p_size = 14
      limit 1;
    expect:
      columns: ["p_size"]
      types: ["BIGINT"]
      rows:
        - [14]

  - id: legacy_direct.part_type_projection
    kind: query
    sql: |
      select p_type
      from part
      where p_type = 'PROMO BURNISHED COPPER'
      limit 1;
    expect:
      columns: ["p_type"]
      types: ["VARCHAR"]
      rows:
        - ["PROMO BURNISHED COPPER"]

  - id: legacy_direct.part_multi_column_projection
    kind: query
    sql: |
      select p_size, p_type
      from part
      where p_size = 14
      limit 2;
    expect:
      columns: ["p_size", "p_type"]
      types: ["BIGINT", "VARCHAR"]
      rows:
        - [14, "SMALL PLATED BRASS"]
        - [14, "MEDIUM ANODIZED BRASS"]

  - id: legacy_direct.part_projection_limit_offset
    kind: query
    sql: |
      select p_size, p_type
      from part
      where p_type = 'PROMO BURNISHED COPPER'
      limit 1 offset 1;
    expect:
      columns: ["p_size", "p_type"]
      types: ["BIGINT", "VARCHAR"]
      rows:
        - [45, "PROMO BURNISHED COPPER"]

  - id: legacy_direct.part_size_sum
    kind: query
    sql: |
      select sum(p_size) as size_sum
      from part
      where p_size = 14;
    expect:
      columns: ["size_sum"]
      types: ["DOUBLE"]
      rows:
        - [518]

  - id: legacy_direct.part_size_min
    kind: query
    sql: |
      select min(p_size) as min_size
      from part
      where p_size > 40;
    expect:
      columns: ["min_size"]
      types: ["DOUBLE"]
      rows:
        - [41]

  - id: legacy_direct.part_size_max
    kind: query
    sql: |
      select max(p_size) as max_size
      from part
      where p_size < 10;
    expect:
      columns: ["max_size"]
      types: ["DOUBLE"]
      rows:
        - [9]

  - id: legacy_direct.part_size_avg
    kind: query
    sql: |
      select avg(p_size) as avg_size
      from part
      where p_size in (3, 9, 14);
    expect:
      columns: ["avg_size"]
      types: ["DOUBLE"]
      rows:
        - [8.723214285714286]
