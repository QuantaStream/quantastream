version: 1
name: mysql_compat_joins

tests:
  - id: mysql_compat_joins.001.inner_join_projection
    status: supported
    kind: query
    order: exact
    feature: joins_inner
    compatibility: mysql
    requires: [select, table_scan, inner_join, aliases, order_by, limit]
    sql: |
      select c.c_name as customer_name, o.o_orderkey as order_key
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      where c.c_custkey = 1
      order by o.o_orderkey
      limit 3
    expect:
      columns: [customer_name, order_key]
      rows:
        - [Customer#000000001, 9154]
        - [Customer#000000001, 14656]
        - [Customer#000000001, 24322]

  - id: mysql_compat_joins.002.left_join_matched_count
    status: supported
    kind: query
    order: exact
    feature: joins_left_outer
    compatibility: mysql
    requires: [select, table_scan, left_join]
    sql: |
      select count(*) as joined_rows
      from region as r
      left join nation as n on n.n_regionkey = r.r_regionkey
    expect:
      columns: [joined_rows]
      rows:
        - [25]

  - id: mysql_compat_joins.003.join_on_predicate
    status: supported
    kind: query
    order: exact
    feature: joins_predicates
    compatibility: mysql
    requires: [select, table_scan, inner_join, on_predicate, comparison, order_by]
    sql: |
      select n.n_name as nation_name, r.r_name as region_name
      from nation as n
      inner join region as r on r.r_regionkey = n.n_regionkey and r.r_name = 'AMERICA'
      order by n.n_name
    expect:
      columns: [nation_name, region_name]
      rows:
        - [ARGENTINA, AMERICA]
        - [BRAZIL, AMERICA]
        - [CANADA, AMERICA]
        - [PERU, AMERICA]
        - [UNITED STATES, AMERICA]

  - id: mysql_compat_joins.004.three_table_join
    status: supported
    kind: query
    order: exact
    feature: joins_multi_table
    compatibility: mysql
    requires: [select, table_scan, inner_join, multi_join, where]
    sql: |
      select count(*) as customer_count
      from region as r
      inner join nation as n on n.n_regionkey = r.r_regionkey
      inner join customer as c on c.c_nationkey = n.n_nationkey
      where r.r_name = 'AMERICA'
    expect:
      columns: [customer_count]
      rows:
        - [300]

  - id: mysql_compat_joins.005.join_group_count
    status: supported
    kind: query
    order: exact
    feature: joins_group_by
    compatibility: mysql
    requires: [select, table_scan, inner_join, group_by, count, order_by]
    sql: |
      select n.n_name as nation_name, count(*) as customer_count
      from nation as n
      inner join customer as c on c.c_nationkey = n.n_nationkey
      where n.n_regionkey = 1
      group by n.n_name
      order by n.n_name
    expect:
      columns: [nation_name, customer_count]
      rows:
        - [ARGENTINA, 59]
        - [BRAZIL, 68]
        - [CANADA, 69]
        - [PERU, 56]
        - [UNITED STATES, 48]
