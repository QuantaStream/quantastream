version: 1
name: quanta_extension_catalog_boundaries

tests:
  - id: quanta_extension_catalog_boundaries.001.alter_table_add_foreign_key_with_reverse_artifact
    status: xfail
    kind: statement
    feature: catalog_foreign_key_reverse_artifact
    compatibility: quanta_extension
    requires: [alter_table, add_foreign_key, reverse_artifact]
    issue: "QS needs an ALTER TABLE FK extension that can opt into parent-to-child reverse artifact maintenance for relationship predicates when the child cardinality is appropriate."
    sql: |
      alter table lineitem
      add constraint fk_lineitem_orders_reverse
      foreign key (l_orderkey)
      references orders(o_orderkey)
      with reverse artifact
