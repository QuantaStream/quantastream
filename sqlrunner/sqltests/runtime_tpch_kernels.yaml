  - id: "runtime_tpch_kernels.319b.q1_pricing_summary"
    status: supported
    kind: query
    capabilities: [tpch-q1, single-table, time-range, grouped-aggregate, arithmetic-aggregate, avg, multi-key-order]
    sql: |-
      select l_returnflag,
             l_linestatus,
             sum(l_quantity) as sum_qty,
             sum(l_extendedprice) as sum_base_price,
             sum(l_extendedprice * (1 - l_discount)) as sum_disc_price,
             sum(l_extendedprice * (1 - l_discount) * (1 + l_tax)) as sum_charge,
             avg(l_quantity) as avg_qty,
             avg(l_extendedprice) as avg_price,
             avg(l_discount) as avg_disc,
             count(*) as count_order
      from lineitem_tpch_qa
      where l_shipdate >= '1998-01-01'
        and l_shipdate <= '1998-09-02'
      group by l_returnflag, l_linestatus
      order by l_returnflag, l_linestatus
    expect:
      columns: [l_returnflag, l_linestatus, sum_qty, sum_base_price, sum_disc_price, sum_charge, avg_qty, avg_price, avg_disc, count_order]
      rows:
        - ["A", "F", 30.0, 300.0, 290.0, 314.5, 15, 150.0, 0.05, 2]
        - ["R", "F", 5.0, 50.0, 40.0, 40.0, 5, 50.0, 0.2, 1]

