  - id: "runtime_tpch_kernels.240.q22_positive_no_order_group"
    status: supported
    kind: query
    order: rowsort
    capabilities: [tpch-q22, scalar-in, anti-membership, group-by, sum]
    sql: |-
      select substr(c.c_phone, 1, 2) as cntrycode,
             count(*) as numcust,
             sum(c.c_acctbal) as totacctbal
      from customer_tpch_qa as c
      where substr(c.c_phone, 1, 2) in ('13', '31', '23', '29', '30', '18', '17')
        and c.c_acctbal > 0
        and c.c_custkey not in (
          select o_custkey
          from orders_tpch_qa
        )
      group by substr(c.c_phone, 1, 2)
    expect:
      columns: [cntrycode, numcust, totacctbal]
      rows:
        - ["13", 2, 175.0]
        - ["18", 1, 120.0]
        - ["29", 1, 300.0]

