  - id: "runtime_tpch_kernels.100.q16_part_filter"
    status: supported
    kind: query
    capabilities: [tpch-q16, residual-not-like, in-list, count]
    sql: |-
      select count(*) as part_count
      from part_qa
      where p_brand <> 'Brand#45'
        and p_type not like 'MEDIUM POLISHED%'
        and p_size in (49, 14, 23, 45, 19, 3, 36, 9)
    expect:
      columns: [part_count]
      rows:
        - [4]

  - id: "runtime_tpch_kernels.110.q16_distinct_supplier_count"
    status: supported
    kind: query
    order: rowsort
    capabilities: [tpch-q16, grouped-join, count-distinct]
    sql: |-
      select p.p_brand, p.p_type, p.p_size, count(distinct ps.ps_suppkey) as supplier_cnt
      from part_qa as p
      inner join partsupp_qa as ps on ps.ps_partkey = p.p_partkey
      where p.p_brand <> 'Brand#45'
        and p.p_type not like 'MEDIUM POLISHED%'
        and p.p_size in (49, 14, 23, 45, 19, 3, 36, 9)
      group by p.p_brand, p.p_type, p.p_size
    expect:
      columns: [p_brand, p_type, p_size, supplier_cnt]
      rows:
        - ["Brand#35", "SMALL POLISHED COPPER", 14, 3]
        - ["Brand#14", "PROMO BRUSHED STEEL", 9, 2]
        - ["Brand#22", "LARGE BURNISHED TIN", 36, 1]

  - id: "runtime_tpch_kernels.120.q16_complaint_supplier_filter"
    status: supported
    kind: query
    capabilities: [tpch-q16, not-in, subquery-filter, count]
    sql: |-
      select count(*) as clean_partsupp_count
      from partsupp_qa as ps
      where ps.ps_suppkey not in (
        select s_suppkey
        from supplier_qa
        where s_comment like '%Customer%Complaints%'
      )
    expect:
      columns: [clean_partsupp_count]
      rows:
        - [5]

  - id: "runtime_tpch_kernels.130.q16_distinct_supplier_count_without_complaints"
    status: supported
    kind: query
    order: rowsort
    capabilities: [tpch-q16, grouped-join, count-distinct, anti-membership]
    sql: |-
      select p.p_brand, p.p_type, p.p_size, count(distinct ps.ps_suppkey) as supplier_cnt
      from part_qa as p
      inner join partsupp_qa as ps on ps.ps_partkey = p.p_partkey
      where p.p_brand <> 'Brand#45'
        and p.p_type not like 'MEDIUM POLISHED%'
        and p.p_size in (49, 14, 23, 45, 19, 3, 36, 9)
        and ps.ps_suppkey not in (
          select s_suppkey
          from supplier_qa
          where s_comment like '%Customer%Complaints%'
        )
      group by p.p_brand, p.p_type, p.p_size
    expect:
      columns: [p_brand, p_type, p_size, supplier_cnt]
      rows:
        - ["Brand#35", "SMALL POLISHED COPPER", 14, 2]
        - ["Brand#14", "PROMO BRUSHED STEEL", 9, 1]
        - ["Brand#22", "LARGE BURNISHED TIN", 36, 1]

  - id: "runtime_tpch_kernels.140.q16_ordered_distinct_supplier_count"
    status: supported
    kind: query
    capabilities: [tpch-q16, grouped-join, count-distinct, anti-membership, multi-key-order]
    sql: |-
      select p.p_brand, p.p_type, p.p_size, count(distinct ps.ps_suppkey) as supplier_cnt
      from part_qa as p
      inner join partsupp_qa as ps on ps.ps_partkey = p.p_partkey
      where p.p_brand <> 'Brand#45'
        and p.p_type not like 'MEDIUM POLISHED%'
        and p.p_size in (49, 14, 23, 45, 19, 3, 36, 9)
        and ps.ps_suppkey not in (
          select s_suppkey
          from supplier_qa
          where s_comment like '%Customer%Complaints%'
        )
      group by p.p_brand, p.p_type, p.p_size
      order by supplier_cnt desc, p.p_brand, p.p_type, p.p_size
      limit 3
    expect:
      columns: [p_brand, p_type, p_size, supplier_cnt]
      rows:
        - ["Brand#35", "SMALL POLISHED COPPER", 14, 2]
        - ["Brand#14", "PROMO BRUSHED STEEL", 9, 1]
        - ["Brand#22", "LARGE BURNISHED TIN", 36, 1]

  - id: "runtime_tpch_kernels.150.q11_grouped_value_topn"
    status: supported
    kind: query
    capabilities: [tpch-q11, grouped-aggregate, having, order-by-aggregate, limit]
    sql: |-
      select ps.ps_partkey,
             sum(ps.ps_supplycost * ps.ps_availqty) as part_value
      from partsupp_qa as ps
      group by ps.ps_partkey
      having part_value > 1200
      order by part_value desc
      limit 2
    expect:
      columns: [ps_partkey, part_value]
      rows:
        - ["P1", 2050.0]
        - ["P2", 2000.0]

