version: 1
name: mysql_compat_temp_tables

tests:
  - id: mysql_compat_temp_tables.001.drop_stale_temp_table
    status: supported
    kind: statement
    feature: temp_tables_ddl
    compatibility: mysql
    requires: [drop_table, temporary_table]
    sql: |
      drop temporary table if exists qs_mysql_compat_tmp_customer_keys

  - id: mysql_compat_temp_tables.002.drop_stale_ctas_temp_table
    status: supported
    kind: statement
    feature: temp_tables_ddl
    compatibility: mysql
    requires: [drop_table, temporary_table]
    sql: |
      drop temporary table if exists qs_mysql_compat_tmp_regions

  - id: mysql_compat_temp_tables.003.drop_stale_ctas_aggregate_temp_table
    status: supported
    kind: statement
    feature: temp_tables_ddl
    compatibility: mysql
    requires: [drop_table, temporary_table]
    sql: |
      drop temporary table if exists qs_mysql_compat_tmp_nation_counts

  - id: mysql_compat_temp_tables.004.drop_stale_ctas_metadata_temp_table
    status: supported
    kind: statement
    feature: temp_tables_ddl
    compatibility: mysql
    requires: [drop_table, temporary_table]
    sql: |
      drop temporary table if exists qs_mysql_compat_tmp_region_keys

  - id: mysql_compat_temp_tables.010.create_temp_table_metadata
    status: supported
    kind: statement
    feature: temp_tables_ddl
    compatibility: mysql
    requires: [create_table, temporary_table, primary_key]
    sql: |
      create temporary table qs_mysql_compat_tmp_customer_keys (
        customer_key int not null,
        market_segment varchar(16),
        created_at datetime,
        primary key (customer_key)
      )

  - id: mysql_compat_temp_tables.011.show_columns_temp_table
    status: supported
    kind: query
    order: exact
    feature: temp_tables_metadata
    compatibility: mysql
    requires: [show_columns, temporary_table, primary_key]
    sql: |
      show columns from qs_mysql_compat_tmp_customer_keys
    expect:
      columns: [Field, Type, "Null", Key, Default, Extra]
      rows:
        - [customer_key, int, "NO", PRI, null, "NULL"]
        - [market_segment, "varchar(16)", "YES", "", null, "NULL"]
        - [created_at, datetime, "YES", "", null, "NULL"]

  - id: mysql_compat_temp_tables.012.insert_temp_table_rows
    status: supported
    kind: statement
    feature: temp_tables_dml
    compatibility: mysql
    requires: [insert, temporary_table]
    sql: |
      insert into qs_mysql_compat_tmp_customer_keys (customer_key, market_segment, created_at)
      values (2, 'BUILDING', null), (1, 'AUTOMOBILE', null)

  - id: mysql_compat_temp_tables.013.select_temp_table_rows
    status: supported
    kind: query
    order: exact
    feature: temp_tables_dml
    compatibility: mysql
    requires: [select, temporary_table, predicates, order_by, limit]
    sql: |
      select customer_key, market_segment
      from qs_mysql_compat_tmp_customer_keys
      where customer_key in (1, 2)
      order by customer_key
      limit 2
    expect:
      columns: [customer_key, market_segment]
      rows:
        - [1, AUTOMOBILE]
        - [2, BUILDING]

  - id: mysql_compat_temp_tables.014.create_temp_table_if_not_exists_is_noop
    status: supported
    kind: statement
    feature: temp_tables_lifecycle
    compatibility: mysql
    requires: [create_table, temporary_table, if_not_exists]
    sql: |
      create temporary table if not exists qs_mysql_compat_tmp_customer_keys (
        customer_key int not null,
        primary key (customer_key)
      )

  - id: mysql_compat_temp_tables.020.drop_temp_table
    status: supported
    kind: statement
    feature: temp_tables_ddl
    compatibility: mysql
    requires: [drop_table, temporary_table]
    sql: |
      drop temporary table qs_mysql_compat_tmp_customer_keys

  - id: mysql_compat_temp_tables.021.drop_missing_temp_table_if_exists
    status: supported
    kind: statement
    feature: temp_tables_lifecycle
    compatibility: mysql
    requires: [drop_table, temporary_table, if_exists]
    sql: |
      drop temporary table if exists qs_mysql_compat_tmp_customer_keys

  - id: mysql_compat_temp_tables.030.create_temp_table_as_select_tpch_region
    status: supported
    kind: statement
    feature: temp_tables_ctas
    compatibility: mysql
    requires: [create_table, temporary_table, select, order_by]
    sql: |
      create temporary table qs_mysql_compat_tmp_regions as
      select r_regionkey as region_key, r_name as region_name
      from region
      where r_regionkey in (0, 1, 2)
      order by r_regionkey

  - id: mysql_compat_temp_tables.031.select_temp_table_as_select_rows
    status: supported
    kind: query
    order: exact
    feature: temp_tables_ctas
    compatibility: mysql
    requires: [select, temporary_table, predicates, order_by, limit]
    sql: |
      select region_key, region_name
      from qs_mysql_compat_tmp_regions
      where region_key >= 0
      order by region_key
      limit 3
    expect:
      columns: [region_key, region_name]
      rows:
        - [0, AFRICA]
        - [1, AMERICA]
        - [2, ASIA]

  - id: mysql_compat_temp_tables.032.create_temp_table_as_select_if_not_exists_is_noop
    status: supported
    kind: statement
    feature: temp_tables_ctas_lifecycle
    compatibility: mysql
    requires: [create_table, temporary_table, if_not_exists, select]
    sql: |
      create temporary table if not exists qs_mysql_compat_tmp_regions as
      select 99 as region_key, 'SHOULD_NOT_INSERT' as region_name

  - id: mysql_compat_temp_tables.033.select_temp_table_as_select_noop_rows
    status: supported
    kind: query
    order: exact
    feature: temp_tables_ctas_lifecycle
    compatibility: mysql
    requires: [select, temporary_table, predicates, order_by, limit]
    sql: |
      select region_key, region_name
      from qs_mysql_compat_tmp_regions
      where region_key >= 0
      order by region_key
      limit 3
    expect:
      columns: [region_key, region_name]
      rows:
        - [0, AFRICA]
        - [1, AMERICA]
        - [2, ASIA]

  - id: mysql_compat_temp_tables.034.drop_ctas_temp_table
    status: supported
    kind: statement
    feature: temp_tables_ddl
    compatibility: mysql
    requires: [drop_table, temporary_table]
    sql: |
      drop temporary table qs_mysql_compat_tmp_regions

  - id: mysql_compat_temp_tables.035.create_temp_table_as_select_region_key_metadata
    status: supported
    kind: statement
    feature: temp_tables_ctas_metadata
    compatibility: mysql
    requires: [create_table, temporary_table, select, order_by]
    sql: |
      create temporary table qs_mysql_compat_tmp_region_keys as
      select r_regionkey as region_key
      from region
      where r_regionkey in (0, 1, 2)
      order by r_regionkey

  - id: mysql_compat_temp_tables.036.show_columns_temp_table_as_select_region_key
    status: supported
    kind: query
    order: exact
    feature: temp_tables_ctas_metadata
    compatibility: mysql
    requires: [show_columns, temporary_table]
    sql: |
      show columns from qs_mysql_compat_tmp_region_keys
    expect:
      columns: [Field, Type, "Null", Key, Default, Extra]
      rows:
        - [region_key, int, "NO", "", null, "NULL"]

  - id: mysql_compat_temp_tables.037.drop_ctas_metadata_temp_table
    status: supported
    kind: statement
    feature: temp_tables_ddl
    compatibility: mysql
    requires: [drop_table, temporary_table]
    sql: |
      drop temporary table qs_mysql_compat_tmp_region_keys

  - id: mysql_compat_temp_tables.040.create_temp_table_as_select_grouped_tpch_nations
    status: supported
    kind: statement
    feature: temp_tables_ctas_aggregate_source
    compatibility: mysql
    requires: [create_table, temporary_table, select, aggregate, group_by, order_by]
    sql: |
      create temporary table qs_mysql_compat_tmp_nation_counts as
      select n_regionkey as region_key, count(*) as nation_count
      from nation
      where n_regionkey in (0, 1, 2)
      group by n_regionkey
      order by n_regionkey

  - id: mysql_compat_temp_tables.041.select_temp_table_as_select_grouped_rows
    status: supported
    kind: query
    order: exact
    feature: temp_tables_ctas_aggregate_source
    compatibility: mysql
    requires: [select, temporary_table, predicates, order_by, limit]
    sql: |
      select region_key, nation_count
      from qs_mysql_compat_tmp_nation_counts
      where region_key >= 0
      order by region_key
      limit 3
    expect:
      columns: [region_key, nation_count]
      rows:
        - [0, 5]
        - [1, 5]
        - [2, 5]

  - id: mysql_compat_temp_tables.042.drop_ctas_aggregate_temp_table
    status: supported
    kind: statement
    feature: temp_tables_ddl
    compatibility: mysql
    requires: [drop_table, temporary_table]
    sql: |
      drop temporary table qs_mysql_compat_tmp_nation_counts
