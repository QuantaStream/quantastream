version: 1
name: "runtime_membership"

tests:
  - id: "runtime_membership.001.drop_orders"
    status: supported
    kind: admin
    sql: drop orders_qa

  - id: "runtime_membership.002.drop_customers"
    status: supported
    kind: admin
    sql: drop customers_qa

  - id: "runtime_membership.003.create_customers"
    status: supported
    kind: admin
    sql: create customers_qa

  - id: "runtime_membership.004.create_orders"
    status: supported
    kind: admin
    sql: create orders_qa

  - id: "runtime_membership.010.insert_customer_abe"
    status: supported
    kind: statement
    sql: insert into customers_qa (cust_id, first_name, city, age) values ('1', 'Abe', 'Seattle', 30)

  - id: "runtime_membership.011.insert_customer_abby"
    status: supported
    kind: statement
    sql: insert into customers_qa (cust_id, first_name, city, age) values ('2', 'Abby', 'Tacoma', 40)

  - id: "runtime_membership.012.insert_customer_annie"
    status: supported
    kind: statement
    sql: insert into customers_qa (cust_id, first_name, city, age) values ('3', 'Annie', 'Everett', 50)

  - id: "runtime_membership.013.commit_customers"
    status: supported
    kind: statement
    sql: commit

  - id: "runtime_membership.020.insert_order_abe"
    status: supported
    kind: statement
    sql: insert into orders_qa (cust_id, order_id, order_date, ship_via) values ('1', '1001', '2023-06-01T01:00:00', 'UPS')

  - id: "runtime_membership.021.insert_order_abby"
    status: supported
    kind: statement
    sql: insert into orders_qa (cust_id, order_id, order_date, ship_via) values ('2', '1002', '2023-06-01T02:00:00', 'FEDEX')

  - id: "runtime_membership.022.commit_orders"
    status: supported
    kind: statement
    sql: commit

  - id: "runtime_membership.030.semi_membership_projection"
    status: supported
    kind: query
    order: rowsort
    capabilities: [subquery, in, semi-join-rewrite, projection]
    sql: |-
      select c.first_name, c.cust_id
      from customers_qa as c
      where c.cust_id in (select cust_id from orders_qa)
    expect:
      columns: [first_name, cust_id]
      rows:
        - ["Abby", "2"]
        - ["Abe", "1"]

  - id: "runtime_membership.031.anti_membership_projection"
    status: supported
    kind: query
    order: rowsort
    capabilities: [subquery, not-in, anti-join-rewrite, projection]
    sql: |-
      select c.first_name, c.cust_id
      from customers_qa as c
      where c.cust_id not in (select cust_id from orders_qa)
    expect:
      columns: [first_name, cust_id]
      rows:
        - ["Annie", "3"]

  - id: "runtime_membership.032.anti_membership_count"
    status: supported
    kind: query
    capabilities: [subquery, not-in, anti-join-rewrite, count]
    sql: |-
      select count(*)
      from customers_qa as c
      where c.cust_id not in (select cust_id from orders_qa)
    expect:
      rows:
        - [1]

  - id: "runtime_membership.033.filtered_semi_membership_projection"
    status: supported
    kind: query
    order: rowsort
    capabilities: [subquery, in, semi-join-rewrite, subquery-filter, projection]
    sql: |-
      select c.first_name, c.cust_id
      from customers_qa as c
      where c.cust_id in (select cust_id from orders_qa where ship_via = 'UPS')
    expect:
      columns: [first_name, cust_id]
      rows:
        - ["Abe", "1"]

  - id: "runtime_membership.034.filtered_anti_membership_projection"
    status: supported
    kind: query
    order: rowsort
    capabilities: [subquery, not-in, anti-join-rewrite, subquery-filter, projection]
    sql: |-
      select c.first_name, c.cust_id
      from customers_qa as c
      where c.cust_id not in (select cust_id from orders_qa where ship_via = 'UPS')
    expect:
      columns: [first_name, cust_id]
      rows:
        - ["Abby", "2"]
        - ["Annie", "3"]
