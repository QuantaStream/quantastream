version: 1
name: mysql_compat_group_order_boundaries

tests:
  - id: mysql_compat_group_order_boundaries.001.derived_table_group_count
    status: xfail
    kind: query
    order: exact
    feature: group_by_derived_table_boundary
    compatibility: mysql
    requires: [select, derived_table, group_by, count, order_by]
    issue: "Derived table sources are not accepted by the current simple parser."
    sql: |
      select city, count(*) as customer_count
      from (
        select 'Seattle' as city
        union all select 'Seattle'
        union all select 'Tacoma'
      ) as customers
      group by city
      order by city
    expect:
      columns: [city, customer_count]
      rows:
        - [Seattle, 2]
        - [Tacoma, 1]

  - id: mysql_compat_group_order_boundaries.002.derived_table_having_sum
    status: xfail
    kind: query
    order: exact
    feature: group_by_derived_table_boundary
    compatibility: mysql
    requires: [select, derived_table, group_by, having, sum, order_by]
    issue: "Derived table sources are not accepted by the current simple parser."
    sql: |
      select region, sum(amount) as total_amount
      from (
        select 'north' as region, 10 as amount
        union all select 'north', 7
        union all select 'south', 3
      ) as sales
      group by region
      having sum(amount) > 10
      order by total_amount desc
    expect:
      columns: [region, total_amount]
      rows:
        - [north, 17]

  - id: mysql_compat_group_order_boundaries.003.derived_table_order_limit_offset
    status: xfail
    kind: query
    order: exact
    feature: select_order_limit_derived_table_boundary
    compatibility: mysql
    requires: [select, derived_table, order_by, limit, offset]
    issue: "Derived table sources are not accepted by the current simple parser."
    sql: |
      select n
      from (
        select 3 as n
        union all select 1
        union all select 2
      ) as numbers
      order by n
      limit 1 offset 1
    expect:
      columns: [n]
      rows:
        - [2]

  - id: mysql_compat_group_order_boundaries.004.derived_table_order_by_alias_desc
    status: xfail
    kind: query
    order: exact
    feature: select_order_limit_derived_table_boundary
    compatibility: mysql
    requires: [select, derived_table, aliases, expression_projection, order_by]
    issue: "Derived table sources are not accepted by the current simple parser."
    sql: |
      select label, score * 2 as doubled_score
      from (
        select 'a' as label, 4 as score
        union all select 'b', 7
      ) as scored
      order by doubled_score desc
    expect:
      columns: [label, doubled_score]
      rows:
        - [b, 14]
        - [a, 8]

  - id: mysql_compat_group_order_boundaries.005.group_by_ordinal_position
    status: supported
    kind: query
    order: exact
    feature: group_by_ordinal_boundary
    compatibility: mysql
    requires: [select, table_scan, group_by, count, order_by]
    sql: |
      select n_regionkey as region_key, count(*) as nation_count
      from nation
      group by 1
      order by 1
    expect:
      columns: [region_key, nation_count]
      rows:
        - [0, 5]
        - [1, 5]
        - [2, 5]
        - [3, 5]
        - [4, 5]

  - id: mysql_compat_group_order_boundaries.006.order_by_expression_not_projected
    status: xfail
    kind: query
    order: exact
    feature: order_by_expression_boundary
    compatibility: mysql
    requires: [select, table_scan, expression_projection, order_by, limit]
    issue: "ORDER BY expressions are only resolved when they are projected or simple aggregate references."
    sql: |
      select n_name as nation_name
      from nation
      order by n_nationkey + 1 desc
      limit 3
    expect:
      columns: [nation_name]
      rows:
        - [UNITED STATES]
        - [UNITED KINGDOM]
        - [RUSSIA]

  - id: mysql_compat_group_order_boundaries.007.compound_having_predicate
    status: xfail
    kind: query
    order: exact
    feature: group_by_having_boundary
    compatibility: mysql
    requires: [select, table_scan, group_by, having, count, order_by]
    issue: "HAVING currently supports one aggregate comparison, not compound boolean expressions."
    sql: |
      select c_mktsegment as market_segment, count(*) as customer_count
      from customer
      group by c_mktsegment
      having count(*) > 280 and count(*) < 320
      order by market_segment
    expect:
      columns: [market_segment, customer_count]
      rows:
        - [AUTOMOBILE, 302]
        - [HOUSEHOLD, 294]
        - [MACHINERY, 288]

  - id: mysql_compat_group_order_boundaries.008.having_aggregate_arithmetic
    status: xfail
    kind: query
    order: exact
    feature: group_by_having_boundary
    compatibility: mysql
    requires: [select, table_scan, group_by, having, sum, count, arithmetic, order_by]
    issue: "HAVING aggregate arithmetic is not lowered to aggregate refs yet."
    sql: |
      select n_regionkey as region_key, sum(n_nationkey) as nation_key_sum
      from nation
      group by n_regionkey
      having sum(n_nationkey) / count(*) > 10
      order by region_key
    expect:
      columns: [region_key, nation_key_sum]
      rows:
        - [2, 68]
        - [3, 77]
        - [4, 58]

  - id: mysql_compat_group_order_boundaries.020.group_by_limit_zero
    status: supported
    kind: query
    order: exact
    feature: group_by_order_limit_boundary
    compatibility: mysql
    requires: [select, table_scan, group_by, count, order_by, limit]
    sql: |
      select c_mktsegment as market_segment, count(*) as customer_count
      from customer
      group by c_mktsegment
      order by market_segment
      limit 0
    expect:
      columns: [market_segment, customer_count]
      row_count: 0

  - id: mysql_compat_group_order_boundaries.021.group_by_offset_beyond_result
    status: supported
    kind: query
    order: exact
    feature: group_by_order_limit_boundary
    compatibility: mysql
    requires: [select, table_scan, group_by, count, order_by, limit, offset]
    sql: |
      select c_mktsegment as market_segment, count(*) as customer_count
      from customer
      group by c_mktsegment
      order by market_segment
      limit 2 offset 99
    expect:
      columns: [market_segment, customer_count]
      row_count: 0

  - id: mysql_compat_group_order_boundaries.022.group_by_limit_offset_zero
    status: supported
    kind: query
    order: exact
    feature: group_by_order_limit_boundary
    compatibility: mysql
    requires: [select, table_scan, group_by, count, order_by, limit, offset]
    sql: |
      select c_mktsegment as market_segment, count(*) as customer_count
      from customer
      group by c_mktsegment
      order by market_segment
      limit 2 offset 0
    expect:
      columns: [market_segment, customer_count]
      row_count: 2

  - id: mysql_compat_group_order_boundaries.023.group_by_comma_limit_offset
    status: supported
    kind: query
    order: exact
    feature: group_by_order_limit_boundary
    compatibility: mysql
    requires: [select, table_scan, group_by, count, order_by, limit, offset]
    sql: |
      select c_mktsegment as market_segment, count(*) as customer_count
      from customer
      group by c_mktsegment
      order by market_segment
      limit 1, 2
    expect:
      columns: [market_segment, customer_count]
      row_count: 2

  - id: mysql_compat_group_order_boundaries.024.group_by_alias_limit_offset
    status: supported
    kind: query
    order: exact
    feature: group_by_alias_order_limit_boundary
    compatibility: mysql
    requires: [select, table_scan, aliases, group_by, count, order_by, limit, offset]
    sql: |
      select c_mktsegment as market_segment, count(*) as customer_count
      from customer
      group by market_segment
      order by market_segment
      limit 2 offset 1
    expect:
      columns: [market_segment, customer_count]
      row_count: 2
