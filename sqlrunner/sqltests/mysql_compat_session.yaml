version: 1
name: mysql_compat_session

tests:
  - id: mysql_compat_session.001.set_names
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set_names, session_variables]
    sql: |
      set names utf8mb4

  - id: mysql_compat_session.00101.set_names_collate
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set_names, session_variables, collations]
    sql: |
      set names utf8mb4 collate utf8mb4_0900_ai_ci

  - id: mysql_compat_session.0011.set_character_set
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set_character_set, session_variables]
    sql: |
      set character set utf8mb4

  - id: mysql_compat_session.0012.set_character_set_default
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set_character_set, session_variables]
    sql: |
      set character set default

  - id: mysql_compat_session.0013.set_character_set_results_null
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, session_variables]
    sql: |
      set character_set_results = NULL

  - id: mysql_compat_session.002.set_autocommit
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, autocommit]
    sql: |
      set autocommit = 1

  - id: mysql_compat_session.0021.set_autocommit_on
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, autocommit]
    sql: |
      set autocommit = ON

  - id: mysql_compat_session.003.set_sql_mode
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, sql_mode]
    sql: |
      set sql_mode = 'ANSI_QUOTES'

  - id: mysql_compat_session.004.set_time_zone
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, time_zone]
    sql: |
      set time_zone = '+00:00'

  - id: mysql_compat_session.005.set_session_scoped_sql_mode
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, sql_mode, session_scope]
    sql: |
      set session sql_mode = 'ANSI_QUOTES'

  - id: mysql_compat_session.006.set_session_variable_sigiled_sql_mode
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, sql_mode, session_scope]
    sql: |
      set @@session.sql_mode = 'NO_ENGINE_SUBSTITUTION'

  - id: mysql_compat_session.0061.set_mixed_scoped_assignments
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, session_scope]
    sql: |
      set character_set_results = NULL, session sql_mode = 'ANSI_QUOTES', session sql_select_limit = DEFAULT

  - id: mysql_compat_session.010.select_system_variables
    status: supported
    kind: query
    feature: session_variables
    compatibility: mysql
    requires: [select, system_variables]
    sql: |
      select @@autocommit as autocommit_value,
             @@sql_mode as sql_mode_value,
             @@time_zone as time_zone_value
    expect:
      columns: [autocommit_value, sql_mode_value, time_zone_value]

  - id: mysql_compat_session.0101.select_version_variables
    status: supported
    kind: query
    feature: session_variables
    compatibility: mysql
    requires: [select, system_variables, version]
    sql: |
      select @@version as version_value,
             @@version_comment as version_comment
    expect:
      columns: [version_value, version_comment]

  - id: mysql_compat_session.0102.select_connection_metadata_functions
    status: supported
    kind: query
    feature: session_metadata
    compatibility: mysql
    requires: [select, database, schema, user, current_user, connection_id]
    sql: |
      select database() as db_name,
             schema() as schema_name,
             user() as user_value,
             current_user() as current_user_value,
             connection_id() as connection_id_value
    expect:
      columns: [db_name, schema_name, user_value, current_user_value, connection_id_value]

  - id: mysql_compat_session.011.show_autocommit_variable
    status: supported
    kind: query
    feature: session_variables
    compatibility: mysql
    requires: [show_variables, autocommit]
    sql: |
      show variables like 'autocommit'
    expect:
      columns: [variable_name, value]

  - id: mysql_compat_session.020.set_transaction_read_only
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [set_transaction]
    sql: |
      set transaction read only

  - id: mysql_compat_session.0201.set_session_transaction_isolation
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [set_transaction, session_scope]
    sql: |
      set session transaction isolation level repeatable read

  - id: mysql_compat_session.021.start_transaction
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [start_transaction]
    sql: |
      start transaction

  - id: mysql_compat_session.022.commit_transaction
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [commit]
    sql: |
      commit

  - id: mysql_compat_session.023.begin_transaction
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [begin]
    sql: |
      begin

  - id: mysql_compat_session.024.rollback_transaction
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [rollback]
    sql: |
      rollback
