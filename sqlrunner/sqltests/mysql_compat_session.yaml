version: 1
name: mysql_compat_session

tests:
  - id: mysql_compat_session.001.set_names
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set_names, session_variables]
    sql: |
      set names utf8mb4

  - id: mysql_compat_session.002.set_autocommit
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, autocommit]
    sql: |
      set autocommit = 1

  - id: mysql_compat_session.003.set_sql_mode
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, sql_mode]
    sql: |
      set sql_mode = 'ANSI_QUOTES'

  - id: mysql_compat_session.004.set_time_zone
    status: supported
    kind: statement
    feature: session_variables
    compatibility: mysql
    requires: [set, time_zone]
    sql: |
      set time_zone = '+00:00'

  - id: mysql_compat_session.010.select_system_variables
    status: supported
    kind: query
    feature: session_variables
    compatibility: mysql
    requires: [select, system_variables]
    sql: |
      select @@autocommit as autocommit_value,
             @@sql_mode as sql_mode_value,
             @@time_zone as time_zone_value
    expect:
      columns: [autocommit_value, sql_mode_value, time_zone_value]

  - id: mysql_compat_session.011.show_autocommit_variable
    status: supported
    kind: query
    feature: session_variables
    compatibility: mysql
    requires: [show_variables, autocommit]
    sql: |
      show variables like 'autocommit'
    expect:
      columns: [variable_name, value]

  - id: mysql_compat_session.020.set_transaction_read_only
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [set_transaction]
    sql: |
      set transaction read only

  - id: mysql_compat_session.021.start_transaction
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [start_transaction]
    sql: |
      start transaction

  - id: mysql_compat_session.022.commit_transaction
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [commit]
    sql: |
      commit

  - id: mysql_compat_session.023.begin_transaction
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [begin]
    sql: |
      begin

  - id: mysql_compat_session.024.rollback_transaction
    status: supported
    kind: statement
    feature: transactions
    compatibility: mysql
    requires: [rollback]
    sql: |
      rollback
