    capabilities: [inabox-direct, tpch-q14, relationship-vector-join, time-range, prefix-like, searched-case, conditional-aggregate, aggregate-ratio]
    # Verifies final scalar projection over hidden aggregate numerator and
    # denominator inputs for formal Q14.
    sql: |-
      select
        100.00 * sum(case
          when p.p_type like 'PROMO%'
          then l.l_extendedprice * (1 - l.l_discount)
          else 0
        end) / sum(l.l_extendedprice * (1 - l.l_discount)) as promo_revenue
      from lineitem as l
      inner join part as p on p.p_partkey = l.l_partkey
      where l.l_shipdate >= '1995-09-01'
        and l.l_shipdate < '1995-10-01'
    expect:
      columns: [promo_revenue]
      rows:
        - ["15.486545812284083"]

