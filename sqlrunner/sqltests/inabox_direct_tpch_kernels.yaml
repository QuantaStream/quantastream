  - id: inabox_direct_tpch_kernels.004h.q5_region_nation_customer_orders_lineitem_chain_count
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q5, relationship-vector-chain, fact-table, count, full-child-scan]
    # This proves the customer/orders side can flow into lineitem. The final
