  - id: inabox_direct_tpch_kernels.004c.q5_supplier_lineitem_count
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q5, relationship-vector-join, fact-table, count, full-child-scan]
    # This proves the supplier -> lineitem fact-side vector shape. It is
    # intentionally preserved even though the current runtime scans the full
    # time-sharded lineitem child side when there is no local child predicate.
    sql: |-
      select count(*) as supplier_line_count
      from supplier as s
      inner join lineitem as l on l.l_suppkey = s.s_suppkey
      where s.s_nationkey = 12
    expect:
      columns: [supplier_line_count]
      rows:
        - [2447]

  - id: inabox_direct_tpch_kernels.004d.q5_region_nation_supplier_chain_count
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q5, relationship-vector-chain, dimension, count]
    sql: |-
      select count(*) as asia_supplier_count
