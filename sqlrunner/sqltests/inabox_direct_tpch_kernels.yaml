  - id: inabox_direct_tpch_kernels.009a.q12_orders_lineitem_priority_case_counts
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q12, relationship-vector-join, string-filter, scalar-in, time-range, grouped-aggregate, searched-case, conditional-aggregate]
    # This staged kernel uses IN/NOT IN inside searched CASE to avoid the known
    # parser corner around OR/AND inside aggregate CASE predicates.
    sql: |-
      select l.l_shipmode,
             sum(case
                   when o.o_orderpriority in ('1-URGENT', '2-HIGH')
                   then 1 else 0 end) as high_line_count,
             sum(case
                   when o.o_orderpriority not in ('1-URGENT', '2-HIGH')
                   then 1 else 0 end) as low_line_count
      from orders as o
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      where l.l_shipmode in ('MAIL', 'SHIP')
        and l.l_receiptdate >= '1994-01-01'
        and l.l_receiptdate < '1995-01-01'
      group by l.l_shipmode
      order by l.l_shipmode
    expect:
      columns: [l_shipmode, high_line_count, low_line_count]
      rows:
        - [MAIL, 547, 813]
        - [SHIP, 559, 845]

