  - id: inabox_direct_tpch_kernels.004i.q5_supplier_customer_converging_graph_count
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q5, relationship-vector-graph, fact-table, count]
    # This proves graph reduction can handle a supplier existence edge
    # converging on the customer/orders/lineitem chain.
    sql: |-
      select count(*) as q5_graph_count
      from region as r
      inner join nation as n on n.n_regionkey = r.r_regionkey
      inner join customer as c on c.c_nationkey = n.n_nationkey
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      where r.r_name = 'ASIA'
    expect:
      columns: [q5_graph_count]
      rows:
        - [11708]

  - id: inabox_direct_tpch_kernels.004j.q5_converging_graph_revenue_projection
    status: supported
    kind: query
    timeout: 60s
    capabilities: [inabox-direct, tpch-q5, relationship-vector-graph, fact-table, projection, limit]
    # This is the first graph projection phase. It intentionally materializes
    # sink-table lineitem revenue inputs only; ancestor-field projection needs
    # full joined-tuple reconstruction across the graph.
    sql: |-
      select l.l_extendedprice, l.l_discount
      from region as r
      inner join nation as n on n.n_regionkey = r.r_regionkey
      inner join customer as c on c.c_nationkey = n.n_nationkey
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      where r.r_name = 'ASIA'
      limit 3
    expect:
      columns: [l_extendedprice, l_discount]
      rows:
        - [8784.63, 0.03]
        - [22191.8, 0.07]
        - [33110.5, 0.04]

  - id: inabox_direct_tpch_kernels.004k.q5_converging_graph_total_revenue
    status: supported
    kind: query
    timeout: 60s
    capabilities: [inabox-direct, tpch-q5, relationship-vector-graph, fact-table, arithmetic-aggregate]
    # Ungrouped graph aggregate over sink-table lineitem revenue inputs. This
    # proves graph aggregate input materialization before grouped nation revenue.
    sql: |-
      select sum(l.l_extendedprice * (1 - l.l_discount)) as total_revenue
      from region as r
      inner join nation as n on n.n_regionkey = r.r_regionkey
      inner join customer as c on c.c_nationkey = n.n_nationkey
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      where r.r_name = 'ASIA'
    expect:
      columns: [total_revenue]
      rows:
        - [3.97022970406798e+08]

  - id: inabox_direct_tpch_kernels.004l.q5_converging_graph_grouped_revenue
    status: supported
    kind: query
    timeout: 60s
    capabilities: [inabox-direct, tpch-q5, relationship-vector-graph, fact-table, grouped-aggregate]
    # Grouped graph aggregate over an ancestor nation key and sink-table
    # lineitem revenue inputs. This still does not enforce the formal Q5
    # same-nation supplier/customer predicate.
    sql: |-
      select n.n_name,
             sum(l.l_extendedprice * (1 - l.l_discount)) as total_revenue
      from region as r
      inner join nation as n on n.n_regionkey = r.r_regionkey
      inner join customer as c on c.c_nationkey = n.n_nationkey
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      where r.r_name = 'ASIA'
      group by n.n_name
      order by total_revenue desc
      limit 5
    expect:
      columns: [n_name, total_revenue]
      rows:
        - ["INDONESIA", 8.888988295860012e+07]
        - ["JAPAN", 8.833366716640009e+07]
        - ["VIETNAM", 8.4569834052e+07]
        - ["INDIA", 7.257359374429998e+07]
        - ["CHINA", 6.265599248549995e+07]

  - id: inabox_direct_tpch_kernels.004m.q5_same_nation_grouped_revenue
    status: supported
    kind: query
    timeout: 60s
    capabilities: [inabox-direct, tpch-q5, relationship-vector-graph, fact-table, residual-join, grouped-aggregate]
    # Same-nation supplier/customer residual equality over the converged graph.
    # This is one rung short of formal Q5 because it does not include the
    # orders.o_orderdate [1994-01-01, 1995-01-01) window yet.
    sql: |-
      select n.n_name,
             sum(l.l_extendedprice * (1 - l.l_discount)) as total_revenue
      from region as r
      inner join nation as n on n.n_regionkey = r.r_regionkey
      inner join customer as c on c.c_nationkey = n.n_nationkey
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      where r.r_name = 'ASIA'
        and s.s_nationkey = c.c_nationkey
      group by n.n_name
      order by total_revenue desc
      limit 5
    expect:
      columns: [n_name, total_revenue]
      rows:
        - ["VIETNAM", 5.8950565009e+06]
        - ["CHINA", 4.955977471600002e+06]
        - ["INDONESIA", 4.508005852000003e+06]
        - ["JAPAN", 3.955963255900001e+06]
        - ["INDIA", 3.069194983500001e+06]

  - id: inabox_direct_tpch_kernels.004n.q5_orderdate_same_nation_grouped_revenue
    status: supported
    kind: query
    timeout: 60s
    capabilities: [inabox-direct, tpch-q5, relationship-vector-graph, time-range, residual-join, grouped-aggregate]
    # Formal-shaped Q5 kernel: ASIA region, 1994 order date window,
    # same-nation supplier/customer residual equality, and grouped discounted
    # revenue. The simple parser expresses the same-nation predicate in WHERE.
    # The orders date window constrains the parent shard scope; the final
    # lineitem vector/value reads must use the foundset rather than treating the
    # parent date as a child physical shard window.
    sql: |-
      select n.n_name,
             sum(l.l_extendedprice * (1 - l.l_discount)) as total_revenue
      from region as r
      inner join nation as n on n.n_regionkey = r.r_regionkey
      inner join customer as c on c.c_nationkey = n.n_nationkey
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      where r.r_name = 'ASIA'
        and o.o_orderdate >= '1994-01-01'
        and o.o_orderdate < '1995-01-01'
        and s.s_nationkey = c.c_nationkey
      group by n.n_name
      order by total_revenue desc
      limit 5
    expect:
      columns: [n_name, total_revenue]
      rows:
        - ["VIETNAM", 1000926.6998999998]
        - ["CHINA", 740210.7569999999]
        - ["JAPAN", 660651.2424999999]
        - ["INDONESIA", 566379.5275999999]
        - ["INDIA", 422874.6844]

  - id: inabox_direct_tpch_kernels.004o.q5_orderdate_same_nation_join_on_grouped_revenue
    status: supported
    kind: query
    timeout: 60s
    capabilities: [inabox-direct, tpch-q5, relationship-vector-graph, time-range, residual-join, grouped-aggregate, join-on-residual]
    # Same kernel as .004n, but with the same-nation supplier/customer
    # residual equality expressed canonically as an additional JOIN ON
    # conjunct.
    sql: |-
      select n.n_name,
             sum(l.l_extendedprice * (1 - l.l_discount)) as total_revenue
      from region as r
      inner join nation as n on n.n_regionkey = r.r_regionkey
      inner join customer as c on c.c_nationkey = n.n_nationkey
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
                              and s.s_nationkey = c.c_nationkey
      where r.r_name = 'ASIA'
        and o.o_orderdate >= '1994-01-01'
        and o.o_orderdate < '1995-01-01'
      group by n.n_name
      order by total_revenue desc
      limit 5
    expect:
      columns: [n_name, total_revenue]
      rows:
        - ["VIETNAM", 1000926.6998999998]
        - ["CHINA", 740210.7569999999]
        - ["JAPAN", 660651.2424999999]
        - ["INDONESIA", 566379.5275999999]
        - ["INDIA", 422874.6844]

  - id: inabox_direct_tpch_kernels.004o1.q6_discounted_revenue
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q6, single-table, time-range, numeric-range, arithmetic-aggregate]
    sql: |-
      select sum(l.l_extendedprice * l.l_discount) as revenue
      from lineitem as l
      where l.l_shipdate >= '1994-01-01'
        and l.l_shipdate < '1995-01-01'
        and l.l_discount >= 0.05
        and l.l_discount <= 0.07
        and l.l_quantity < 24
    expect:
      columns: [revenue]
      rows:
        - ["1.193053225300001e+06"]

  - id: inabox_direct_tpch_kernels.004p.q7_repeated_nation_alias_count
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q7, repeated-alias, relationship-vector-graph, count]
    # Repeated nation roles are independent, and the shipdate predicate targets
    # lineitem's shard key, so the child foundset can drive broad relationship
    # vector reads without losing the FK BSI.
    sql: |-
      select count(*) as q7_france_germany_line_count
      from supplier as s
      inner join lineitem as l on l.l_suppkey = s.s_suppkey
      inner join orders as o on o.o_orderkey = l.l_orderkey
      inner join customer as c on c.c_custkey = o.o_custkey
      inner join nation as n1 on n1.n_nationkey = s.s_nationkey
      inner join nation as n2 on n2.n_nationkey = c.c_nationkey
      where n1.n_name = 'FRANCE'
        and n2.n_name = 'GERMANY'
        and l.l_shipdate >= '1995-01-01'
        and l.l_shipdate <= '1996-12-31'
    expect:
      columns: [q7_france_germany_line_count]
      rows:
        - [18]

  - id: inabox_direct_tpch_kernels.004q.q7_repeated_nation_alias_count_without_shipdate
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q7, repeated-alias, relationship-vector-graph, count]
    # Same repeated-alias frontier as .004p, without the shipdate window. This
    # proves role-keyed repeated-table filters can stay independent from
    # time-range relationship-vector projection.
    sql: |-
      select count(*) as q7_france_germany_line_count
      from supplier as s
      inner join lineitem as l on l.l_suppkey = s.s_suppkey
      inner join orders as o on o.o_orderkey = l.l_orderkey
      inner join customer as c on c.c_custkey = o.o_custkey
      inner join nation as n1 on n1.n_nationkey = s.s_nationkey
      inner join nation as n2 on n2.n_nationkey = c.c_nationkey
      where n1.n_name = 'FRANCE'
        and n2.n_name = 'GERMANY'
    expect:
      columns: [q7_france_germany_line_count]
      rows:
        - [57]

  - id: inabox_direct_tpch_kernels.004q1.q7_france_germany_revenue_by_year
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q7, repeated-alias, relationship-vector-graph, aggregate, computed-group-by]
    order: rowsort
    # Stages Q7's revenue/year grouped output for one nation-pair direction.
    # The formal bidirectional `(FRANCE, GERMANY) OR (GERMANY, FRANCE)` predicate
    # remains a parser/planner boolean-normalization phase.
    sql: |-
      select n1.n_name as supp_nation,
             n2.n_name as cust_nation,
             year(l.l_shipdate) as l_year,
             sum(l.l_extendedprice * (1 - l.l_discount)) as revenue
      from supplier as s
      inner join lineitem as l on l.l_suppkey = s.s_suppkey
      inner join orders as o on o.o_orderkey = l.l_orderkey
      inner join customer as c on c.c_custkey = o.o_custkey
      inner join nation as n1 on n1.n_nationkey = s.s_nationkey
      inner join nation as n2 on n2.n_nationkey = c.c_nationkey
      where n1.n_name = 'FRANCE'
        and n2.n_name = 'GERMANY'
        and l.l_shipdate >= '1995-01-01'
        and l.l_shipdate <= '1996-12-31'
      group by n1.n_name, n2.n_name, year(l.l_shipdate)
    expect:
      columns: [supp_nation, cust_nation, l_year, revenue]
      rows:
        - ["FRANCE", "GERMANY", 1995, 268068.57739999995]
        - ["FRANCE", "GERMANY", 1996, 303862.298]

