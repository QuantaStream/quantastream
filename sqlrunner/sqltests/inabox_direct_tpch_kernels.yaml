  - id: inabox_direct_tpch_kernels.026d.q19_formal_discounted_revenue
    status: supported
    kind: query
    timeout: 180s
    capabilities: [inabox-direct, tpch-q19, relationship-vector-join, mixed-table-or, scalar-in, arithmetic-aggregate, grouped-boolean-lowering]
    # Q19 proves the formal mixed-table OR revenue shape. The grouped filter
    # tree now targets the lineitem child domain and uses constrained
    # branch-local evaluation so the final join materialization is narrow.
    sql: |-
      select sum(l.l_extendedprice * (1 - l.l_discount)) as revenue
      from lineitem as l
      inner join part as p on p.p_partkey = l.l_partkey
      where
        (
          p.p_brand = 'Brand#12'
          and p.p_container in ('SM CASE', 'SM BOX', 'SM PACK', 'SM PKG')
          and l.l_quantity >= 1
          and l.l_quantity <= 11
          and p.p_size >= 1
          and p.p_size <= 5
          and l.l_shipmode in ('AIR', 'AIR REG')
          and l.l_shipinstruct = 'DELIVER IN PERSON'
        )
        or
        (
          p.p_brand = 'Brand#23'
          and p.p_container in ('MED BAG', 'MED BOX', 'MED PKG', 'MED PACK')
          and l.l_quantity >= 10
          and l.l_quantity <= 20
          and p.p_size >= 1
          and p.p_size <= 10
          and l.l_shipmode in ('AIR', 'AIR REG')
          and l.l_shipinstruct = 'DELIVER IN PERSON'
        )
        or
        (
          p.p_brand = 'Brand#34'
          and p.p_container in ('LG CASE', 'LG BOX', 'LG PACK', 'LG PKG')
          and l.l_quantity >= 20
          and l.l_quantity <= 30
          and p.p_size >= 1
          and p.p_size <= 15
          and l.l_shipmode in ('AIR', 'AIR REG')
          and l.l_shipinstruct = 'DELIVER IN PERSON'
        )
    expect:
      columns: [revenue]
      rows:
        - ["22923.028"]

