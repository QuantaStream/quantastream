  - id: inabox_direct_tpch_kernels.012.q11_formal_scalar_subquery_threshold
    status: supported
    kind: query
    order: rowsort
    timeout: 30s
    capabilities: [inabox-direct, tpch-q11, scalar-subquery, having, parser-boundary]
    # Uncorrelated scalar aggregate HAVING subqueries are evaluated once and
    # substituted as literal thresholds before the normal grouped aggregate path.
    sql: |-
      select ps.ps_partkey,
             sum(ps.ps_supplycost * ps.ps_availqty) as part_value
      from partsupp as ps
      inner join supplier as s on s.s_suppkey = ps.ps_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      where n.n_name = 'GERMANY'
      group by ps.ps_partkey
      having part_value > (
        select sum(ps2.ps_supplycost * ps2.ps_availqty) * 0.0001
        from partsupp as ps2
        inner join supplier as s2 on s2.s_suppkey = ps2.ps_suppkey
        inner join nation as n2 on n2.n_nationkey = s2.s_nationkey
        where n2.n_name = 'GERMANY'
      )
      order by part_value desc
      limit 10
    expect:
      columns: [ps_partkey, part_value]
      rows:
        - ["1376", "1.327124989e+07"]
        - ["788", "9.49864806e+06"]
        - ["1071", "9.3882644e+06"]
        - ["1768", "9.20719975e+06"]
        - ["1168", "8.881908959999999e+06"]
        - ["1084", "8.70949416e+06"]
        - ["1415", "8.47148956e+06"]
        - ["1338", "8.29384112e+06"]
        - ["124", "8.2032093e+06"]
        - ["1232", "8.11166334e+06"]

