version: 1
name: inabox_direct_tpch_kernels

tests:
  - id: inabox_direct_tpch_kernels.000a.q1_grouped_lineitem_shape
    status: supported
    kind: query
    order: exact
    timeout: 60s
    capabilities: [inabox-direct, tpch-q1, single-table, grouped-aggregate, count, grouped-materialization]
    sql: |-
      select l_returnflag, l_linestatus, count(*) as count_order
      from lineitem
      group by l_returnflag, l_linestatus
      order by l_returnflag, l_linestatus
    expect:
      columns: [l_returnflag, l_linestatus, count_order]
      rows:
        - ["A", "F", 14876]
        - ["N", "F", 348]
        - ["N", "O", 30049]
        - ["R", "F", 14902]

  - id: inabox_direct_tpch_kernels.000b.q4_orderdate_priority_group_count
    status: supported
    kind: query
    order: rowsort
    timeout: 60s
    capabilities: [inabox-direct, tpch-q4, single-table, time-range, grouped-aggregate, count, order-by, grouped-materialization]
    sql: |-
      select o_orderpriority, count(*) as order_count
      from orders
      where o_orderdate >= '1993-07-01'
        and o_orderdate < '1993-10-01'
      group by o_orderpriority
      order by o_orderpriority
    expect:
      columns: [o_orderpriority, order_count]
      rows:
        - ["1-URGENT", 104]
        - ["2-HIGH", 111]
        - ["3-MEDIUM", 120]
        - ["4-NOT SPECIFIED", 109]
        - ["5-LOW", 138]

  - id: inabox_direct_tpch_kernels.000c.q2_europe_brass_part_count
    status: supported
    kind: query
    order: exact
    timeout: 90s
    capabilities: [inabox-direct, tpch-q2, relationship-vector-graph, suffix-like, numeric-predicate, count]
    sql: |-
      select count(*) as europe_brass_part_count
      from part as p
      inner join partsupp as ps on ps.ps_partkey = p.p_partkey
      inner join supplier as s on s.s_suppkey = ps.ps_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where p.p_size = 15
        and p.p_type like '%BRASS'
        and r.r_name = 'EUROPE'
    expect:
      columns: [europe_brass_part_count]
      rows:
        - [5]

  - id: inabox_direct_tpch_kernels.000d.q2_europe_brass_part_projection
    status: supported
    kind: query
    timeout: 90s
    capabilities: [inabox-direct, tpch-q2, relationship-vector-graph, suffix-like, numeric-predicate, projection, graph-projection]
    # Verifies mixed-table graph projection after aligning sink rows back to
    # ancestor roles and applying residual projected predicates.
    sql: |-
      select p.p_partkey, p.p_mfgr, s.s_suppkey, ps.ps_supplycost
      from part as p
      inner join partsupp as ps on ps.ps_partkey = p.p_partkey
      inner join supplier as s on s.s_suppkey = ps.ps_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where p.p_size = 15
        and p.p_type like '%BRASS'
        and r.r_name = 'EUROPE'
    expect:
      row_count: 5

  - id: inabox_direct_tpch_kernels.000e.q2_europe_brass_low_cost_count
    status: supported
    kind: query
    order: exact
    timeout: 90s
    capabilities: [inabox-direct, tpch-q2, relationship-vector-graph, suffix-like, numeric-predicate, count]
    sql: |-
      select count(*) as europe_brass_low_cost_count
      from part as p
      inner join partsupp as ps on ps.ps_partkey = p.p_partkey
      inner join supplier as s on s.s_suppkey = ps.ps_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where p.p_size = 15
        and p.p_type like '%BRASS'
        and r.r_name = 'EUROPE'
        and ps.ps_supplycost < 300
    expect:
      columns: [europe_brass_low_cost_count]
      rows:
        - [2]

  - id: inabox_direct_tpch_kernels.001.q3_customer_building_filter
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q3, string-filter, count]
    sql: |-
      select count(*) as building_customer_count
      from customer as c
      where c.c_mktsegment = 'BUILDING'
    expect:
      columns: [building_customer_count]
      rows:
        - [337]

  - id: inabox_direct_tpch_kernels.002.q3_customer_orders_building_projection
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q3, relationship-vector-join, string-filter, projection]
    # Time-sharded child tables need a synthetic shard window when the child
    # side has no local predicates.
    sql: |-
      select c.c_custkey, o.o_orderkey
      from customer as c
      inner join orders as o on c.c_custkey = o.o_custkey
      where c.c_mktsegment = 'BUILDING'
    expect:
      columns: [c_custkey, o_orderkey]
      row_count: 3706

  - id: inabox_direct_tpch_kernels.002a.q3_orders_lineitem_date_count
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q3, relationship-vector-join, time-range, count]
    # The obsolete qlbridge proxy result was 32289 here, which is only the child-side
    # l_shipdate predicate count. The relationship-vector reducer returns the
    # SQL intersection after applying both parent and child date predicates.
    sql: |-
      select count(*) as q3_order_line_count
      from orders as o
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      where o.o_orderdate < '1995-03-15'
        and l.l_shipdate > '1995-03-15'
    expect:
      columns: [q3_order_line_count]
      rows:
        - [1464]

