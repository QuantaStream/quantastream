  - id: inabox_direct_tpch_kernels.004f.q5_region_nation_supplier_lineitem_chain_count
    status: supported
    kind: query
    capabilities: [inabox-direct, tpch-q5, relationship-vector-chain, fact-table, count, full-child-scan]
    # This proves dimension filtering can flow through a three-edge chain into
    # the lineitem fact table. The final supplier -> lineitem hop still scans
    # the full time-sharded child side in this phase.
    sql: |-
      select count(*) as asia_supplier_line_count
      from region as r
      inner join nation as n on n.n_regionkey = r.r_regionkey
      inner join supplier as s on s.s_nationkey = n.n_nationkey
      inner join lineitem as l on l.l_suppkey = s.s_suppkey
      where r.r_name = 'ASIA'
    expect:
      columns: [asia_supplier_line_count]
      rows:
        - [16464]

