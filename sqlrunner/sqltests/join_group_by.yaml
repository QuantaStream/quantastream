version: 1
name: "join_group_by"

tests:
  - id: "join_group_by.000.drop_deliveries"
    status: supported
    kind: admin
    sql: drop deliveries_qa

  - id: "join_group_by.000a.drop_lineitems"
    status: supported
    kind: admin
    sql: drop lineitems_qa

  - id: "join_group_by.001.drop_orders"
    status: supported
    kind: admin
    sql: drop orders_qa

  - id: "join_group_by.002.drop_customers"
    status: supported
    kind: admin
    sql: drop customers_qa

  - id: "join_group_by.003.create_customers"
    status: supported
    kind: admin
    sql: create customers_qa

  - id: "join_group_by.004.create_orders"
    status: supported
    kind: admin
    sql: create orders_qa

  - id: "join_group_by.005.insert_customer"
    status: supported
    kind: statement
    sql: |-
      insert into customers_qa (cust_id, first_name, city, age)
      values ('1', 'Abe', 'Seattle', 30)

  - id: "join_group_by.006.insert_customer"
    status: supported
    kind: statement
    sql: |-
      insert into customers_qa (cust_id, first_name, city, age)
      values ('2', 'Abby', 'Tacoma', 40)

  - id: "join_group_by.007.insert_customer"
    status: supported
    kind: statement
    sql: |-
      insert into customers_qa (cust_id, first_name, city, age)
      values ('3', 'Annie', 'Everett', 50)

  - id: "join_group_by.008.insert_customer"
    status: supported
    kind: statement
    sql: |-
      insert into customers_qa (cust_id, first_name, city, age)
      values ('10', 'Carl', 'Spokane', 60)

  - id: "join_group_by.009.commit_customers"
    status: supported
    kind: statement
    sql: commit

  - id: "join_group_by.010.insert_order"
    status: supported
    kind: statement
    sql: |-
      insert into orders_qa (cust_id, order_id, order_date, ship_via)
      values ('1', '1001', '2023-06-01T01:00:00', 'UPS')

  - id: "join_group_by.011.insert_order"
    status: supported
    kind: statement
    sql: |-
      insert into orders_qa (cust_id, order_id, order_date, ship_via)
      values ('1', '1002', '2023-06-01T02:00:00', 'UPS')

  - id: "join_group_by.012.insert_order"
    status: supported
    kind: statement
    sql: |-
      insert into orders_qa (cust_id, order_id, order_date, ship_via)
      values ('10', '1003', '2023-06-01T03:00:00', 'FEDEX')

  - id: "join_group_by.013.commit_orders"
    status: supported
    kind: statement
    sql: commit

  - id: "join_group_by.020.inner_count_by_city"
    status: supported
    kind: query
    order: rowsort
    capabilities: [inner-join, group-by, count, join-multiplicity]
    sql: |-
      select c.city, count(*) as order_count
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      group by c.city
    expect:
      columns: [city, order_count]
      rows:
        - ["Seattle", 2]
        - ["Spokane", 1]

  - id: "join_group_by.021.inner_multiple_aggregates"
    status: supported
    kind: query
    order: rowsort
    capabilities: [inner-join, group-by, multiple-aggregates, join-multiplicity]
    sql: |-
      select c.city,
             count(*) as order_count,
             min(age) as minimum_age,
             max(age) as maximum_age,
             sum(age) as total_age,
             avg(age) as average_age
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      group by c.city
    expect:
      columns: [city, order_count, minimum_age, maximum_age, total_age, average_age]
      rows:
        - ["Seattle", 2, 30, 30, 60, 30]
        - ["Spokane", 1, 60, 60, 60, 60]

  - id: "join_group_by.022.outer_count_by_city"
    status: supported
    kind: query
    order: rowsort
    capabilities: [outer-join, group-by, count, join-multiplicity]
    sql: |-
      select c.city, count(*) as joined_count
      from customers_qa as c
      outer join orders_qa as o on o.cust_id = c.cust_id
      group by c.city
    expect:
      columns: [city, joined_count]
      rows:
        - ["Everett", 1]
        - ["Seattle", 2]
        - ["Spokane", 1]
        - ["Tacoma", 1]

  - id: "join_group_by.023.inner_scalar_multiple_aggregates"
    status: supported
    kind: query
    capabilities: [inner-join, multiple-aggregates, join-multiplicity]
    sql: |-
      select count(*) as joined_count,
             sum(age) as total_age
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
    expect:
      columns: [joined_count, total_age]
      rows:
        - [3, 120]

  - id: "join_group_by.024.qualified_aggregate_argument"
    status: supported
    kind: query
    capabilities: [inner-join, aggregate, qualified-column]
    sql: |-
      select sum(c.age) as total_age
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
    expect:
      columns: [total_age]
      rows:
        - [120]
