version: 1
name: mysql_compat_joins_edges

tests:
  - id: mysql_compat_joins_edges.001.join_case_projection
    status: supported
    kind: query
    order: exact
    feature: joins_expression_projection_edges
    compatibility: mysql
    requires: [select, inner_join, case, in, lower, order_by, limit]
    sql: |
      select c.c_custkey,
             o.o_orderkey,
             case when o.o_orderpriority in ('1-URGENT', '2-HIGH') then 'urgent'
                  else lower(c.c_mktsegment) end as order_label
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      where c.c_custkey = '1'
      order by o.o_orderkey
      limit 3
    expect:
      columns: [c_custkey, o_orderkey, order_label]
      rows:
        - [1, 9154, building]
        - [1, 14656, urgent]
        - [1, 24322, urgent]

  - id: mysql_compat_joins_edges.002.join_function_and_coerced_filters
    status: supported
    kind: query
    order: exact
    feature: joins_predicate_edges
    compatibility: mysql
    requires: [select, inner_join, where, lower, between, order_by, limit]
    sql: |
      select c.c_custkey, o.o_orderkey
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      where lower(c.c_mktsegment) = 'building'
        and o.o_orderkey between '9000' and '10000'
      order by o.o_orderkey
      limit 5
    expect:
      columns: [c_custkey, o_orderkey]
      rows:
        - [514, 9027]
        - [1475, 9028]
        - [535, 9030]
        - [121, 9056]
        - [610, 9088]

  - id: mysql_compat_joins_edges.003.grouped_join_count_distinct
    status: supported
    kind: query
    order: exact
    feature: joins_distinct_aggregate_edges
    compatibility: mysql
    requires: [select, inner_join, group_by, count, distinct, in, order_by]
    sql: |
      select c.c_mktsegment as market_segment,
             count(distinct o.o_orderpriority) as distinct_priorities
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      where c.c_mktsegment in ('BUILDING', 'AUTOMOBILE')
      group by c.c_mktsegment
      order by c.c_mktsegment
    expect:
      columns: [market_segment, distinct_priorities]
      rows:
        - [AUTOMOBILE, 5]
        - [BUILDING, 5]

  - id: mysql_compat_joins_edges.004.join_order_by_case_hidden_child_field
    status: supported
    kind: query
    order: exact
    feature: joins_order_by_expression_edges
    compatibility: mysql
    requires: [select, inner_join, order_by, case, in, limit]
    sql: |
      select c.c_custkey, o.o_orderkey, o.o_orderpriority
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      where c.c_custkey in (1, 2)
      order by case when o.o_orderpriority in ('1-URGENT', '2-HIGH') then 0 else 1 end,
               o.o_orderkey
      limit 5
    expect:
      columns: [c_custkey, o_orderkey, o_orderpriority]
      rows:
        - [2, 10563, 1-URGENT]
        - [1, 14656, 2-HIGH]
        - [1, 24322, 1-URGENT]
        - [2, 29956, 1-URGENT]
        - [1, 31653, 2-HIGH]

  - id: mysql_compat_joins_edges.005.join_order_by_function_hidden_parent_field
    status: supported
    kind: query
    order: exact
    feature: joins_order_by_expression_edges
    compatibility: mysql
    requires: [select, inner_join, order_by, lower, between, limit]
    sql: |
      select c.c_custkey, o.o_orderkey, c.c_mktsegment
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      where o.o_orderkey between 9000 and 9200
      order by lower(c.c_mktsegment), o.o_orderkey
      limit 5
    expect:
      columns: [c_custkey, o_orderkey, c_mktsegment]
      rows:
        - [677, 9026, AUTOMOBILE]
        - [926, 9059, AUTOMOBILE]
        - [1399, 9063, AUTOMOBILE]
        - [679, 9091, AUTOMOBILE]
        - [1010, 9120, AUTOMOBILE]

  - id: mysql_compat_joins_edges.006.join_order_by_arithmetic_hidden_child_field
    status: supported
    kind: query
    order: exact
    feature: joins_order_by_expression_edges
    compatibility: mysql
    requires: [select, inner_join, order_by, arithmetic, limit]
    sql: |
      select c.c_custkey, o.o_orderkey
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      where c.c_custkey in (1, 2, 3)
      order by (o.o_totalprice * 2) desc, o.o_orderkey
      limit 5
    expect:
      columns: [c_custkey, o_orderkey]
      rows:
        - [1, 9154]
        - [1, 36422]
        - [1, 24322]
        - [2, 38276]
        - [2, 20257]

  - id: mysql_compat_joins_edges.007.grouped_join_sum_arithmetic_expression
    status: supported
    kind: query
    order: exact
    feature: joins_aggregate_expression_edges
    compatibility: mysql
    requires: [select, inner_join, group_by, sum, arithmetic, in, order_by]
    sql: |
      select c.c_mktsegment as market_segment,
             sum(o.o_orderkey * 2) as doubled_orderkey_sum
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      where c.c_mktsegment in ('BUILDING', 'AUTOMOBILE')
      group by c.c_mktsegment
      order by doubled_orderkey_sum desc, market_segment
    expect:
      columns: [market_segment, doubled_orderkey_sum]
      rows:
        - [BUILDING, 223443472]
        - [AUTOMOBILE, 178279376]

  - id: mysql_compat_joins_edges.008.grouped_join_sum_case_expression
    status: supported
    kind: query
    order: exact
    feature: joins_aggregate_expression_edges
    compatibility: mysql
    requires: [select, inner_join, group_by, sum, case, in, order_by]
    sql: |
      select c.c_mktsegment as market_segment,
             sum(case when o.o_orderpriority in ('1-URGENT', '2-HIGH') then 1 else 0 end) as urgent_orders
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      where c.c_mktsegment in ('BUILDING', 'AUTOMOBILE')
      group by c.c_mktsegment
      order by urgent_orders desc, market_segment
    expect:
      columns: [market_segment, urgent_orders]
      rows:
        - [BUILDING, 1477]
        - [AUTOMOBILE, 1214]

  - id: mysql_compat_joins_edges.009.grouped_join_sum_case_field_expression
    status: supported
    kind: query
    order: exact
    feature: joins_aggregate_expression_edges
    compatibility: mysql
    requires: [select, inner_join, group_by, sum, case, in, order_by]
    sql: |
      select c.c_mktsegment as market_segment,
             sum(case when o.o_orderpriority in ('1-URGENT', '2-HIGH') then o.o_orderkey else 0 end) as urgent_orderkey_sum
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      where c.c_mktsegment in ('BUILDING', 'AUTOMOBILE')
      group by c.c_mktsegment
      order by urgent_orderkey_sum desc, market_segment
    expect:
      columns: [market_segment, urgent_orderkey_sum]
      rows:
        - [BUILDING, 45293229]
        - [AUTOMOBILE, 35592782]

  - id: mysql_compat_joins_edges.010.grouped_join_having_aggregate_alias
    status: supported
    kind: query
    order: exact
    feature: joins_having_edges
    compatibility: mysql
    requires: [select, inner_join, group_by, having, count, aliases, order_by]
    sql: |
      select c.c_mktsegment as market_segment,
             count(*) as order_count
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      group by c.c_mktsegment
      having order_count > 1400
      order by order_count desc, market_segment
    expect:
      columns: [market_segment, order_count]
      rows:
        - [BUILDING, 3706]
        - [FURNITURE, 3007]
        - [AUTOMOBILE, 2979]
        - [HOUSEHOLD, 2772]
        - [MACHINERY, 2536]

  - id: mysql_compat_joins_edges.011.grouped_join_having_aggregate_not_selected
    status: supported
    kind: query
    order: exact
    feature: joins_having_edges
    compatibility: mysql
    requires: [select, inner_join, group_by, having, count, order_by]
    sql: |
      select c.c_mktsegment as market_segment
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      group by c.c_mktsegment
      having count(*) > 1400
      order by c.c_mktsegment
    expect:
      columns: [market_segment]
      rows:
        - [AUTOMOBILE]
        - [BUILDING]
        - [FURNITURE]
        - [HOUSEHOLD]
        - [MACHINERY]

  - id: mysql_compat_joins_edges.012.grouped_join_having_aggregate_expression
    status: supported
    kind: query
    order: exact
    feature: joins_having_edges
    compatibility: mysql
    requires: [select, inner_join, group_by, having, sum, arithmetic, order_by]
    sql: |
      select c.c_mktsegment as market_segment,
             sum(o.o_orderkey) as orderkey_sum
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      group by c.c_mktsegment
      having sum(o.o_orderkey * 2) > 180000000
      order by orderkey_sum desc, market_segment
    expect:
      columns: [market_segment, orderkey_sum]
      rows:
        - [BUILDING, 111721736]

  - id: mysql_compat_joins_edges.013.three_table_join_projection_hidden_order
    status: supported
    kind: query
    order: exact
    feature: joins_three_table_edges
    compatibility: mysql
    requires: [select, inner_join, three_table_join, where, order_by, limit]
    sql: |
      select c.c_custkey, o.o_orderkey, l.l_linenumber
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      where c.c_custkey = 1
      order by l.l_extendedprice desc, o.o_orderkey, l.l_linenumber
      limit 5
    expect:
      columns: [c_custkey, o_orderkey, l_linenumber]
      rows:
        - [1, 31653, 1]
        - [1, 9154, 1]
        - [1, 9154, 7]
        - [1, 24322, 4]
        - [1, 53283, 4]

  - id: mysql_compat_joins_edges.014.three_table_join_grouped_case_aggregate
    status: supported
    kind: query
    order: exact
    feature: joins_three_table_edges
    compatibility: mysql
    requires: [select, inner_join, three_table_join, group_by, sum, case, in, order_by]
    sql: |
      select c.c_mktsegment as market_segment,
             sum(case when l.l_quantity > 30 then 1 else 0 end) as large_line_count
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      where c.c_mktsegment in ('BUILDING', 'AUTOMOBILE')
      group by c.c_mktsegment
      order by large_line_count desc, market_segment
    expect:
      columns: [market_segment, large_line_count]
      rows:
        - [BUILDING, 6012]
        - [AUTOMOBILE, 4782]

  - id: mysql_compat_joins_edges.015.three_table_join_having_grandchild_aggregate
    status: supported
    kind: query
    order: exact
    feature: joins_three_table_edges
    compatibility: mysql
    requires: [select, inner_join, three_table_join, group_by, having, sum, order_by]
    sql: |
      select c.c_mktsegment as market_segment,
             sum(l.l_quantity) as quantity_sum
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      group by c.c_mktsegment
      having sum(l.l_quantity) > 60000.00
      order by quantity_sum desc, market_segment
    expect:
      columns: [market_segment, quantity_sum]
      rows:
        - [BUILDING, 382779.00]
        - [AUTOMOBILE, 305943.00]
        - [FURNITURE, 303756.00]
        - [HOUSEHOLD, 284727.00]
        - [MACHINERY, 258922.00]
