version: 1
name: mysql_compat_views_boundaries

tests:
  - id: mysql_compat_views_boundaries.001.drop_view_if_exists
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view, if_exists]
    sql: |
      drop view if exists qs_mysql_compat_missing_view

  - id: mysql_compat_views_boundaries.002.create_view_column_list
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [create_view, inline_column_list]
    sql: |
      create or replace view qs_mysql_compat_column_list_view (customer_key, customer_name) as
      select c_custkey, c_name
      from customer

  - id: mysql_compat_views_boundaries.003.select_view_column_list
    status: supported
    kind: query
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [select, view_reference, inline_column_list]
    sql: |
      select customer_key, customer_name
      from qs_mysql_compat_column_list_view
      where customer_key = 1
    expect:
      columns: [customer_key, customer_name]
      rows:
        - [1, "Customer#000000001"]

  - id: mysql_compat_views_boundaries.004.drop_view_column_list
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_column_list_view

  - id: mysql_compat_views_boundaries.005.create_drop_cascade_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [create_view]
    sql: |
      create or replace view qs_mysql_compat_drop_cascade_view as
      select c_custkey as customer_key
      from customer

  - id: mysql_compat_views_boundaries.006.drop_view_cascade
    status: xfail
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view, cascade]
    issue: "DROP VIEW ... CASCADE is a post-1.0 compatibility target; QS currently requires explicit dependent-object cleanup."
    sql: |
      drop view qs_mysql_compat_drop_cascade_view cascade

  - id: mysql_compat_views_boundaries.007.cleanup_drop_cascade_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view, if_exists]
    sql: |
      drop view if exists qs_mysql_compat_drop_cascade_view

  - id: mysql_compat_views_boundaries.010.create_aggregate_view
    status: supported
    kind: statement
    feature: views_query_boundary
    compatibility: mysql
    requires: [create_view, aggregate]
    sql: |
      create or replace view qs_mysql_compat_aggregate_view as
      select count(*) as line_count
      from lineitem

  - id: mysql_compat_views_boundaries.011.select_aggregate_view
    status: supported
    kind: query
    feature: views_query_boundary
    compatibility: mysql
    requires: [select, view_reference, aggregate]
    sql: |
      select line_count
      from qs_mysql_compat_aggregate_view
    expect:
      columns: [line_count]
      rows:
        - [60175]

  - id: mysql_compat_views_boundaries.012.drop_aggregate_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_aggregate_view

  - id: mysql_compat_views_boundaries.020.create_expression_view
    status: supported
    kind: statement
    feature: views_query_boundary
    compatibility: mysql
    requires: [create_view, expression_projection]
    sql: |
      create or replace view qs_mysql_compat_expression_view as
      select c_custkey + 1 as next_customer_key
      from customer

  - id: mysql_compat_views_boundaries.021.select_expression_view
    status: supported
    kind: query
    feature: views_query_boundary
    compatibility: mysql
    requires: [select, view_reference, expression_projection]
    sql: |
      select next_customer_key
      from qs_mysql_compat_expression_view
      where next_customer_key = 2
    expect:
      columns: [next_customer_key]
      rows:
        - [2]

  - id: mysql_compat_views_boundaries.022.drop_expression_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_expression_view

  - id: mysql_compat_views_boundaries.030.create_distinct_view
    status: supported
    kind: statement
    feature: views_query_boundary
    compatibility: mysql
    requires: [create_view, distinct]
    sql: |
      create or replace view qs_mysql_compat_distinct_view as
      select distinct c_mktsegment as market_segment
      from customer

  - id: mysql_compat_views_boundaries.031.select_distinct_view
    status: supported
    kind: query
    feature: views_query_boundary
    compatibility: mysql
    requires: [select, view_reference, distinct]
    sql: |
      select market_segment
      from qs_mysql_compat_distinct_view
      order by market_segment
      limit 1
    expect:
      columns: [market_segment]
      rows:
        - ["AUTOMOBILE"]

  - id: mysql_compat_views_boundaries.032.drop_distinct_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_distinct_view

  - id: mysql_compat_views_boundaries.040.create_outer_join_source_view
    status: supported
    kind: statement
    feature: views_outer_query_boundary
    compatibility: mysql
    requires: [create_view, aliases]
    sql: |
      create or replace view qs_mysql_compat_customer_source_view as
      select
        c_custkey as customer_key,
        c_name as customer_name
      from customer

  - id: mysql_compat_views_boundaries.041.join_view_in_outer_query
    status: supported
    kind: query
    feature: views_outer_query_boundary
    compatibility: mysql
    requires: [select, view_reference, inner_join]
    sql: |
      select v.customer_key, o.o_orderkey
      from qs_mysql_compat_customer_source_view as v
      inner join orders as o on o.o_custkey = v.customer_key
      where o.o_orderkey = 1
    expect:
      columns: [customer_key, o_orderkey]
      rows:
        - [370, 1]

  - id: mysql_compat_views_boundaries.042.drop_outer_join_source_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_customer_source_view

  - id: mysql_compat_views_boundaries.050.create_select_star_view
    status: supported
    kind: statement
    feature: views_query_boundary
    compatibility: mysql
    requires: [create_view, wildcard_projection]
    sql: |
      create or replace view qs_mysql_compat_star_view as
      select *
      from region

  - id: mysql_compat_views_boundaries.051.select_star_view
    status: supported
    kind: query
    feature: views_query_boundary
    compatibility: mysql
    requires: [select, view_reference, wildcard_projection]
    sql: |
      select r_regionkey, r_name
      from qs_mysql_compat_star_view
      where r_regionkey = 1
    expect:
      columns: [r_regionkey, r_name]
      rows:
        - [1, "AMERICA"]

  - id: mysql_compat_views_boundaries.052.drop_select_star_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_star_view

  - id: mysql_compat_views_boundaries.060.create_nested_view_base
    status: supported
    kind: statement
    feature: views_nested_boundary
    compatibility: mysql
    requires: [create_view]
    sql: |
      create or replace view qs_mysql_compat_nested_base_view as
      select c_custkey as customer_key, c_name as customer_name
      from customer

  - id: mysql_compat_views_boundaries.061.create_nested_view
    status: xfail
    kind: statement
    feature: views_nested_boundary
    compatibility: mysql
    requires: [create_view, nested_view]
    issue: "CREATE VIEW definitions that reference another view are not accepted yet."
    sql: |
      create or replace view qs_mysql_compat_nested_view as
      select customer_key, customer_name
      from qs_mysql_compat_nested_base_view

  - id: mysql_compat_views_boundaries.062.select_nested_view
    status: xfail
    kind: query
    feature: views_nested_boundary
    compatibility: mysql
    requires: [select, view_reference, nested_view]
    issue: "Nested view references are not expandable yet."
    sql: |
      select customer_key, customer_name
      from qs_mysql_compat_nested_view
      where customer_key = 1

  - id: mysql_compat_views_boundaries.063.drop_nested_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view if exists qs_mysql_compat_nested_view

  - id: mysql_compat_views_boundaries.064.drop_nested_view_base
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_nested_base_view

  - id: mysql_compat_views_boundaries.070.create_grouped_boolean_view
    status: supported
    kind: statement
    feature: views_predicate_boundary
    compatibility: mysql
    requires: [create_view, grouped_boolean_predicates]
    sql: |
      create or replace view qs_mysql_compat_grouped_boolean_view as
      select c_custkey as customer_key, c_mktsegment as market_segment
      from customer
      where (c_mktsegment = 'BUILDING' or c_mktsegment = 'AUTOMOBILE')
        and c_custkey > 0

  - id: mysql_compat_views_boundaries.071.select_grouped_boolean_view
    status: supported
    kind: query
    feature: views_predicate_boundary
    compatibility: mysql
    requires: [select, view_reference, grouped_boolean_predicates]
    sql: |
      select customer_key
      from qs_mysql_compat_grouped_boolean_view
      order by customer_key
      limit 1
    expect:
      columns: [customer_key]
      rows:
        - [1]

  - id: mysql_compat_views_boundaries.072.drop_grouped_boolean_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_grouped_boolean_view

  - id: mysql_compat_views_boundaries.080.create_grouped_aggregate_view
    status: supported
    kind: statement
    feature: views_group_boundary
    compatibility: mysql
    requires: [create_view, group_by, aggregate]
    sql: |
      create or replace view qs_mysql_compat_grouped_aggregate_view as
      select c_mktsegment as market_segment, count(*) as customer_count
      from customer
      group by c_mktsegment

  - id: mysql_compat_views_boundaries.081.select_grouped_aggregate_view
    status: xfail
    kind: query
    feature: views_group_boundary
    compatibility: mysql
    requires: [select, view_reference, group_by, aggregate]
    issue: "GROUP BY inside view definitions is not expandable yet."
    sql: |
      select market_segment, customer_count
      from qs_mysql_compat_grouped_aggregate_view
      order by market_segment
      limit 1

  - id: mysql_compat_views_boundaries.082.drop_grouped_aggregate_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_grouped_aggregate_view

  - id: mysql_compat_views_boundaries.090.create_having_view
    status: supported
    kind: statement
    feature: views_group_boundary
    compatibility: mysql
    requires: [create_view, group_by, having]
    sql: |
      create or replace view qs_mysql_compat_having_view as
      select c_mktsegment as market_segment, count(*) as customer_count
      from customer
      group by c_mktsegment
      having customer_count > 0

  - id: mysql_compat_views_boundaries.091.select_having_view
    status: xfail
    kind: query
    feature: views_group_boundary
    compatibility: mysql
    requires: [select, view_reference, group_by, having]
    issue: "HAVING inside view definitions is not expandable yet."
    sql: |
      select market_segment, customer_count
      from qs_mysql_compat_having_view
      order by market_segment
      limit 1

  - id: mysql_compat_views_boundaries.092.drop_having_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_having_view

  - id: mysql_compat_views_boundaries.100.create_order_by_view
    status: supported
    kind: statement
    feature: views_order_limit_boundary
    compatibility: mysql
    requires: [create_view, order_by]
    sql: |
      create or replace view qs_mysql_compat_ordered_view as
      select c_custkey as customer_key, c_name as customer_name
      from customer
      order by c_custkey

  - id: mysql_compat_views_boundaries.101.select_order_by_view
    status: xfail
    kind: query
    feature: views_order_limit_boundary
    compatibility: mysql
    requires: [select, view_reference, order_by]
    issue: "ORDER BY inside view definitions is not expandable yet."
    sql: |
      select customer_key, customer_name
      from qs_mysql_compat_ordered_view
      limit 1

  - id: mysql_compat_views_boundaries.102.drop_order_by_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_ordered_view

  - id: mysql_compat_views_boundaries.110.create_limit_view
    status: supported
    kind: statement
    feature: views_order_limit_boundary
    compatibility: mysql
    requires: [create_view, limit]
    sql: |
      create or replace view qs_mysql_compat_limit_view as
      select c_custkey as customer_key, c_name as customer_name
      from customer
      limit 1

  - id: mysql_compat_views_boundaries.111.select_limit_view
    status: xfail
    kind: query
    feature: views_order_limit_boundary
    compatibility: mysql
    requires: [select, view_reference, limit]
    issue: "LIMIT inside view definitions is not expandable yet."
    sql: |
      select customer_key, customer_name
      from qs_mysql_compat_limit_view

  - id: mysql_compat_views_boundaries.112.drop_limit_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_limit_view

  - id: mysql_compat_views_boundaries.115.create_union_all_tpch_counts_view
    status: xfail
    kind: statement
    feature: views_union_boundary
    compatibility: mysql
    requires: [create_view, create_or_replace_view, union_all, aggregate]
    issue: "Views backed by UNION ALL SELECT composition are not accepted or expandable yet; direct constant UNION ALL SELECT is only a narrow parser boundary."
    sql: |
      create or replace view qs_mysql_compat_tpch_union_counts as
      select 'orders' as source_table, count(*) as row_count
      from orders
      union all
      select 'lineitem' as source_table, count(*) as row_count
      from lineitem

  - id: mysql_compat_views_boundaries.116.cleanup_union_all_tpch_counts_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view, if_exists]
    sql: |
      drop view if exists qs_mysql_compat_tpch_union_counts

  - id: mysql_compat_views_boundaries.120.create_multi_view_source_left
    status: supported
    kind: statement
    feature: views_multi_source_boundary
    compatibility: mysql
    requires: [create_view]
    sql: |
      create or replace view qs_mysql_compat_multi_view_left as
      select c_custkey as customer_key
      from customer

  - id: mysql_compat_views_boundaries.121.create_multi_view_source_right
    status: supported
    kind: statement
    feature: views_multi_source_boundary
    compatibility: mysql
    requires: [create_view]
    sql: |
      create or replace view qs_mysql_compat_multi_view_right as
      select o_orderkey as order_key, o_custkey as customer_key
      from orders

  - id: mysql_compat_views_boundaries.122.join_two_view_sources
    status: xfail
    kind: query
    feature: views_multi_source_boundary
    compatibility: mysql
    requires: [select, view_reference, inner_join]
    issue: "Outer queries with multiple logical view sources are not expandable yet."
    sql: |
      select l.customer_key, r.order_key
      from qs_mysql_compat_multi_view_left as l
      inner join qs_mysql_compat_multi_view_right as r on r.customer_key = l.customer_key
      where r.order_key = 1

  - id: mysql_compat_views_boundaries.123.drop_multi_view_source_right
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_multi_view_right

  - id: mysql_compat_views_boundaries.124.drop_multi_view_source_left
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_multi_view_left

  - id: mysql_compat_views_boundaries.130.create_subquery_view_source
    status: supported
    kind: statement
    feature: views_subquery_boundary
    compatibility: mysql
    requires: [create_view]
    sql: |
      create or replace view qs_mysql_compat_subquery_view as
      select c_custkey as customer_key
      from customer

  - id: mysql_compat_views_boundaries.131.view_used_in_subquery
    status: xfail
    kind: query
    feature: views_subquery_boundary
    compatibility: mysql
    requires: [select, view_reference, subquery]
    issue: "View references inside subqueries are not expandable yet."
    sql: |
      select count(*) as customer_count
      from customer
      where c_custkey in (
        select customer_key
        from qs_mysql_compat_subquery_view
        where customer_key = 1
      )

  - id: mysql_compat_views_boundaries.132.drop_subquery_view_source
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_subquery_view

  - id: mysql_compat_views_boundaries.140.create_metadata_view
    status: supported
    kind: statement
    feature: views_metadata_boundary
    compatibility: mysql
    requires: [create_view]
    sql: |
      create or replace view qs_mysql_compat_metadata_view as
      select r_regionkey as region_key, r_name as region_name
      from region

  - id: mysql_compat_views_boundaries.141.show_create_view
    status: supported
    kind: query
    feature: views_metadata_boundary
    compatibility: mysql
    requires: [show_create_view]
    sql: |
      show create view qs_mysql_compat_metadata_view
    expect:
      columns: [View, Create View, character_set_client, collation_connection]
      row_count: 1

  - id: mysql_compat_views_boundaries.142.describe_view
    status: supported
    kind: query
    feature: views_metadata_boundary
    compatibility: mysql
    requires: [describe, view_reference]
    sql: |
      describe qs_mysql_compat_metadata_view
    expect:
      columns: [Field, Type, "Null", Key, Default, Extra]

  - id: mysql_compat_views_boundaries.143.drop_metadata_view
    status: supported
    kind: statement
    feature: views_ddl_boundary
    compatibility: mysql
    requires: [drop_view]
    sql: |
      drop view qs_mysql_compat_metadata_view
