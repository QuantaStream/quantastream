version: 1
name: inabox_direct_joins

tests:
  - id: inabox_direct_joins.001.drop_orders
    status: supported
    kind: admin
    sql: |-
      drop orders_qa

  - id: inabox_direct_joins.002.drop_customers
    status: supported
    kind: admin
    sql: |-
      drop customers_qa

  - id: inabox_direct_joins.003.create_customers
    status: supported
    kind: admin
    sql: |-
      create customers_qa

  - id: inabox_direct_joins.004.create_orders
    status: supported
    kind: admin
    sql: |-
      create orders_qa

  - id: inabox_direct_joins.005.insert_customer_abe
    status: supported
    kind: statement
    sql: |-
      insert into customers_qa (cust_id, first_name, city) values ('1', 'Abe', 'Seattle')

  - id: inabox_direct_joins.006.insert_customer_abby
    status: supported
    kind: statement
    sql: |-
      insert into customers_qa (cust_id, first_name, city) values ('2', 'Abby', 'Tacoma')

  - id: inabox_direct_joins.007.insert_order_1001
    status: supported
    kind: statement
    sql: |-
      insert into orders_qa (cust_id, order_id, order_date, ship_via) values ('1', '1001', '2023-06-01T01:00:00', 'UPS')

  - id: inabox_direct_joins.008.insert_order_1002
    status: supported
    kind: statement
    sql: |-
      insert into orders_qa (cust_id, order_id, order_date, ship_via) values ('1', '1002', '2023-06-01T02:00:00', 'UPS')

  - id: inabox_direct_joins.009.insert_order_2001
    status: supported
    kind: statement
    sql: |-
      insert into orders_qa (cust_id, order_id, order_date, ship_via) values ('2', '2001', '2023-06-02T03:00:00', 'FEDEX')

  - id: inabox_direct_joins.010.commit
    status: supported
    kind: statement
    sql: |-
      commit

  - id: inabox_direct_joins.020.customer_orders_inner_join_boundary
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector]
    sql: |-
      select count(*) as join_count
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
    expect:
      rows:
        - [3]

  - id: inabox_direct_joins.021.customer_orders_inner_join_child_projection
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, projection]
    sql: |-
      select o.order_id
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
    expect:
      rows:
        - [1001]
        - [1002]
        - [2001]

  - id: inabox_direct_joins.022.customer_orders_inner_join_parent_child_projection
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, projection]
    sql: |-
      select c.first_name, o.order_id
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
    expect:
      rows:
        - [Abe, 1001]
        - [Abe, 1002]
        - [Abby, 2001]

  - id: inabox_direct_joins.023.customer_orders_inner_join_parent_filter_count
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, where]
    sql: |-
      select count(*) as join_count
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      where c.city = 'Seattle'
    expect:
      rows:
        - [2]

  - id: inabox_direct_joins.024.orders_string_hash_filter_count
    status: supported
    kind: query
    capabilities: [where, string-hash-bsi]
    sql: |-
      select count(*) as order_count
      from orders_qa
      where ship_via = 'FEDEX'
    expect:
      rows:
        - [1]

  - id: inabox_direct_joins.025.customer_orders_inner_join_child_filter_projection
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, projection, where, string-hash-bsi]
    sql: |-
      select c.first_name, o.order_id
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      where o.ship_via = 'FEDEX'
    expect:
      rows:
        - [Abby, 2001]

  - id: inabox_direct_joins.026.orders_string_hash_in_filter_count
    status: supported
    kind: query
    capabilities: [where, string-hash-bsi, in]
    sql: |-
      select count(*) as order_count
      from orders_qa
      where ship_via in ('FEDEX', 'UPS')
    expect:
      rows:
        - [3]

  - id: inabox_direct_joins.027.orders_string_hash_not_in_filter_count
    status: supported
    kind: query
    capabilities: [where, string-hash-bsi, not-in]
    sql: |-
      select count(*) as order_count
      from orders_qa
      where ship_via not in ('UPS')
    expect:
      rows:
        - [1]

  - id: inabox_direct_joins.028.customer_orders_inner_join_child_in_filter_projection
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, projection, where, string-hash-bsi, in]
    sql: |-
      select c.first_name, o.order_id
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      where o.ship_via in ('FEDEX')
    expect:
      rows:
        - [Abby, 2001]

  - id: inabox_direct_joins.029.customer_orders_inner_join_parent_child_filter_count
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, where, string-hash-bsi]
    sql: |-
      select count(*) as join_count
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      where c.city = 'Tacoma'
        and o.ship_via = 'FEDEX'
    expect:
      rows:
        - [1]

  - id: inabox_direct_joins.030.customer_orders_inner_join_parent_child_filter_projection
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, projection, where, string-hash-bsi]
    sql: |-
      select c.first_name, o.order_id
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      where c.city = 'Tacoma'
        and o.ship_via = 'FEDEX'
    expect:
      rows:
        - [Abby, 2001]

  - id: inabox_direct_joins.031.orders_timestamp_filter_count
    status: supported
    kind: query
    capabilities: [where, timestamp-bsi]
    sql: |-
      select count(*) as order_count
      from orders_qa
      where order_date >= '2023-06-02'
    expect:
      rows:
        - [1]

  - id: inabox_direct_joins.032.customer_orders_inner_join_timestamp_filter_projection
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, projection, where, timestamp-bsi]
    sql: |-
      select c.first_name, o.order_id
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      where o.order_date >= '2023-06-02'
    expect:
      rows:
        - [Abby, 2001]

  - id: inabox_direct_joins.033.customer_orders_inner_join_filtered_sum_child_aggregate
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, aggregate, where]
    sql: |-
      select sum(o.order_id) as order_total
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      where c.city = 'Seattle'
    expect:
      rows:
        - [2003]

  - id: inabox_direct_joins.034.customer_orders_inner_join_grouped_count
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, aggregate, group-by]
    sql: |-
      select c.first_name, count(*) as order_count
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      group by c.first_name
      order by c.first_name
    expect:
      rows:
        - [Abby, 1]
        - [Abe, 2]

  - id: inabox_direct_joins.035.customer_orders_inner_join_grouped_sum_order_limit
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, aggregate, group-by, order-by, limit]
    sql: |-
      select c.first_name, sum(o.order_id) as order_total
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      group by c.first_name
      order by order_total desc
      limit 1
    expect:
      rows:
        - [Abe, 2003]

  - id: inabox_direct_joins.036.customer_orders_inner_join_grouped_avg_min_max
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, aggregate, group-by]
    sql: |-
      select c.first_name,
             avg(o.order_id) as avg_order_id,
             min(o.order_id) as min_order_id,
             max(o.order_id) as max_order_id
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      group by c.first_name
      order by c.first_name
    expect:
      rows:
        - [Abby, 2001, 2001, 2001]
        - [Abe, 1001.5, 1001, 1002]

  - id: inabox_direct_joins.037.customer_orders_inner_join_grouped_having_sum
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, aggregate, group-by, having]
    sql: |-
      select c.first_name, sum(o.order_id) as order_total
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      group by c.first_name
      having order_total > 2001
      order by c.first_name
    expect:
      rows:
        - [Abe, 2003]

  - id: inabox_direct_joins.038.customer_orders_inner_join_grouped_multi_order
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, aggregate, group-by, order-by]
    sql: |-
      select c.first_name, count(*) as order_count
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      group by c.first_name
      order by order_count desc, c.first_name
    expect:
      rows:
        - [Abe, 2]
        - [Abby, 1]

  - id: inabox_direct_joins.039.customer_orders_inner_join_multi_grouped_count
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, aggregate, group-by, order-by]
    sql: |-
      select c.city, c.first_name, count(*) as order_count
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      group by c.city, c.first_name
      order by c.city, c.first_name
    expect:
      rows:
        - [Seattle, Abe, 2]
        - [Tacoma, Abby, 1]

  - id: inabox_direct_joins.040.customer_orders_inner_join_grouped_count_distinct
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, aggregate, group-by, distinct]
    sql: |-
      select c.first_name, count(distinct o.ship_via) as carrier_count
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
      group by c.first_name
      order by c.first_name
    expect:
      rows:
        - [Abby, 1]
        - [Abe, 1]

  - id: inabox_direct_joins.041.customer_orders_inner_join_count_distinct
    status: supported
    kind: query
    capabilities: [inner-join, relationship-vector, aggregate, distinct]
    sql: |-
      select count(distinct o.ship_via) as carrier_count
      from customers_qa as c
      inner join orders_qa as o on o.cust_id = c.cust_id
    expect:
      rows:
        - [2]
