version: 1
name: mysql_compat_functions_boundaries

tests:
  - id: mysql_compat_functions_boundaries.001.substring_from_for_syntax
    status: supported
    kind: query
    order: exact
    feature: scalar_functions_string_boundary
    compatibility: mysql
    requires: [select, substring]
    sql: |
      select substring('alphabet' from 2 for 3) as value
    expect:
      columns: [value]
      rows:
        - [lph]

  - id: mysql_compat_functions_boundaries.002.trim_leading_from_syntax
    status: supported
    kind: query
    order: exact
    feature: scalar_functions_string_boundary
    compatibility: mysql
    requires: [select, trim]
    sql: |
      select trim(leading 'x' from 'xxxstream') as value
    expect:
      columns: [value]
      rows:
        - [stream]

  - id: mysql_compat_functions_boundaries.003.date_format_literal
    status: supported
    kind: query
    order: exact
    feature: scalar_functions_datetime_boundary
    compatibility: mysql
    requires: [select, date_format]
    sql: |
      select date_format('1995-03-15', '%Y-%m') as value
    expect:
      columns: [value]
      rows:
        - [1995-03]

  - id: mysql_compat_functions_boundaries.004.locate_literal
    status: supported
    kind: query
    order: exact
    feature: scalar_functions_string_boundary
    compatibility: mysql
    requires: [select, locate]
    sql: |
      select locate('stream', 'quantastream') as value
    expect:
      columns: [value]
      rows:
        - [7]

  - id: mysql_compat_functions_boundaries.005.greatest_least_literal
    status: supported
    kind: query
    order: exact
    feature: scalar_functions_comparison_boundary
    compatibility: mysql
    requires: [select, greatest, least]
    sql: |
      select greatest(3, 7, 4) as greatest_value, least(3, 7, 4) as least_value
    expect:
      columns: [greatest_value, least_value]
      rows:
        - [7, 3]

  - id: mysql_compat_functions_boundaries.006.cast_signed_literal
    status: supported
    kind: query
    order: exact
    feature: scalar_functions_cast_boundary
    compatibility: mysql
    requires: [select, cast]
    sql: |
      select cast('42' as signed) as value
    expect:
      columns: [value]
      rows:
        - [42]

  - id: mysql_compat_functions_boundaries.007.numeric_literal_functions
    status: supported
    kind: query
    order: exact
    feature: scalar_functions_numeric_boundary
    compatibility: mysql
    requires: [select, floor, ceiling, truncate, mod, power, sign]
    sql: |
      select floor(3.8) as floor_value,
             ceiling(3.2) as ceiling_value,
             truncate(3.14159, 2) as truncate_value,
             mod(17, 5) as mod_value,
             power(2, 3) as power_value,
             sign(0 - 7) as sign_value
    expect:
      columns: [floor_value, ceiling_value, truncate_value, mod_value, power_value, sign_value]
      rows:
        - [3, 4, 3.14, 2, 8, -1]

  - id: mysql_compat_functions_boundaries.008.string_breadth_literal_functions
    status: supported
    kind: query
    order: exact
    feature: scalar_functions_string_boundary
    compatibility: mysql
    requires: [select, concat_ws, repeat, reverse, lpad, rpad, ascii]
    sql: |
      select concat_ws('|', 'quanta', 'stream') as joined_value,
             repeat('ha', 3) as repeat_value,
             reverse('stream') as reverse_value,
             lpad('42', 5, '0') as lpad_value,
             rpad('QS', 5, '.') as rpad_value,
             ascii('QuantaStream') as ascii_value
    expect:
      columns: [joined_value, repeat_value, reverse_value, lpad_value, rpad_value, ascii_value]
      rows:
        - [quanta|stream, hahaha, maerts, "00042", QS..., 81]

  - id: mysql_compat_functions_boundaries.009.date_helper_literal_functions
    status: supported
    kind: query
    order: exact
    feature: scalar_functions_datetime_boundary
    compatibility: mysql
    requires: [select, date, dayname, monthname, quarter, week]
    sql: |
      select date('1995-03-15 04:05:06') as date_value,
             dayname('1995-03-15') as day_name,
             monthname('1995-03-15') as month_name,
             quarter('1995-03-15') as quarter_value,
             week('1995-03-15') as week_value
    expect:
      columns: [date_value, day_name, month_name, quarter_value, week_value]
      rows:
        - ["1995-03-15", Wednesday, March, 1, 11]

  - id: mysql_compat_functions_boundaries.010.null_control_literal_functions
    status: supported
    kind: query
    order: exact
    feature: scalar_functions_null_control_boundary
    compatibility: mysql
    requires: [select, isnull, if]
    sql: |
      select isnull(null) as null_check,
             isnull('value') as value_check,
             if(1, 'yes', 'no') as true_value,
             if(0, 'yes', 'no') as false_value,
             if(null, 'yes', 'no') as null_value
    expect:
      columns: [null_check, value_check, true_value, false_value, null_value]
      rows:
        - [1, 0, yes, no, no]
