version: 1
name: mysql_compat_functions_boundaries

tests:
  - id: mysql_compat_functions_boundaries.001.signed_float_scale_bsi_projection
    status: xfail
    kind: query
    order: exact
    feature: scalar_functions_numeric_signed_bsi_boundary
    compatibility: mysql
    requires: [select, abs, round, where, order_by, limit, signed_float_scale_bsi]
    issue: "Signed FloatScaleBSI values can materialize through the typed int64 projection fast path as unsigned-positive values."
    sql: |
      select c_custkey, round(abs(c_acctbal), 0) as abs_bal
      from customer
      where round(abs(c_acctbal), 0) >= 7000
      order by abs_bal desc, c_custkey
      limit 5
    expect:
      columns: [c_custkey, abs_bal]
      rows:
        - [213, 9988]
        - [45, 9983]
        - [1106, 9978]
        - [200, 9968]
        - [140, 9963]
