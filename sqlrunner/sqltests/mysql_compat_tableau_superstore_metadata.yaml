version: 1
name: mysql_compat_tableau_superstore_metadata

tests:
  - id: mysql_compat_tableau_superstore_metadata.001.show_databases
    status: supported
    kind: query
    feature: tableau_superstore_catalog_discovery
    compatibility: mysql
    requires: [show_databases]
    sql: |
      show databases

  - id: mysql_compat_tableau_superstore_metadata.002.use_database
    status: supported
    kind: statement
    feature: tableau_superstore_catalog_discovery
    compatibility: mysql
    requires: [use]
    sql: |
      use quanta

  - id: mysql_compat_tableau_superstore_metadata.003.show_tables
    status: supported
    kind: query
    feature: tableau_superstore_catalog_discovery
    compatibility: mysql
    requires: [show_tables]
    sql: |
      show tables

  - id: mysql_compat_tableau_superstore_metadata.004.show_full_tables
    status: supported
    kind: query
    feature: tableau_superstore_catalog_discovery
    compatibility: mysql
    requires: [show_full_tables]
    sql: |
      show full tables

  - id: mysql_compat_tableau_superstore_metadata.005.show_full_tables_from_schema_like
    status: supported
    kind: query
    feature: tableau_superstore_catalog_discovery
    compatibility: mysql
    requires: [show_full_tables, like]
    sql: |
      show full tables from `quanta` like 'superstore_orders'
    expect:
      columns: [Tables_in_quanta, Table_type]
      rows:
        - [superstore_orders, BASE TABLE]

  - id: mysql_compat_tableau_superstore_metadata.006.show_table_status
    status: supported
    kind: query
    feature: tableau_superstore_table_metadata
    compatibility: mysql
    requires: [show_table_status, like]
    sql: |
      show table status like 'superstore_orders'

  - id: mysql_compat_tableau_superstore_metadata.007.show_open_tables
    status: supported
    kind: query
    feature: tableau_superstore_table_metadata
    compatibility: mysql
    requires: [show_open_tables, like]
    sql: |
      show open tables from quanta like 'superstore_orders'

  - id: mysql_compat_tableau_superstore_metadata.010.show_columns
    status: supported
    kind: query
    feature: tableau_superstore_column_metadata
    compatibility: mysql
    requires: [show_columns]
    sql: |
      show columns from superstore_orders

  - id: mysql_compat_tableau_superstore_metadata.011.show_full_columns
    status: supported
    kind: query
    feature: tableau_superstore_column_metadata
    compatibility: mysql
    requires: [show_full_columns]
    sql: |
      show full columns from superstore_orders

  - id: mysql_compat_tableau_superstore_metadata.0111.show_full_columns_from_schema_like
    status: supported
    kind: query
    feature: tableau_superstore_column_metadata
    compatibility: mysql
    requires: [show_full_columns, like]
    sql: |
      show full columns from `superstore_orders` from `quanta` like '%'

  - id: mysql_compat_tableau_superstore_metadata.012.describe_table
    status: supported
    kind: query
    feature: tableau_superstore_column_metadata
    compatibility: mysql
    requires: [describe]
    sql: |
      describe superstore_orders

  - id: mysql_compat_tableau_superstore_metadata.013.show_indexes
    status: supported
    kind: query
    feature: tableau_superstore_index_metadata
    compatibility: mysql
    requires: [show_index]
    sql: |
      show indexes from superstore_orders

  - id: mysql_compat_tableau_superstore_metadata.014.show_keys_from_table_from_schema
    status: supported
    kind: query
    feature: tableau_superstore_index_metadata
    compatibility: mysql
    requires: [show_index]
    sql: |
      show keys from `superstore_orders` from `quanta`

  - id: mysql_compat_tableau_superstore_metadata.015.show_create_table
    status: supported
    kind: query
    feature: tableau_superstore_table_metadata
    compatibility: mysql
    requires: [show_create_table]
    sql: |
      show create table superstore_orders

  - id: mysql_compat_tableau_superstore_metadata.020.preview_rows_limit
    status: supported
    kind: query
    feature: tableau_superstore_preview
    compatibility: mysql
    requires: [select, projection, limit]
    sql: |
      select row_id,
             order_id,
             customer_name,
             region,
             category,
             sales,
             profit
      from superstore_orders
      limit 10

  - id: mysql_compat_tableau_superstore_metadata.021.preview_rows_ordered
    status: supported
    kind: query
    feature: tableau_superstore_preview
    compatibility: mysql
    requires: [select, aliases, order_by, limit]
    sql: |
      select s.row_id as row_id,
             s.order_id as order_id,
             s.customer_name as customer_name,
             s.region as region,
             s.category as category,
             s.sales as sales,
             s.profit as profit
      from superstore_orders as s
      order by s.row_id asc
      limit 10

  - id: mysql_compat_tableau_superstore_metadata.022.explain_preview_query
    status: supported
    kind: query
    feature: tableau_superstore_preview
    compatibility: mysql
    requires: [explain, select, aliases, limit]
    sql: |
      explain select s.row_id,
                     s.order_id,
                     s.customer_name
      from superstore_orders as s
      limit 5

  - id: mysql_compat_tableau_superstore_metadata.030.tableau_table_nonempty_validation
    status: supported
    kind: query
    feature: tableau_superstore_table_validation
    compatibility: mysql
    requires: [select, aggregate, having]
    sql: |
      select sum(1) as `cnt_superstore_orders_ok`
      from `superstore_orders`
      having (count(1) > 0)
