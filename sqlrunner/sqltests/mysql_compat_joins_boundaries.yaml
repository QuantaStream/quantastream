version: 1
name: mysql_compat_joins_boundaries

tests:
  - id: mysql_compat_joins_boundaries.001.derived_table_inner_join
    status: xfail
    kind: query
    order: exact
    feature: joins_derived_table_boundary
    compatibility: mysql
    requires: [select, derived_table, inner_join, aliases, order_by]
    issue: "Derived table sources are not accepted by the current simple parser."
    sql: |
      select c.name, o.order_id
      from (
        select 1 as cust_id, 'Abe' as name
        union all select 2, 'Abby'
      ) as c
      inner join (
        select 1001 as order_id, 1 as cust_id
        union all select 1002, 1
      ) as o on o.cust_id = c.cust_id
      order by o.order_id
    expect:
      columns: [name, order_id]
      rows:
        - [Abe, 1001]
        - [Abe, 1002]

  - id: mysql_compat_joins_boundaries.002.derived_table_left_join_null_extension
    status: xfail
    kind: query
    order: exact
    feature: joins_derived_table_boundary
    compatibility: mysql
    requires: [select, derived_table, left_join, null, order_by]
    issue: "Derived table sources are not accepted by the current simple parser."
    sql: |
      select c.name, o.order_id
      from (
        select 1 as cust_id, 'Abe' as name
        union all select 2, 'Abby'
      ) as c
      left join (
        select 1001 as order_id, 1 as cust_id
      ) as o on o.cust_id = c.cust_id
      order by c.cust_id
    expect:
      columns: [name, order_id]
      rows:
        - [Abe, 1001]
        - [Abby, null]

  - id: mysql_compat_joins_boundaries.003.right_join
    status: xfail
    kind: query
    order: exact
    feature: joins_right_outer_boundary
    compatibility: mysql
    requires: [select, table_scan, right_join, order_by, limit]
    issue: "RIGHT JOIN is not parsed yet; INNER and LEFT JOIN are supported for relationship-backed tables."
    sql: |
      select r.r_name as region_name, n.n_name as nation_name
      from nation as n
      right join region as r on r.r_regionkey = n.n_regionkey
      order by r.r_name, n.n_name
      limit 3
    expect:
      columns: [region_name, nation_name]
      rows:
        - [AFRICA, ALGERIA]
        - [AFRICA, ETHIOPIA]
        - [AFRICA, KENYA]

  - id: mysql_compat_joins_boundaries.004.left_join_on_residual_null_extension
    status: xfail
    kind: query
    order: exact
    feature: joins_left_outer_boundary
    compatibility: mysql
    requires: [select, table_scan, left_join, null, on_predicate, order_by]
    issue: "LEFT JOIN with residual ON predicates currently returns matched rows but does not yet preserve all null-extended left rows."
    sql: |
      select r.r_name as region_name, n.n_name as nation_name
      from region as r
      left join nation as n on n.n_regionkey = r.r_regionkey and n.n_name = 'CANADA'
      order by r.r_name
    expect:
      columns: [region_name, nation_name]
      rows:
        - [AFRICA, null]
        - [AMERICA, CANADA]
        - [ASIA, null]
        - [EUROPE, null]
        - [MIDDLE EAST, null]

  - id: mysql_compat_joins_boundaries.005.left_join_null_extension_projection
    status: xfail
    kind: query
    order: exact
    feature: joins_left_outer_boundary
    compatibility: mysql
    requires: [select, table_scan, left_join, null, where, order_by]
    issue: "LEFT JOIN null extension is not fully materialized through projection yet."
    sql: |
      select c.c_name as customer_name, o.o_orderkey as order_key
      from customer as c
      left join orders as o on o.o_custkey = c.c_custkey
      where c.c_custkey in (3, 6)
      order by c.c_custkey, o.o_orderkey
    expect:
      columns: [customer_name, order_key]
      rows:
        - [Customer#000000003, null]
        - [Customer#000000006, null]

  - id: mysql_compat_joins_boundaries.006.using_join
    status: xfail
    kind: query
    order: exact
    feature: joins_using_boundary
    compatibility: mysql
    requires: [select, table_scan, inner_join, using]
    issue: "JOIN ... USING syntax is not parsed yet; ON equality joins are supported."
    sql: |
      select count(*) as joined_rows
      from nation as n1
      inner join nation as n2 using (n_regionkey)
    expect:
      columns: [joined_rows]
      rows:
        - [125]
