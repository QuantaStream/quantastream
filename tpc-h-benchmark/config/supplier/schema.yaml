tableName: supplier
primaryKey: s_suppkey
selector: type="supplier"
attributes:
- fieldName: s_suppkey
  sourceName: /data/s_suppkey
  mappingStrategy: IntBSI
  type: Integer
  sourceOrdinal: 1
  columnID: true
- fieldName: s_name
  sourceName: /data/s_name
  mappingStrategy: StringLexBSI
  configuration:
    length: "25"
  type: String
  maxLen: 25
  sourceOrdinal: 2
- fieldName: s_address
  sourceName: /data/s_address
  mappingStrategy: StringLexBSI
  configuration:
    length: "40"
  type: String
  maxLen: 40
  sourceOrdinal: 3
- fieldName: s_nationkey
  sourceName: /data/s_nationkey
  mappingStrategy: ParentRelation
  type: Integer
  foreignKey: nation
  sourceOrdinal: 4
- fieldName: s_phone
  sourceName: /data/s_phone
  mappingStrategy: StringLexBSI
  configuration:
    length: "15"
  type: String
  maxLen: 15
  sourceOrdinal: 5
- fieldName: s_acctbal
  sourceName: /data/s_acctbal
  mappingStrategy: FloatScaleBSI
  type: Float
  scale: 2
  sourceOrdinal: 6
- fieldName: s_comment
  sourceName: /data/s_comment
  mappingStrategy: StringLexBSI
  configuration:
    length: "8"
  type: String
  maxLen: 256
  sourceOrdinal: 7
