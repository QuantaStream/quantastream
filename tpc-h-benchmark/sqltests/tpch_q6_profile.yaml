version: 1
name: "tpch_q6_profile"

tests:
  - id: "tpch_q6_profile.010_shipdate_1994_count"
    status: supported
    kind: query
    timeout: 60s
    capabilities: [tpch-q6, single-table, date-predicate, count]
    sql: |-
      select count(*) as line_count
      from lineitem as l
      where l.l_shipdate >= '1994-01-01'
        and l.l_shipdate < '1995-01-01'
    expect:
      row_count: 1

  - id: "tpch_q6_profile.020_discount_band_count"
    status: supported
    kind: query
    timeout: 60s
    capabilities: [tpch-q6, single-table, numeric-predicate, count]
    sql: |-
      select count(*) as line_count
      from lineitem as l
      where l.l_discount >= 0.05
        and l.l_discount <= 0.07
    expect:
      row_count: 1

  - id: "tpch_q6_profile.030_quantity_count"
    status: supported
    kind: query
    timeout: 60s
    capabilities: [tpch-q6, single-table, numeric-predicate, count]
    sql: |-
      select count(*) as line_count
      from lineitem as l
      where l.l_quantity < 24
    expect:
      row_count: 1

  - id: "tpch_q6_profile.040_full_filter_count"
    status: supported
    kind: query
    timeout: 60s
    capabilities: [tpch-q6, single-table, date-predicate, numeric-predicate, count]
    sql: |-
      select count(*) as line_count
      from lineitem as l
      where l.l_shipdate >= '1994-01-01'
        and l.l_shipdate < '1995-01-01'
        and l.l_discount >= 0.05
        and l.l_discount <= 0.07
        and l.l_quantity < 24
    expect:
      row_count: 1

  - id: "tpch_q6_profile.050_full_filter_extended_sum"
    status: supported
    kind: query
    timeout: 60s
    capabilities: [tpch-q6, single-table, date-predicate, numeric-predicate, aggregate]
    sql: |-
      select sum(l.l_extendedprice) as revenue
      from lineitem as l
      where l.l_shipdate >= '1994-01-01'
        and l.l_shipdate < '1995-01-01'
        and l.l_discount >= 0.05
        and l.l_discount <= 0.07
        and l.l_quantity < 24
    expect:
      row_count: 1

  - id: "tpch_q6_profile.060_full_filter_discounted_revenue"
    status: supported
    kind: query
    timeout: 60s
    capabilities: [tpch-q6, single-table, date-predicate, numeric-predicate, aggregate-expression]
    sql: |-
      select sum(l.l_extendedprice * l.l_discount) as revenue
      from lineitem as l
      where l.l_shipdate >= '1994-01-01'
        and l.l_shipdate < '1995-01-01'
        and l.l_discount >= 0.05
        and l.l_discount <= 0.07
        and l.l_quantity < 24
    expect:
      rows:
        - ["1.193053225300001e+06"]
