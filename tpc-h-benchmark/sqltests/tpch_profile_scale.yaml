version: 1
name: "tpch_profile_scale"

tests:
  - id: "tpch_profile_scale.q6.discounted_revenue"
    status: supported
    issue: "scale profile - formal Q6 single-table discounted revenue"
    timeout: 180s
    kind: query
    capabilities: [tpch-q6, single-table, filter, date-predicate, numeric-predicate, aggregate-expression, profile, scale-variable]
    sql: |-
      select sum(l.l_extendedprice * l.l_discount) as revenue
      from lineitem as l
      where l.l_shipdate >= '1994-01-01'
        and l.l_shipdate < '1995-01-01'
        and l.l_discount >= 0.05
        and l.l_discount <= 0.07
        and l.l_quantity < 24

  - id: "tpch_profile_scale.q12.shipmode_receiptdate_group_count"
    status: supported
    issue: "scale profile - Q12 receipt-date and shipmode grouping"
    timeout: 180s
    kind: query
    capabilities: [tpch-q12, single-table, in-predicate, date-predicate, group-by, profile, scale-variable]
    sql: |-
      select l_shipmode, count(*) as line_count
      from lineitem
      where l_shipmode in ('MAIL', 'SHIP')
        and l_receiptdate >= '1994-01-01'
        and l_receiptdate < '1995-01-01'
      group by l_shipmode

  - id: "tpch_profile_scale.q19.formal_discounted_revenue"
    status: supported
    issue: "scale profile - formal Q19 mixed-table OR discounted revenue"
    timeout: 180s
    kind: query
    capabilities: [tpch-q19, two-table-join, mixed-table-or, joined-predicate-pushdown, child-side-joined-aggregate-expression, profile, scale-variable]
    sql: |-
      select sum(l.l_extendedprice * (1 - l.l_discount)) as revenue
      from lineitem as l
      inner join part as p on p.p_partkey = l.l_partkey
      where
        (
          p.p_brand = 'Brand#12'
          and p.p_container in ('SM CASE', 'SM BOX', 'SM PACK', 'SM PKG')
          and l.l_quantity >= 1
          and l.l_quantity <= 11
          and p.p_size >= 1
          and p.p_size <= 5
          and l.l_shipmode in ('AIR', 'AIR REG')
          and l.l_shipinstruct = 'DELIVER IN PERSON'
        )
        or
        (
          p.p_brand = 'Brand#23'
          and p.p_container in ('MED BAG', 'MED BOX', 'MED PKG', 'MED PACK')
          and l.l_quantity >= 10
          and l.l_quantity <= 20
          and p.p_size >= 1
          and p.p_size <= 10
          and l.l_shipmode in ('AIR', 'AIR REG')
          and l.l_shipinstruct = 'DELIVER IN PERSON'
        )
        or
        (
          p.p_brand = 'Brand#34'
          and p.p_container in ('LG CASE', 'LG BOX', 'LG PACK', 'LG PKG')
          and l.l_quantity >= 20
          and l.l_quantity <= 30
          and p.p_size >= 1
          and p.p_size <= 15
          and l.l_shipmode in ('AIR', 'AIR REG')
          and l.l_shipinstruct = 'DELIVER IN PERSON'
        )

  - id: "tpch_profile_scale.q5.formal_revenue"
    status: supported
    issue: "scale profile - formal Q5 discounted revenue"
    timeout: 180s
    kind: query
    capabilities: [tpch-q5, six-table-join, field-comparison, filter, date-predicate, group-by, aggregate-expression, order-by, formal-q5, profile, scale-variable]
    sql: |-
      select n.n_name, sum(l.l_extendedprice * (1 - l.l_discount)) as revenue
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and c.c_nationkey = s.s_nationkey
        and o.o_orderdate >= '1994-01-01'
        and o.o_orderdate < '1995-01-01'
      group by n.n_name
      order by revenue desc
  - id: "tpch_profile_scale.q3.grouped_revenue_with_order_fields"
    status: supported
    issue: "scale profile - Q3 grouped revenue with parent order fields"
    timeout: 180s
    kind: query
    capabilities: [tpch-q3, three-table-join, filter, group-by, aggregate, parent-fields, profile, scale-variable]
    sql: |-
      select l.l_orderkey, sum(l.l_extendedprice) as revenue, o.o_orderdate, o.o_shippriority
      from customer as c
      inner join orders as o on c.c_custkey = o.o_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      where c.c_mktsegment = 'BUILDING'
      group by l.l_orderkey, o.o_orderdate, o.o_shippriority

  - id: "tpch_profile_scale.q11.german_supplier_value_having"
    status: supported
    issue: "scale profile - Q11 aggregate expression with alias-based HAVING"
    timeout: 180s
    kind: query
    capabilities: [tpch-q11, three-table-join, aggregate-expression, group-by, having, order-by, profile, scale-variable]
    sql: |-
      select s.s_suppkey, sum(ps.ps_supplycost * ps.ps_availqty) as value
      from partsupp as ps
      inner join supplier as s on s.s_suppkey = ps.ps_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      where n.n_name = 'GERMANY'
      group by s.s_suppkey
      having value > 190000000
      order by value desc

  - id: "tpch_profile_scale.q10.revenue_by_customer"
    status: supported
    issue: "scale profile - Q10 returned-item revenue by customer"
    timeout: 180s
    kind: query
    capabilities: [tpch-q10, three-table-join, filter, date-predicate, group-by, aggregate-expression, order-by, limit, profile, scale-variable]
    sql: |-
      select c.c_custkey, c.c_name, sum(l.l_extendedprice * (1 - l.l_discount)) as revenue
      from customer as c
      inner join orders as o on c.c_custkey = o.o_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      where o.o_orderdate >= '1993-10-01'
        and o.o_orderdate < '1994-01-01'
        and l.l_returnflag = 'R'
      group by c.c_custkey, c.c_name
      order by revenue desc
      limit 20

  - id: "tpch_profile_scale.q5.same_nation_combined_graph_count"
    status: supported
    issue: "scale profile - formal Q5 same-nation count"
    timeout: 180s
    kind: query
    capabilities: [tpch-q5, six-table-join, filter, group-by, count, formal-q5, profile, scale-variable]
    sql: |-
      select n.n_name, count(*) as line_count
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and c.c_nationkey = s.s_nationkey
      group by n.n_name

  - id: "tpch_profile_scale.q5.combined_graph_regional_count"
    status: supported
    issue: "scale profile - count-only Q5 graph query"
    timeout: 180s
    kind: query
    capabilities: [tpch-q5, six-table-join, filter, group-by, count, profile, scale-variable]
    sql: |-
      select n.n_name, count(*) as line_count
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
      group by n.n_name

  - id: "tpch_profile_scale.q5.simple_regional_revenue"
    status: supported
    issue: "scale profile - Q5 revenue without discount expression"
    timeout: 180s
    kind: query
    capabilities: [tpch-q5, six-table-join, filter, date-predicate, group-by, aggregate, profile, scale-variable]
    sql: |-
      select n.n_name, sum(l.l_extendedprice) as revenue
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and o.o_orderdate >= '1994-01-01'
        and o.o_orderdate < '1995-01-01'
      group by n.n_name

  - id: "tpch_profile_scale.q5.regional_revenue_ordering"
    status: supported
    issue: "scale profile - Q5 revenue with order by"
    timeout: 180s
    kind: query
    capabilities: [tpch-q5, six-table-join, filter, date-predicate, group-by, aggregate, order-by, profile, scale-variable]
    sql: |-
      select n.n_name, sum(l.l_extendedprice) as revenue
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and o.o_orderdate >= '1994-01-01'
        and o.o_orderdate < '1995-01-01'
      group by n.n_name
      order by revenue desc

