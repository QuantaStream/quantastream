  - id: "tpch_queries.q5.055_same_nation_combined_graph_count"
    status: supported
    issue: "performance - formal Q5 same-nation graph count is supported but still near the default 30s runner timeout"
    timeout: 60s
    kind: query
    order: rowsort
    capabilities: [tpch-q5, six-table-join, filter, group-by, count, formal-q5]
    sql: |-
      select n.n_name, count(*) as line_count
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and c.c_nationkey = s.s_nationkey
      group by n.n_name
    expect:
      row_count: 5

  - id: "tpch_queries.q5.060_combined_graph_regional_count"
