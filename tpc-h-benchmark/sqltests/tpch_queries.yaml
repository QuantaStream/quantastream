version: 1
name: "tpch_queries"

tests:

  - id: "tpch_queries.q1.grouped_lineitem_shape"
    status: supported
    kind: query
    order: rowsort
    capabilities: [tpch-q1, group-by, multiple-aggregates]
    sql: |-
      select l_returnflag, l_linestatus, count(*) as count_order
      from lineitem
      group by l_returnflag, l_linestatus
    expect:
      rows:
        - ["A", "F", 14876]
        - ["N", "F", 348]
        - ["N", "O", 30049]
        - ["R", "F", 14902]

  - id: "tpch_queries.q2.010_europe_brass_part_count"
    status: supported
    kind: query
    order: exact
    capabilities: [tpch-q2, five-table-join, string-enum-like, suffix-like, numeric-predicate, count]
    sql: |-
      select count(*) as europe_brass_part_count
      from part as p
      inner join partsupp as ps on ps.ps_partkey = p.p_partkey
      inner join supplier as s on s.s_suppkey = ps.ps_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where p.p_size = 15
        and p.p_type like '%BRASS'
        and r.r_name = 'EUROPE'
    expect:
      rows:
        - [5]

  - id: "tpch_queries.q2.020_europe_brass_part_projection"
    status: supported
    kind: query
    capabilities: [tpch-q2, five-table-join, string-enum-like, suffix-like, numeric-predicate, projection]
    sql: |-
      select p.p_partkey, p.p_mfgr, s.s_suppkey, ps.ps_supplycost
      from part as p
      inner join partsupp as ps on ps.ps_partkey = p.p_partkey
      inner join supplier as s on s.s_suppkey = ps.ps_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where p.p_size = 15
        and p.p_type like '%BRASS'
        and r.r_name = 'EUROPE'
    expect:
      row_count: 5

  - id: "tpch_queries.q2.030_europe_brass_low_cost_count"
    status: supported
    kind: query
    order: exact
    capabilities: [tpch-q2, five-table-join, string-enum-like, suffix-like, numeric-predicate, count]
    sql: |-
      select count(*) as europe_brass_low_cost_count
      from part as p
      inner join partsupp as ps on ps.ps_partkey = p.p_partkey
      inner join supplier as s on s.s_suppkey = ps.ps_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where p.p_size = 15
        and p.p_type like '%BRASS'
        and r.r_name = 'EUROPE'
        and ps.ps_supplycost < 300
    expect:
      rows:
