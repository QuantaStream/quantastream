  - id: "tpch_queries.q3.047_grouped_revenue_limit"
    status: supported
    issue: "performance - projecting o_orderdate for grouped Q3 scans many YMD timeRangeBSI fragments before LIMIT can be applied"
    timeout: 60s
    kind: query
    capabilities: [tpch-q3, three-table-join, group-by, aggregate, limit]
    sql: |-
      select l.l_orderkey, sum(l.l_extendedprice) as revenue, o.o_orderdate, o.o_shippriority
