      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
      group by n.n_name
    expect:
      rows:
        - ["CHINA", 4290]
        - ["INDIA", 3098]
        - ["INDONESIA", 2988]
        - ["JAPAN", 2447]
        - ["VIETNAM", 3641]

  - id: "tpch_queries.q5.070_simple_regional_revenue"
    status: supported
    issue: "baseline Q5 revenue without discount arithmetic"
    kind: query
    order: rowsort
    capabilities:
      [tpch-q5, six-table-join, filter, date-predicate, group-by, aggregate]
    sql: |-
      select n.n_name, sum(l.l_extendedprice) as revenue
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and o.o_orderdate >= '1994-01-01'
        and o.o_orderdate < '1995-01-01'
      group by n.n_name
    expect:
      rows:
        - ["CHINA", "23582877.89"]
        - ["INDIA", "17102746.02"]
        - ["INDONESIA", "16103423.74"]
        - ["JAPAN", "13190756.10"]
        - ["VIETNAM", "20186581.99"]

  - id: "tpch_queries.q5.080_regional_revenue_ordering"
    status: supported
    kind: query
    order: rowsort
    capabilities:
      [
        tpch-q5,
        six-table-join,
        filter,
        date-predicate,
        group-by,
        aggregate,
        order-by,
        benchmark-roadmap,
      ]
    sql: |-
      select n.n_name, sum(l.l_extendedprice) as revenue
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and o.o_orderdate >= '1994-01-01'
        and o.o_orderdate < '1995-01-01'
      group by n.n_name
      order by revenue desc
    expect:
      rows:
        - ["CHINA", "23582877.89"]
        - ["VIETNAM", "20186581.99"]
        - ["INDIA", "17102746.02"]
        - ["INDONESIA", "16103423.74"]
        - ["JAPAN", "13190756.10"]

  - id: "tpch_queries.q5.formal_revenue"
    status: supported
    issue: "performance - formal Q5 revenue is supported but remains a multi-second six-table grouped join"
    timeout: 60s
    kind: query
    capabilities:
      [
        tpch-q5,
        six-table-join,
        field-comparison,
        filter,
        date-predicate,
        group-by,
        aggregate-expression,
        order-by,
        formal-q5,
      ]
    sql: |-
      select n.n_name, sum(l.l_extendedprice * (1 - l.l_discount)) as revenue
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and c.c_nationkey = s.s_nationkey
        and o.o_orderdate >= '1994-01-01'
        and o.o_orderdate < '1995-01-01'
      group by n.n_name
      order by revenue desc
    expect:
      rows:
        - ["VIETNAM", "1000926.6999"]
        - ["CHINA", "740210.757"]
        - ["JAPAN", "660651.2425"]
        - ["INDONESIA", "566379.5276"]
        - ["INDIA", "422874.6844"]

  - id: "tpch_queries.q6.discounted_revenue"
    status: supported
    kind: query
    capabilities: [tpch-q6, single-table, filter, date-predicate, numeric-predicate, aggregate-expression]
    sql: |-
      select sum(l.l_extendedprice * l.l_discount) as revenue
      from lineitem as l
      where l.l_shipdate >= '1994-01-01'
        and l.l_shipdate < '1995-01-01'
        and l.l_discount >= 0.05
        and l.l_discount <= 0.07
        and l.l_quantity < 24
    expect:
      rows:
        - ["1.193053225300001e+06"]

