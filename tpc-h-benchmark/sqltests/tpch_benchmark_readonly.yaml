- id: tpch_benchmark_readonly.020.q3_grouped_revenue_limit
  status: supported
  kind: query
  order: exact
  capabilities:
  - tpch-q3
  - benchmark
  - read-only
  - sf005
  - local-cluster
  - three-table-join
  - group-by
