version: 1
name: "tpch_profile"

tests:
  - id: "tpch_profile.q6.discounted_revenue"
    status: supported
    issue: "profile target - formal Q6 single-table discounted revenue"
    timeout: 60s
    kind: query
    capabilities: [tpch-q6, single-table, filter, date-predicate, numeric-predicate, aggregate-expression, profile]
    sql: |-
      select sum(l.l_extendedprice * l.l_discount) as revenue
      from lineitem as l
      where l.l_shipdate >= '1994-01-01'
        and l.l_shipdate < '1995-01-01'
        and l.l_discount >= 0.05
        and l.l_discount <= 0.07
        and l.l_quantity < 24
    expect:
      rows:
        - ["1.193053225300001e+06"]

  - id: "tpch_profile.q12.shipmode_receiptdate_group_count"
    status: supported
    issue: "profile target - Q12 receipt-date and shipmode grouping"
    timeout: 60s
    kind: query
    order: rowsort
    capabilities: [tpch-q12, single-table, in-predicate, date-predicate, group-by, profile]
    sql: |-
      select l_shipmode, count(*) as line_count
      from lineitem
      where l_shipmode in ('MAIL', 'SHIP')
        and l_receiptdate >= '1994-01-01'
        and l_receiptdate < '1995-01-01'
      group by l_shipmode
    expect:
      rows:
        - ["MAIL", 1360]
        - ["SHIP", 1404]

  - id: "tpch_profile.q12.formal_lineitem_filter_group_count"
    status: supported
    issue: "profile target - Q12 shipmode, receipt date, and same-table date comparisons"
    timeout: 60s
    kind: query
    order: rowsort
    capabilities: [tpch-q12, single-table, in-predicate, date-predicate, field-comparison, group-by, profile]
    sql: |-
      select l_shipmode, count(*) as line_count
      from lineitem
      where l_shipmode in ('MAIL', 'SHIP')
        and l_commitdate < l_receiptdate
        and l_shipdate < l_commitdate
        and l_receiptdate >= '1994-01-01'
        and l_receiptdate < '1995-01-01'
      group by l_shipmode
    expect:
      rows:
        - ["MAIL", 150]
        - ["SHIP", 157]

  - id: "tpch_profile.q19.formal_discounted_revenue"
    status: supported
    issue: "profile target - formal Q19 mixed-table OR discounted revenue"
    timeout: 60s
    kind: query
    capabilities: [tpch-q19, two-table-join, mixed-table-or, joined-predicate-pushdown, child-side-joined-aggregate-expression, profile]
    sql: |-
      select sum(l.l_extendedprice * (1 - l.l_discount)) as revenue
      from lineitem as l
      inner join part as p on p.p_partkey = l.l_partkey
      where
        (
          p.p_brand = 'Brand#12'
          and p.p_container in ('SM CASE', 'SM BOX', 'SM PACK', 'SM PKG')
          and l.l_quantity >= 1
          and l.l_quantity <= 11
          and p.p_size >= 1
          and p.p_size <= 5
          and l.l_shipmode in ('AIR', 'AIR REG')
          and l.l_shipinstruct = 'DELIVER IN PERSON'
        )
        or
        (
          p.p_brand = 'Brand#23'
          and p.p_container in ('MED BAG', 'MED BOX', 'MED PKG', 'MED PACK')
          and l.l_quantity >= 10
          and l.l_quantity <= 20
          and p.p_size >= 1
          and p.p_size <= 10
          and l.l_shipmode in ('AIR', 'AIR REG')
          and l.l_shipinstruct = 'DELIVER IN PERSON'
        )
        or
        (
          p.p_brand = 'Brand#34'
          and p.p_container in ('LG CASE', 'LG BOX', 'LG PACK', 'LG PKG')
          and l.l_quantity >= 20
          and l.l_quantity <= 30
          and p.p_size >= 1
          and p.p_size <= 15
          and l.l_shipmode in ('AIR', 'AIR REG')
          and l.l_shipinstruct = 'DELIVER IN PERSON'
        )
    expect:
      columns: [revenue]
      numeric_tolerance: 0.01
      rows:
        - ["22923.03"]

  - id: "tpch_profile.q5.formal_revenue"
    status: supported
    issue: "profile target - formal Q5 discounted revenue"
    timeout: 60s
    kind: query
    capabilities: [tpch-q5, six-table-join, field-comparison, filter, date-predicate, group-by, aggregate-expression, order-by, formal-q5, profile]
    sql: |-
      select n.n_name, sum(l.l_extendedprice * (1 - l.l_discount)) as revenue
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and c.c_nationkey = s.s_nationkey
        and o.o_orderdate >= '1994-01-01'
        and o.o_orderdate < '1995-01-01'
      group by n.n_name
      order by revenue desc
    expect:
      numeric_tolerance: 0.01
      rows:
        - ["VIETNAM", "1000926.70"]
        - ["CHINA", "740210.76"]
        - ["JAPAN", "660651.24"]
        - ["INDONESIA", "566379.53"]
        - ["INDIA", "422874.68"]
  - id: "tpch_profile.q3.grouped_revenue_with_order_fields"
    status: supported
    issue: "profile comparator - Q3 grouped revenue with parent order fields"
    timeout: 60s
    kind: query
    capabilities: [tpch-q3, three-table-join, filter, group-by, aggregate, parent-fields, profile]
    sql: |-
      select l.l_orderkey, sum(l.l_extendedprice) as revenue, o.o_orderdate, o.o_shippriority
      from customer as c
      inner join orders as o on c.c_custkey = o.o_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      where c.c_mktsegment = 'BUILDING'
      group by l.l_orderkey, o.o_orderdate, o.o_shippriority
    expect:
      row_count: 3706

  - id: "tpch_profile.q11.german_supplier_value_having"
    status: supported
    issue: "profile sanity - Q11 aggregate expression with alias-based HAVING"
    timeout: 60s
    kind: query
    capabilities: [tpch-q11, three-table-join, aggregate-expression, group-by, having, order-by, profile]
    sql: |-
      select s.s_suppkey, sum(ps.ps_supplycost * ps.ps_availqty) as value
      from partsupp as ps
      inner join supplier as s on s.s_suppkey = ps.ps_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      where n.n_name = 'GERMANY'
      group by s.s_suppkey
      having value > 190000000
      order by value desc
    expect:
      rows:
        - [77, "205920583.56"]
        - [53, "193104538.04"]
        - [85, "191073777.31"]

  - id: "tpch_profile.q10.revenue_by_customer"
    status: supported
    issue: "profile target - Q10 returned-item revenue by customer"
    timeout: 60s
    kind: query
    capabilities: [tpch-q10, three-table-join, filter, date-predicate, group-by, aggregate-expression, order-by, limit, profile]
    sql: |-
      select c.c_custkey, c.c_name, sum(l.l_extendedprice * (1 - l.l_discount)) as revenue
      from customer as c
      inner join orders as o on c.c_custkey = o.o_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      where o.o_orderdate >= '1993-10-01'
        and o.o_orderdate < '1994-01-01'
        and l.l_returnflag = 'R'
