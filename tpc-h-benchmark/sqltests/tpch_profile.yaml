  - id: "tpch_profile.q5.same_nation_combined_graph_count"
    status: supported
    issue: "profile target - formal Q5 same-nation count"
    timeout: 60s
    kind: query
    order: rowsort
    capabilities: [tpch-q5, six-table-join, filter, group-by, count, formal-q5, profile]
    sql: |-
      select n.n_name, count(*) as line_count
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and c.c_nationkey = s.s_nationkey
      group by n.n_name
    expect:
      row_count: 5

  - id: "tpch_profile.q5.combined_graph_regional_count"
    status: supported
    issue: "profile target - slowest current count-only Q5 graph query"
    timeout: 60s
    kind: query
    order: rowsort
    capabilities: [tpch-q5, six-table-join, filter, group-by, count, profile]
    sql: |-
      select n.n_name, count(*) as line_count
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
      group by n.n_name
    expect:
      rows:
        - ["CHINA", 4290]
        - ["INDIA", 3098]
        - ["INDONESIA", 2988]
        - ["JAPAN", 2447]
        - ["VIETNAM", 3641]

  - id: "tpch_profile.q5.simple_regional_revenue"
    status: supported
    issue: "profile target - Q5 revenue without discount expression"
    timeout: 60s
    kind: query
    order: rowsort
    capabilities: [tpch-q5, six-table-join, filter, date-predicate, group-by, aggregate, profile]
    sql: |-
      select n.n_name, sum(l.l_extendedprice) as revenue
      from customer as c
      inner join orders as o on o.o_custkey = c.c_custkey
      inner join lineitem as l on l.l_orderkey = o.o_orderkey
      inner join supplier as s on s.s_suppkey = l.l_suppkey
      inner join nation as n on n.n_nationkey = s.s_nationkey
      inner join region as r on r.r_regionkey = n.n_regionkey
      where r.r_name = 'ASIA'
        and o.o_orderdate >= '1994-01-01'
        and o.o_orderdate < '1995-01-01'
      group by n.n_name
    expect:
      rows:
        - ["CHINA", "108715630.20"]
        - ["INDIA", "76932168.98"]
        - ["INDONESIA", "73272169.29"]
        - ["JAPAN", "61566824.17"]
        - ["VIETNAM", "90520443.70"]

